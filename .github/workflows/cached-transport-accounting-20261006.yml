name: Report2 Original Cache Transport Accounting
on:
  push:
    branches: [codex/cached-transport-accounting-20261006]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fresh owner before tests and replay
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='848f5e11a4f5be2905cde37c7f5ab7662f3119ea')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261006T051728986Z:cached-transport-accounting'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Assemble exact runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Verify current binding, generation and lifecycle policy
        run: |
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          node current-generation/validate.mjs > audit-output/validation.json 2> audit-output/validation-errors.txt
          REPORT2_CACHE_TRANSPORT_ROOT=runtime/src node --test current-generation/tests/cached-transport-accounting.test.mjs > audit-output/cached-transport-accounting.tap
          node --test current-generation/tests/sector-context.test.mjs current-generation/tests/shared-sector-batch.test.mjs current-generation/tests/coinpaprika-sector-evidence.test.mjs > audit-output/sector-regressions.tap
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
      - name: Exact package hashes
        if: always()
        run: |
          git rev-parse HEAD > audit-output/head.txt
          git rev-parse HEAD^{tree} > audit-output/tree.txt
          sha256sum runtime/src/evidence-source-store.mjs runtime/src/coingecko-sector-evidence.mjs runtime/src/coinpaprika-sector-evidence.mjs runtime/src/blockscout-index-evidence.mjs runtime/src/worker.js runtime/runner-main.mjs runtime/src/manual-run-summary.mjs runtime/src/canonical-runtime-adapter.mjs runtime/src/manual-report-formatter.mjs > audit-output/runtime-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cached-transport-accounting-${{ github.run_id }}
          path: audit-output/
          retention-days: 30


