name: Report 2 Shared Sector Joint Receipt Acceptance
on:
  push:
    branches: [autonomous/sector-joint-context-20261005]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Validate the changed consumer package once
        run: |
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
          node current-generation/validate.mjs > audit-output/validation.json
          node current-generation/tests/sector-context.runtime.mjs runtime > audit-output/sector-joint-runtime.json
          node --test runner/continuation-stage-gate.test.mjs > audit-output/continuation-stage-gate.tap
      - name: Verify exact saved source through shared joint consumer and read provider admission
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_CONTINUATION_OWNER: 'HTX:20261005T093648Z:bdbda5a1-e2c7-4311-944a-09a7e5a85a8c'
        run: node audit-fixes/sector-joint-context-20261005/verify-saved-use.mjs runtime > audit-output/sector-joint-acceptance.json
      - name: Exact runtime manifest
        if: always()
        run: |
          sha256sum runtime/src/manual-report-formatter.mjs runtime/src/sector-context.mjs runtime/src/block-result-context.mjs runtime/src/candidate-evidence-v2-runtime.mjs runtime/src/manual-run-summary.mjs > audit-output/runtime-sha256.txt
          git rev-parse HEAD > audit-output/github-head.txt
          git rev-parse HEAD^{tree} > audit-output/github-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sector-joint-context-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
