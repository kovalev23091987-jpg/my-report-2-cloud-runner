name: Retained Binance monthly original prices and cold consumer qualification
on:
  push:
    branches: [codex/monthly-price-history-20261009]
    paths: ['tools/read-binance-monthly-original-20261009.mjs','.github/workflows/binance-monthly-original-20261009.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact current main and own live lease
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(h!=='515e58f360559854c9811c50ced706945feb759d')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='CODEX:FULL_TZ:20261009:1791542831880'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');
            if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
      - name: Assemble verified runtime for unchanged source and D1 admission
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          node --check tools/read-binance-monthly-original-20261009.mjs
      - name: Retain six bounded original archives within statistics 16 and global 164
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: |
          node tools/read-binance-monthly-original-20261009.mjs > audit-output/acquisition-console.json
          git rev-parse HEAD > audit-output/head.txt
      - name: Qualify native schema units calendars and exact checksum-bound prices
        run: |
          python tools/qualify-binance-monthly-price.py --directory audit-output/binance-monthly > audit-output/qualification-console.json
          node tools/verify-binance-monthly-price.mjs audit-output/binance-monthly > audit-output/consumer-console.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binance-monthly-original-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
