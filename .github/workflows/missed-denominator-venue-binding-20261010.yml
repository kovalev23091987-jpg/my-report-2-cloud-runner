name: HTX missed-opportunity venue binding
on:
  push:
    branches: [codex/missed-denominator-venue-binding-20261010]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require active owner lease, no fence and exact review head
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json');
            const fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='chatgpt-cold-history-archive-20261010'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_LEASE_BLOCKED');
            const review=(await github.rest.git.getRef({owner,repo,ref:'heads/codex/missed-denominator-venue-binding-20261010'})).data.object.sha;
            if(review!==context.sha)throw Error('REVIEW_HEAD_MOVED');
      - name: Verify exact HTX venue binding and retained empty denominator
        run: |
          mkdir -p audit-output
          node --check current-generation/files/src/missed-opportunity-denominator.mjs
          node --test current-generation/tests/missed-opportunity-denominator.test.mjs > audit-output/venue-binding-tests.tap
          node tools/audit-retained-missed-opportunities-20261010.mjs
          git rev-parse HEAD > audit-output/tested-head.txt
          sha256sum current-generation/files/src/missed-opportunity-denominator.mjs current-generation/tests/missed-opportunity-denominator.test.mjs > audit-output/code-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: htx-missed-denominator-venue-binding-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
