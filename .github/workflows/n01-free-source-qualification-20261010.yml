name: Report2 N01 Free Source Actual Qualification
on:
  push:
    branches: [n01-free-source-qualification-20261010]
    paths: ['tools/qualify-n01-free-sources-20261010.mjs', '.github/workflows/n01-free-source-qualification-20261010.yml']
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fresh owner and unchanged main
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='f5e688e08237274ea539d94baaae9a51b86e9ab6')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='CODEX:N01_FREE_SOURCE_QUALIFICATION:1791626803588'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Acquire bounded original source responses
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/qualify-n01-free-sources-20261010.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n01-free-source-qualification-${{ github.run_id }}
          path: audit-output/n01-source-qualification/
          retention-days: 30
      - name: Retain exact original responses on review branch
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='f5e688e08237274ea539d94baaae9a51b86e9ab6')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='CODEX:N01_FREE_SOURCE_QUALIFICATION:1791626803588'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            const fs=require('fs'),owner=context.repo.owner,repo=context.repo.repo,ref=context.ref.replace('refs/','');
            const current=(await github.rest.git.getRef({owner,repo,ref})).data.object.sha;if(current!==context.sha)throw Error('SUPERSEDED_HEAD');
            const base=(await github.rest.git.getCommit({owner,repo,commit_sha:current})).data.tree.sha,entries=[];
            for(const name of fs.readdirSync('audit-output/n01-source-qualification')){
              const b=fs.readFileSync('audit-output/n01-source-qualification/'+name);
              const blob=(await github.rest.git.createBlob({owner,repo,content:b.toString('base64'),encoding:'base64'})).data;
              entries.push({path:'checkpoints/n01-free-source-qualification-'+context.runId+'/'+name,mode:'100644',type:'blob',sha:blob.sha});
            }
            const tree=(await github.rest.git.createTree({owner,repo,base_tree:base,tree:entries})).data;
            const commit=(await github.rest.git.createCommit({owner,repo,tree:tree.sha,parents:[current],message:'Retain actual N01 source qualification '+context.runId})).data;
            await github.rest.git.updateRef({owner,repo,ref,sha:commit.sha,force:false});
