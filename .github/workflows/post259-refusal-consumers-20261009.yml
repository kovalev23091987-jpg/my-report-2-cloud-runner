name: Original post259 typed refusals through exact current consumers
on:
  push:
    branches: [codex/entry-infrastructure-accounting-20261009]
    paths: ['tools/verify-post259-original-refusals.mjs','.github/workflows/post259-refusal-consumers-20261009.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require current main and own active lease
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='bcef3dab90a4870a21d7b6068a3ecd7f0d50c21e')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='CODEX:FULL_TZ:20261009:1791542831880'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
      - name: Restore exact original predicates and natural artifact
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo,b=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:11621621108,archive_format:'zip'})).data);if(crypto.createHash('sha256').update(b).digest('hex')!=='6135d9a5c5c8e01f09cf9e527cbc361d2d884996db4abb512fce1b0ad55d592b')throw Error('ORIGINAL_REFUSAL_DIGEST');fs.mkdirSync('original-refusals');fs.writeFileSync('original-refusals.zip',b);cp.execFileSync('unzip',['-q','original-refusals.zip','-d','original-refusals']);const n=fs.readFileSync('checkpoints/post259-natural-37937215275.zip');if(crypto.createHash('sha256').update(n).digest('hex')!=='60a946746e48f417aed8dc77297940268b30c7cd5363e02c7f067f1e789476de')throw Error('ORIGINAL_NATURAL_DIGEST');fs.mkdirSync('original-natural');cp.execFileSync('unzip',['-q','checkpoints/post259-natural-37937215275.zip','-d','original-natural']);
      - name: Assemble exact runtime and verify original reasons and renderer refusal
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          REPORT2_TEST_RUNTIME=runtime node tools/verify-post259-original-refusals.mjs original-refusals/post259-original-refusals.json original-natural/report2-run-result.json audit-output/current-original-refusal-consumers.json > audit-output/current-original-refusal-console.json
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          cmp runner/report2-d1-adapter.mjs runtime/report2-d1-adapter.mjs
          git rev-parse HEAD > audit-output/head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-refusal-consumers-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
