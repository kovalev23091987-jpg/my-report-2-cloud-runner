name: Report2 Bounded Current Veranta V2 Readonly Qualification
on:
  push:
    branches: [codex/veranta-v2-storage-abi-reuse-20261007]
    paths: ['tools/research-veranta-v2-storage-abi-reuse-20261007.mjs', '.github/workflows/veranta-v2-storage-abi-reuse-20261007.yml']
permissions:
  contents: write
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fresh main owner and fence guard
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='a54fcca4c56ba8c8c1c92610751f37444bb1510a')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64'));
            const p=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),f=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(p.lease?.owner!=='HTX:20261007:1791399140815:cache-only-full-register'||p.lease.expires_ts<=Date.now()||f.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            if((await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_HEAD_MOVED');
      - name: Assemble production admission modules without running report
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
          cmp current-generation/files/src/evidence-source-store.mjs runtime/src/evidence-source-store.mjs
          cmp current-generation/files/src/provider-minute-ledger.mjs runtime/src/provider-minute-ledger.mjs
      - name: Check current readonly candidate syntax
        run: node --check tools/research-veranta-v2-storage-abi-reuse-20261007.mjs
      - name: Fresh guard immediately before single bounded native batch
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;if(head!=='a54fcca4c56ba8c8c1c92610751f37444bb1510a')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64'));
            const p=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),f=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(p.lease?.owner!=='HTX:20261007:1791399140815:cache-only-full-register'||p.lease.expires_ts<=Date.now()||f.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            if((await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('SUPERSEDED_REVIEW_HEAD');
      - name: Read bounded current public API account route with existing ledgers
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/research-veranta-v2-storage-abi-reuse-20261007.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veranta-v2-storage-abi-reuse-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Retain actual bounded result including no-data result
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(main!=='a54fcca4c56ba8c8c1c92610751f37444bb1510a')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64'));
            const p=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),f=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(p.lease?.owner!=='HTX:20261007:1791399140815:cache-only-full-register'||p.lease.expires_ts<=Date.now()||f.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            const actual=JSON.parse(fs.readFileSync('audit-output/veranta-v2-storage-abi-reuse-proof.json'));if(actual.production_enabled||actual.MAIN!==0||actual.Telegram!==0||actual.source_http>2||actual.d1_usage.unknown_ops!==0)throw Error('BOUND_OR_ACTIVATION_NOT_CLOSED');
            const bytes=fs.readFileSync('audit-output/veranta-v2-storage-abi-reuse-raw.json.gz');if(crypto.createHash('sha256').update(bytes).digest('hex')!==actual.raw_gzip_sha256)throw Error('RAW_DIGEST_MISMATCH');
            const entries=[];for(const name of ['veranta-v2-storage-abi-reuse-proof.json','veranta-v2-storage-abi-reuse-raw.json.gz','assembly.json']){const blob=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('audit-output/'+name).toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/veranta-v2-storage-abi-reuse-'+context.runId+'/'+name,mode:'100644',type:'blob',sha:blob.sha});}
            const ref=context.ref.replace('refs/heads/','');if(ref!=='codex/veranta-v2-storage-abi-reuse-20261007')throw Error('REVIEW_REF_MISMATCH');const parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_HEAD_MOVED');
            const commit=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:commit.tree.sha,tree:entries})).data,created=(await github.rest.git.createCommit({owner,repo,message:'Retain current Veranta v2 bounded native qualification result without activation',tree:tree.sha,parents:[parent]})).data;await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:created.sha,force:false});console.log(JSON.stringify({proof_commit:created.sha,status:actual.status,production_enabled:false,MAIN:0,Telegram:0}));
