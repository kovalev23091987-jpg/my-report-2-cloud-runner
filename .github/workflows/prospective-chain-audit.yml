name: Report 2 Prospective Chain Audit
on:
  push:
    branches: [autonomous/prospective-audit-20260930]
    paths:
      - audit-fixes/source-optimization-20260930/read-prospective-state.mjs
      - .github/workflows/prospective-chain-audit.yml
permissions:
  contents: read
concurrency:
  group: report2-prospective-chain-audit
  cancel-in-progress: false
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
      REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
      REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
      REPORT2_V3_TELEGRAM_NETWORK: '0'
      REPORT2_DISABLE_TELEGRAM: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the unchanged production base
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/branches/main --jq .commit.sha)" = '2c1b121a96e6fb406d61715327083da1be034702'
      - name: Assemble current runtime without source requests
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          node -e "const fs=require('fs'),c=require('crypto');if(c.createHash('sha256').update(fs.readFileSync('runtime/src/worker.js')).digest('hex')!=='85aeb64cc2898f7066b22f27abdccec0ead0cb3fa8165260b59f76c4629ad55f')throw Error('WORKER_HASH_MISMATCH')"
      - name: Inspect bounded prospective chain without database writes
        run: node audit-fixes/source-optimization-20260930/read-prospective-state.mjs runtime audit-output/prospective-state.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prospective-chain-read-only-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
