name: Read Actual Fresh Joint Evidence
on:
  push:
    branches: [codex/read-fresh-joint-20261005]
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read exact existing fresh artifacts without source calls
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            fs.mkdirSync('audit-input',{recursive:true});
            for(const [id,name,expected] of [[11358093409,'fresh','7c8f865a33084ed118d0c0990e2e339a2530f5ee2feb047ed03c970213f13eea'],[11359155300,'telegram','3982016bd3d1910d7737d485f15954c3da3126de380b17afe2054047878bb907']]){
              const r=await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:id,archive_format:'zip'});
              const zip=Buffer.from(r.data),sha=crypto.createHash('sha256').update(zip).digest('hex');if(sha!==expected)throw Error('ARTIFACT_HASH_MISMATCH');fs.writeFileSync(`audit-input/${name}.zip`,zip);
            }
      - name: Inspect actual result and delivery proof
        run: |
          unzip -q audit-input/fresh.zip -d audit-input/fresh
          unzip -q audit-input/telegram.zip -d audit-input/telegram
          node current-generation/tests/read-fresh-joint.mjs audit-input > actual-fresh-joint-audit.json
          cat actual-fresh-joint-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: actual-fresh-joint-readback
          path: actual-fresh-joint-audit.json
          retention-days: 30
