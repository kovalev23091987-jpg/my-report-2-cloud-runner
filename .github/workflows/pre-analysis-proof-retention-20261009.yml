name: Retain exact early outcome originals and fair recent queue connected proof
on:
  push:
    branches: [codex/trigger-owner-read-failure-20261009]
    paths: ['.github/workflows/pre-analysis-proof-retention-20261009.yml']
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo,ref=context.ref.replace('refs/',''),main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(main!=='1416b1cb7906f4b17664afe92cfa41dd2f8c9e52')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='CODEX:FULL_TZ:20261009:1791542831880'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');
            if((await github.rest.git.getRef({owner,repo,ref})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
            const files=[[11617357270,"ce8a7b6ed8d477d7d35c715ddf967a91a85c02cb2bab5caaeb42925fe8254ef3","checkpoints/gram171-original-kick-read-37933704172.zip"],[11616949998,"c1805f4373ddb540921c8dadf43d1b0c3b17d37e44951a2a56e1f5af9386aafb","checkpoints/gram171-original-owner-read-37934183350.zip"],[11618421029,"72267cb1fef6b74e96363514d73ccc50b257806aff92defdc1c9a782230681f1","checkpoints/pre-analysis-failure-connected-37935207883.zip"]],tree=[];
            for(const [id,hash,path] of files){const bytes=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:id,archive_format:'zip'})).data);if(crypto.createHash('sha256').update(bytes).digest('hex')!==hash)throw Error('EXACT_ORIGINAL_DIGEST:'+id);const blob=(await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'})).data;tree.push({path,mode:'100644',type:'blob',sha:blob.sha});}
            const prior=(await github.rest.git.getCommit({owner,repo,commit_sha:context.sha})).data,created=(await github.rest.git.createTree({owner,repo,base_tree:prior.tree.sha,tree})).data,next=(await github.rest.git.createCommit({owner,repo,tree:created.sha,parents:[context.sha],message:'proof: retain original GRAM kick and owner reads and current pre-analysis failure tests'})).data;
            if((await github.rest.git.getRef({owner,repo,ref})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED_BEFORE_WRITE');
            await github.rest.git.updateRef({owner,repo,ref,sha:next.sha,force:false});
            core.info(JSON.stringify({status:'EXACT_CHAIN_AND_STATISTICAL_INPUTS_RETAINED',head:next.sha,files:tree.map(x=>x.path),sourceHTTP:0,D1:0,MAIN:0,Telegram:0,project_complete:false}));
