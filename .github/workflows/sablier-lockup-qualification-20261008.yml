name: Bounded exact HTX Sablier lockup qualification
on:
  push:
    branches: [codex/sablier-lockup-qualification-20261008]
    paths: ['tools/qualify-sablier-lockup-20261008.mjs', '.github/workflows/sablier-lockup-qualification-20261008.yml']
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact owned current main
        uses: actions/github-script@v7
        with:
          script: |
            const h=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;if(h!=='4b87c28a629757aebba677606edc7c6922e2ee5f')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const branch=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(branch!==context.sha)throw Error('REVIEW_MOVED');
      - name: Assemble already verified exact current runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          node --check tools/qualify-sablier-lockup-20261008.mjs
          cmp runtime/src/htx-asset-identity.mjs current-generation/files/src/htx-asset-identity.mjs
          cmp runtime/src/evidence-source-store.mjs current-generation/files/src/evidence-source-store.mjs
          cmp runtime/src/provider-minute-ledger.mjs current-generation/files/src/provider-minute-ledger.mjs
      - name: Recheck owner before bounded actual source qualification
        uses: actions/github-script@v7
        with:
          script: |
            const h=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;if(h!=='4b87c28a629757aebba677606edc7c6922e2ee5f')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const branch=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(branch!==context.sha)throw Error('REVIEW_MOVED');
      - name: One original-clock pinned lockup qualification within existing D1 and source caps
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/qualify-sablier-lockup-20261008.mjs
      - name: Upload actual retained response and measured usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-lockup-qualification-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
      - name: Retain actual proof without enabling unqualified provider
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const h=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;if(h!=='4b87c28a629757aebba677606edc7c6922e2ee5f')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const branch=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(branch!==context.sha)throw Error('REVIEW_MOVED');
            const fs=require('fs'),owner=context.repo.owner,repo=context.repo.repo;
            if(!fs.existsSync('audit-output/actual-lockup-qualification.json'))throw Error('NO_ACTUAL_PROOF');
            const p=JSON.parse(fs.readFileSync('audit-output/actual-lockup-qualification.json'));
            if(p.sourceHTTP>1||p.d1_usage.unknown_ops!==0||p.d1_usage.rows_read>1000||p.d1_usage.rows_written>64||p.production_provider_enabled!==false)throw Error('QUALIFICATION_SCOPE');
            const dir='checkpoints/sablier-lockup-hash-qualification-'+context.runId;
            fs.mkdirSync(dir,{recursive:true});fs.copyFileSync('audit-output/actual-lockup-qualification.json',dir+'/actual.json');
            const files=[dir+'/actual.json'];
            for(const n of fs.readdirSync('audit-output/lockup-source')){fs.copyFileSync('audit-output/lockup-source/'+n,dir+'/'+n);files.push(dir+'/'+n);}
            const proof={schema:'SABLIER_DOCUMENTED_KEYLESS_ACTUAL_LOCKUP_QUALIFICATION_20261008_V1',status:p.status,head:context.sha,cloud_run:context.runId,documentation:p.documentation,documented_testing_queries_per_day:3000,local_daily_query_cap:4,actual_path:dir+'/actual.json',sourceHTTP:p.sourceHTTP,D1:p.d1_usage,matching:p.matching||[],original_finalized_clock:p.original_finalized_clock||null,production_provider_enabled:false,N01_consumer_implemented:false,MAIN:0,Telegram:0,new_fresh_SENT:false,actual_ENTRY:false,full_project_complete:false};
            const index='checkpoints/SABLIER_FINALIZED_HASH_LOCKUP_QUALIFICATION_20261008.json';fs.writeFileSync(index,JSON.stringify(proof,null,2)+'\n');files.push(index);
            const entries=[];for(const file of files){const b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(file).toString('base64'),encoding:'base64'})).data;entries.push({path:file,mode:'100644',type:'blob',sha:b.sha});}
            const parent=(await github.rest.git.getCommit({owner,repo,commit_sha:context.sha})).data;
            const tree=(await github.rest.git.createTree({owner,repo,base_tree:parent.tree.sha,tree:entries})).data;
            const commit=(await github.rest.git.createCommit({owner,repo,message:'Retain bounded actual keyless lockup response and original native state clock',tree:tree.sha,parents:[context.sha]})).data;
            await github.rest.git.updateRef({owner,repo,ref:context.ref.replace('refs/',''),sha:commit.sha,force:false});
            console.log(JSON.stringify({proof_head:commit.sha,status:p.status,matching:p.matching?.length||0,sourceHTTP:p.sourceHTTP}));
