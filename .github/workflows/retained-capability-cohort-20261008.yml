name: Retained source capability and prospective cohort coverage
on:
  push:
    branches: [codex/retained-capability-cohort-20261008]
    paths: ['tools/read-retained-capability-cohort-20261008.mjs', '.github/workflows/retained-capability-cohort-20261008.yml']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact owner before bounded read
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='4d117d00c35195c3e7c72285121ef29146898cfe')throw Error('MAIN_MOVED');const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString()),phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const parent=(await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');
      - name: Read original retained catalogs and prospective rows without source refresh
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: |
          node --check tools/read-retained-capability-cohort-20261008.mjs
          node tools/read-retained-capability-cohort-20261008.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-capability-cohort-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact original bytes and measured scope
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='4d117d00c35195c3e7c72285121ef29146898cfe')throw Error('MAIN_MOVED');const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString()),phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const parent=(await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');
            const fs=require('fs'),p=JSON.parse(fs.readFileSync('audit-output/retained-capability-cohort.json'));if(p.status!=='BOUNDED_RETAINED_COVERAGE_READ_COMPLETED'||p.sourceHTTP!==0||p.MAIN!==0||p.Telegram!==0||p.task_writes!==0||p.cache_writes!==0||p.d1_usage.unknown_ops!==0||p.d1_usage.rows_read>4000||p.d1_usage.rows_written>8)throw Error('READ_SCOPE');
            const dir='checkpoints/retained-capability-cohort-'+context.runId,index='checkpoints/RETAINED_SOURCE_COHORT_HISTORY_COVERAGE_20261008.json',entries=[];for(const name of fs.readdirSync('audit-output')){const path=dir+'/'+name,b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('audit-output/'+name).toString('base64'),encoding:'base64'})).data;entries.push({path,mode:'100644',type:'blob',sha:b.sha});}
            const b=(await github.rest.git.createBlob({owner,repo,content:JSON.stringify({...p,retained_directory:dir},null,2)+'\n',encoding:'utf-8'})).data;entries.push({path:index,mode:'100644',type:'blob',sha:b.sha});const base=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,t=(await github.rest.git.createTree({owner,repo,base_tree:base.tree.sha,tree:entries})).data,c=(await github.rest.git.createCommit({owner,repo,message:'Retain bounded original source/cohort/history coverage proof; no source refresh',tree:t.sha,parents:[parent]})).data;await github.rest.git.updateRef({owner,repo,ref:context.ref.replace('refs/',''),sha:c.sha,force:false});
