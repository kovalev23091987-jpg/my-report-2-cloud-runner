name: Initialize exact four free archive schemas
on:
  push:
    branches: [fix/free-storage-pool-routing-20261015]
    paths: [checkpoints/FREE_ARCHIVE_SCHEMA_REQUEST_20261015.json]
permissions:
  contents: read
concurrency:
  group: report2-free-archive-schema
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Initialize only the exact reviewed schemas after shared native admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_ISOLATED_D1_API_TOKEN: ${{ secrets.REPORT2_ISOLATED_D1_API_TOKEN }}
        run: node tools/initialize-free-archives-20261015.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-archive-schema-${{ github.run_id }}
          path: audit-output/free-archive-schema/proof.json
          if-no-files-found: error
          retention-days: 30
