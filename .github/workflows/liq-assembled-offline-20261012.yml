permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check current owner lease and fence
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const exactCandidate=(context.ref==='refs/heads/codex/active-source-finalist-and-quota-20261014'&&main==='2338a42afc69c1f96275546c7b4a2b832410a511')||(context.ref==='refs/heads/codex/active-source-typed-private-price-20261014'&&main==='caa3ec4e9eb67a327ab662cbc0e5cf63b589b19a')||(context.ref==='refs/heads/codex/active-source-after338-20261014'&&main==='2190e9547045d821d69ed5211d6a9ccacb16ee0e');
            const exactRoleCandidate=context.ref==='refs/heads/codex/active-source-role-and-history-20261014'&&main==='d0898d037b20f07f73c0304968bf07b54119dc41';
            const exactNativeHandoffCandidate=context.ref==='refs/heads/codex/active-source-next-gaps-20261014'&&main==='ee6917f642fbcc1abdd9929a94d7064b37a3ee9a';
            const exactTransportCandidate=context.ref==='refs/heads/codex/active-source-transport-and-retention-20261014'&&main==='d606c3efbde8ac16128b961881d8afd71079b874';
            const exactNativeSectorCandidate=context.ref==='refs/heads/codex/native-sector-source-coverage-20261014'&&main==='bda7c8abe5b9e2b607552fbd764aff19b10a022f';
            const exactNativeDenomCandidate=context.ref==='refs/heads/codex/native-sector-denominations-20261014'&&main==='fae8db8911331e4aa1e3333ebfca2670f0cf8ff2';
            const exactTronSectorCandidate=context.ref==='refs/heads/codex/tron-sector-source-coverage-20261014'&&main==='32271ab798121efe2e4baa5707bd9f3abc4ecaf1';
            const exactTargetFallbackCandidate=context.ref==='refs/heads/codex/sector-exact-target-fallback-20261014'&&main==='da7f8ae66ca0183cf55a9681f3036a827b8d5140';
            const exactActivePreflightCandidate=context.ref==='refs/heads/codex/active-source-preflight-20261014'&&main==='deec69207cf2a0638780084fc068bddc5545b16e';
            const exactSourceHealthCandidate=context.ref==='refs/heads/codex/source-health-priority-20261014'&&main==='52c7520c7bf0faa22318fee2337ca7066843c309';
            const exactPublicHealthCandidate=context.ref==='refs/heads/codex/public-venue-health-priority-20261014'&&main==='ccb82d056aaa2ac47799d20f4253b945d1936b25';
            const exactWeeklyPreparation=context.ref==='refs/heads/codex/weekly-htx-source-sync-20261014'&&main==='a120a6e175531bd869e4437a6d053748746973f4';
            const exactWeeklyConnectedPreparation=context.ref==='refs/heads/codex/weekly-htx-connected-proposal-20261014'&&main==='e9eb29146fe0990f461f278c49caa1ea4b4e4c3d';
            const weeklyProposal=context.eventName==='workflow_dispatch'&&context.payload.inputs?.weekly_proposal==='true'&&/^refs\/heads\/maintenance\/htx-weekly-\d{4}-\d{2}-\d{2}-\d+$/.test(context.ref)&&main===context.payload.inputs.weekly_expected_main;
            if(main!==context.sha&&!weeklyProposal&&!exactWeeklyConnectedPreparation&&!exactWeeklyPreparation&&!exactPublicHealthCandidate&&!exactSourceHealthCandidate&&!exactActivePreflightCandidate&&!exactTargetFallbackCandidate&&!exactTronSectorCandidate&&!exactNativeDenomCandidate&&!exactNativeSectorCandidate&&!exactCandidate&&!exactRoleCandidate&&!exactNativeHandoffCandidate&&!exactTransportCandidate)throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json');
            const fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            const liqOwner=/^CODEX:LIQ_(?:COVERAGE_BATCH|NATURAL_AUDIT|EXTERNAL_LEVELS_ONLY):/.test(phase.lease?.owner||'');
            const allActiveOwner=/^CODEX:ACTIVE_SOURCE_DAY_BUDGET:\d+$/.test(phase.lease?.owner||'')&&phase.current_task==='LIQ_MAXIMUM_USEFUL_COVERAGE_IN_PROGRESS'&&phase.active_working_state?.owned_lease===phase.lease.owner&&phase.owner_all_active_blocks_source_budget_and_fallback==='checkpoints/OWNER_ALL_ACTIVE_BLOCKS_SOURCE_BUDGET_AND_FALLBACK_20261013.json';
            const privateOwner=/^CODEX:PRIVATE_RESTORE_AND_ACTIVE_SOURCE_AUDIT:\d+$/.test(phase.lease?.owner||'')&&phase.current_task==='LIQ_MAXIMUM_USEFUL_COVERAGE_IN_PROGRESS'&&phase.latest_own_bounded_continuation_lease?.owner===phase.lease.owner;
            const coverageOwner=/^CODEX:ACTIVE_SOURCE_COVERAGE_AND_QUOTA:\d+$/.test(phase.lease?.owner||'')&&phase.current_task==='LIQ_MAXIMUM_USEFUL_COVERAGE_IN_PROGRESS'&&phase.latest_own_bounded_continuation_lease?.owner===phase.lease.owner&&phase.active_working_state?.owned_lease===phase.lease.owner;
            if(!(liqOwner||allActiveOwner||privateOwner||coverageOwner)||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Verify immutable weekly catalogs, exact data-only branch and all consumers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.weekly_proposal == true }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEEKLY_EXPECTED_MAIN: ${{ inputs.weekly_expected_main }}
          WEEKLY_SOURCE_RUN: ${{ inputs.weekly_source_run }}
        run: node tools/verify-weekly-htx-proposal.mjs
      - name: Reuse immutable original gTrade source records
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
            for(const [id,digest,dir] of [[11397777455,'8e632ffb4371498fe0ecdabbf9e7653c99c360a19163ec9c3ee03321552372f0','original-source'],[11485584554,'6dacb2912f344cf08f84ad8ad4337dc57cbed898275440f61fa4d30291246d32','gtrade-current-source']]){
              const b=Buffer.from((await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:id,archive_format:'zip'})).data);
              if(crypto.createHash('sha256').update(b).digest('hex')!==digest)throw Error('ORIGINAL_GTRADE_ARTIFACT_DIGEST');
              fs.mkdirSync(dir,{recursive:true});fs.writeFileSync(dir+'.zip',b);cp.execFileSync('unzip',['-q',dir+'.zip','-d',dir]);
            }
      - name: Assemble encrypted runtime and verify LIQ report path
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output/liq-assembled
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/liq-assembled/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
          cmp current-generation/files/runner-main.mjs runtime/runner-main.mjs
          cmp current-generation/files/src/liquidation-futures-coverage.mjs runtime/src/liquidation-futures-coverage.mjs
          cmp current-generation/files/src/liquidation-spot-reference.mjs runtime/src/liquidation-spot-reference.mjs
          cmp current-generation/files/src/canonical-runtime-adapter.mjs runtime/src/canonical-runtime-adapter.mjs
          cmp current-generation/files/src/n12-market-trades.mjs runtime/src/n12-market-trades.mjs
          cmp current-generation/files/src/block-result-context.mjs runtime/src/block-result-context.mjs
          cmp current-generation/files/src/manual-report-formatter.mjs runtime/src/manual-report-formatter.mjs
          cmp current-generation/files/src/supplemental-candidate-context.mjs runtime/src/supplemental-candidate-context.mjs
          cmp current-generation/files/src/candidate-evidence-v2-runtime.mjs runtime/src/candidate-evidence-v2-runtime.mjs
          cmp current-generation/files/src/canonical-display.mjs runtime/src/canonical-display.mjs
          cmp current-generation/files/src/pump-liquidation-zones.mjs runtime/src/pump-liquidation-zones.mjs
          cmp current-generation/files/src/htx-source-backed-liquidation-model.mjs runtime/src/htx-source-backed-liquidation-model.mjs
          cmp current-generation/files/src/coinboss-liquidation-levels.mjs runtime/src/coinboss-liquidation-levels.mjs
          cmp current-generation/files/src/orderly-public-liquidation-positions.mjs runtime/src/orderly-public-liquidation-positions.mjs
          cmp current-generation/files/src/liquidation-forecast-memory.mjs runtime/src/liquidation-forecast-memory.mjs
          cmp current-generation/files/src/liquidation-source-chain.mjs runtime/src/liquidation-source-chain.mjs
          cmp current-generation/files/src/liquidation-extension/combined-runner-service.mjs runtime/src/liquidation-extension/combined-runner-service.mjs
          cmp current-generation/files/src/liquidation-extension/gtrade-runtime-collector.mjs runtime/src/liquidation-extension/gtrade-runtime-collector.mjs
          cmp current-generation/files/src/liquidation-source-acquisition-audit.mjs runtime/src/liquidation-source-acquisition-audit.mjs
          cmp current-generation/files/src/canonical-publication.mjs runtime/src/canonical-publication.mjs
          cmp current-generation/files/src/liquidation-extension/dydx-native-market-catalog.mjs runtime/src/liquidation-extension/dydx-native-market-catalog.mjs
          cmp current-generation/files/src/coingecko-sector-evidence.mjs runtime/src/coingecko-sector-evidence.mjs
          node --check tools/validate-native-sector-batch-20261014.mjs
          node tools/validate-native-sector-batch-20261014.mjs --plan > audit-output/liq-assembled/native-sector-validation-plan.json
          REPORT2_TEST_RUNTIME="$PWD/runtime" REPORT2_SECTOR_MODULE_ROOT="$PWD/runtime/src" node --test current-generation/tests/native-sector-provider-binding.test.mjs current-generation/tests/tron-sector-source.test.mjs current-generation/tests/sector-exact-fallback.test.mjs current-generation/tests/native-sector-validation-admission.test.mjs current-generation/tests/shared-sector-batch.test.mjs current-generation/tests/coingecko-demo-access.test.mjs current-generation/tests/sector-context.test.mjs > audit-output/liq-assembled/native-sector-provider-binding.tap
          cp audit-output/native-sector-denominations-retained-proof.json audit-output/liq-assembled/
          cp audit-output/tron-sector-retained-four-proof.json audit-output/liq-assembled/
          cp audit-output/sector-exact-target-controlled-proof.json audit-output/liq-assembled/
          REPORT2_TEST_RUNTIME="$PWD/runtime" node tools/audit-sector-effective105-retained-20261014.mjs > audit-output/liq-assembled/sector-effective105-retained.json
          cmp current-generation/files/src/evidence-source-store.mjs runtime/src/evidence-source-store.mjs
          cmp current-generation/files/src/htx-asset-identity.mjs runtime/src/htx-asset-identity.mjs
          cmp current-generation/files/src/finalized-chain-events.mjs runtime/src/finalized-chain-events.mjs
          cmp current-generation/files/src/native-evm-finalized-context.mjs runtime/src/native-evm-finalized-context.mjs
          cmp current-generation/files/src/htx-large-trades-evidence.mjs runtime/src/htx-large-trades-evidence.mjs
          REPORT2_TEST_RUNTIME="$PWD/runtime" node --test current-generation/tests/active-source-headroom.test.mjs current-generation/tests/evidence-source-store.test.mjs current-generation/tests/htx-asset-identity.test.mjs current-generation/tests/coinpaprika-htx-identity.test.mjs current-generation/tests/native-evm-finalized-context.test.mjs current-generation/tests/finalized-chain-events.test.mjs current-generation/tests/htx-large-trades-evidence.test.mjs > audit-output/liq-assembled/active-source-headroom.tap
          REPORT2_TEST_RUNTIME="$PWD/runtime" node --test current-generation/tests/source-health-priority.test.mjs current-generation/tests/evidence-route-block.test.mjs current-generation/tests/evidence-source-store.test.mjs > audit-output/liq-assembled/source-health-priority.tap
          cp audit-output/source-health-priority-retained-proof.json audit-output/liq-assembled/
          cmp current-generation/files/src/public-venue-source-priority.mjs runtime/src/public-venue-source-priority.mjs
          cmp current-generation/files/src/n15-initial-source-preference.mjs runtime/src/n15-initial-source-preference.mjs
          cmp current-generation/files/src/external-n05-flow-collector.mjs runtime/src/external-n05-flow-collector.mjs
          REPORT2_TEST_RUNTIME="$PWD/runtime" node --test current-generation/tests/public-venue-health-priority.test.mjs current-generation/tests/public-venue-source-budget.test.mjs > audit-output/liq-assembled/public-venue-health-priority.tap
          cp audit-output/public-venue-health-original-proof.json audit-output/liq-assembled/
          REPORT2_TEST_RUNTIME="$PWD/runtime" node tools/audit-active105-initial-source-priority-20261014.mjs > audit-output/liq-assembled/active105-initial-source-queues.json
          node --test runner/htx-weekly-universe-plan.test.mjs runner/github-bounded-phase-lease.test.mjs runner/htx-weekly-proposal-check.test.mjs cloudflare/free-history/history-read.test.mjs cloudflare/free-history/hourly-archive.test.mjs cloudflare/free-history/spot-archive.test.mjs > audit-output/liq-assembled/weekly-htx-synchronized-plan.tap
          cp audit-output/htx-weekly/proof.json audit-output/liq-assembled/weekly-disabled-controlled-proof.json
          node current-generation/validate.mjs > audit-output/liq-assembled/validation.log 2>&1
          REPORT2_UNIFIED_MODULE_ROOT="$PWD/runtime/src" node --test current-generation/tests/shared-spot-futures-market-context.test.mjs current-generation/tests/n12-market-trades.test.mjs current-generation/tests/liquidation-futures-coverage.test.mjs current-generation/tests/liquidation-spot-reference.test.mjs current-generation/tests/htx-source-backed-liquidation-model.test.mjs current-generation/tests/coinboss-liquidation-levels.test.mjs current-generation/tests/orderly-public-liquidation-positions.test.mjs current-generation/tests/liquidation-forecast-memory.test.mjs current-generation/tests/liquidation-zone-policy.test.mjs current-generation/tests/liquidation-structural-route-priority.test.mjs cloudflare/free-history/history-read.test.mjs cloudflare/free-history/hourly-archive.test.mjs cloudflare/free-history/spot-archive.test.mjs > audit-output/liq-assembled/target.tap
