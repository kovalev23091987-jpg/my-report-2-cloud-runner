          node --test cloudflare/public-collector/funding-period-coverage.test.mjs current-generation/tests/discovery-candidate-score.test.mjs current-generation/tests/funding-directional-policy.test.mjs cloudflare/public-collector/private-price-consumer.test.mjs cloudflare/public-collector/light-price-recheck.test.mjs cloudflare/public-collector/public-collector.test.mjs cloudflare/public-collector/github-backup.test.mjs cloudflare/public-collector/continuous-backup-worker.test.mjs cloudflare/public-collector/trigger-analysis-kick.test.mjs cloudflare/free-history/private-forecast-consumer.test.mjs > audit-output/liq-assembled/private-price-connected.tap
          node --test current-generation/tests/native-exact-asset-role-priority.test.mjs current-generation/tests/liquidation-source-weighting.test.mjs current-generation/tests/collector-only-artifact-outcome.test.mjs current-generation/tests/production-artifact-outcome.test.mjs > audit-output/liq-assembled/exact-asset-role-and-collector-audit.tap
          REPORT2_TEST_RUNTIME="$PWD/runtime" node --test current-generation/tests/native-identity-source-handoff.test.mjs current-generation/tests/htx-asset-identity.test.mjs current-generation/tests/supplemental-candidate-context.test.mjs current-generation/tests/evidence-route-block.test.mjs current-generation/tests/verified-asset-route-identity.test.mjs > audit-output/liq-assembled/native-identity-source-handoff.tap
          REPORT2_TEST_RUNTIME="$PWD/runtime" node --test current-generation/tests/native-transport-fallback.runtime.mjs > audit-output/liq-assembled/native-transport-fallback.tap
          cp audit-output/qnt-lsk-native4-retained-proof.json audit-output/liq-assembled/
      - name: Show failure locations
        if: failure()
        run: |
          for file in audit-output/liq-assembled/*.log audit-output/liq-assembled/*.tap; do
            if test -f "$file"; then echo "FAILED_LOG: $file"; tail -80 "$file"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liq-assembled-${{ github.run_id }}
          path: audit-output/liq-assembled/
          retention-days: 30
