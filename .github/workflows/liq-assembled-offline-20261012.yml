name: LIQ assembled spot and 105 admission offline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current86-logging-new-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact current ROOT phase, four mirrors, lease and fence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node checkpoints/logging-only-controller-connected-20261023/qualification-guard.mjs
      - name: FIRST new connected logging-only components; no old suite or native IO
        run: node --test --test-reporter=spec checkpoints/logging-only-controller-connected-20261023/connected-common.mjs > audit-output/current86-logging-connected/node-spec.log 2>&1
      - name: Preserve each completed result before any following failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current86-logging-first-common-${{ github.run_id }}
          path: audit-output/current86-logging-connected/
          if-no-files-found: error
          retention-days: 30
