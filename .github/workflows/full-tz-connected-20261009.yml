name: Full TZ retained price receipts and historical prices connected validation
on:
  push:
    branches: [codex/full-tz-20261009]
    paths: ['current-generation/**','cloudflare/public-collector/**','runner/htx-delayed-price-history.mjs','tools/qualify-retained-htx-archive.py','tools/test_retained_htx_archive.py','tools/verify-delayed-price-history.mjs','.github/workflows/full-tz-connected-20261009.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact main, own repair lease and review head
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='81d759b43d3020545fdc3977c96d042075941091')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='CODEX:FULL_TZ:20261009:1791542831880'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
      - name: Restore exact already retained delivery fixtures with immutable digests
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),owner=context.repo.owner,repo=context.repo.repo;
            const manifest=JSON.parse(fs.readFileSync('current-generation/tests/fixtures/batched-retained-delivery-source-manifest.json'));
            for(const s of [...manifest.sources,{name:'qnt1826',artifact_id:11423583100,sha256:'f0f94d4beb9740adfdbf7dc83a276b305b7665e39dfb1aa0ae025005de3c7585'}]){
              const b=s.zip_path?fs.readFileSync(s.zip_path):Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:s.artifact_id,archive_format:'zip'})).data);
              if(crypto.createHash('sha256').update(b).digest('hex')!==s.sha256)throw Error('RETAINED_SOURCE_ZIP_HASH:'+s.name);
              fs.mkdirSync('batch-source/'+s.name,{recursive:true});fs.writeFileSync('batch-source/'+s.name+'.zip',b);cp.execFileSync('unzip',['-q','batch-source/'+s.name+'.zip','-d','batch-source/'+s.name]);
            }
            fs.mkdirSync('audit-output',{recursive:true});
            for(const [from,to] of [['checkpoints/actual-zec-sent150-original-input-20261007.json.gz','audit-output/exact-current-data.json.gz'],['checkpoints/production-liq-original-20261008/near0930/exact-current-data.json.gz','audit-output/near0930-exact-current-data.json.gz']])fs.copyFileSync(from,to);
      - name: Assemble exact connected current runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Verify original cancellation, immutable prior SENT and exact current assembled files
        run: |
          REPORT2_RECEIPT_RUNTIME=runtime node --test current-generation/tests/failure-and-trigger-receipts.test.mjs > audit-output/failure-trigger-runtime.tap
          REPORT2_SIGNED_TAPE_MODULE_ROOT=runtime/src node --test current-generation/tests/htx-signed-tape.test.mjs > audit-output/signed-tape-runtime.tap
          REPORT2_UNIFIED_MODULE_ROOT=runtime/src REPORT2_JOINT_REPAIR_RUNTIME_ROOT=runtime node --test current-generation/tests/joint-main-admission-repair.test.mjs current-generation/tests/unified-block-output.test.mjs > audit-output/optional-assembled-runtime.tap
          node --test current-generation/tests/removal-evidence-publication.test.mjs > audit-output/removal-evidence-publication.tap
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/removal-evidence-publication.runtime.mjs > audit-output/removal-evidence-runtime.tap
          cmp current-generation/files/src/v3-telegram-lifecycle-sidecar.mjs runtime/src/v3-telegram-lifecycle-sidecar.mjs
          cmp current-generation/files/src/publication-reconciler.mjs runtime/src/publication-reconciler.mjs
          cmp current-generation/files/src/canonical-publication.mjs runtime/src/canonical-publication.mjs
      - name: Verify exact collector price history and conservative delayed historical price consumer
        run: |
          node --test cloudflare/public-collector/public-collector.test.mjs cloudflare/public-collector/github-backup.test.mjs cloudflare/public-collector/light-price-recheck.test.mjs current-generation/tests/market-snapshot-batch.test.mjs > audit-output/collector-price-history.tap
          cmp current-generation/files/src/recheck-scheduler.mjs runtime/src/recheck-scheduler.mjs
          python tools/test_retained_htx_archive.py > audit-output/retained-archive-tests.txt 2>&1
          python tools/qualify-retained-htx-archive.py --archive checkpoints/htx-archive-primary-20261004/near-trades-20261003.zip --checksum checkpoints/htx-archive-primary-20261004/near-trades-20261003.CHECKSUM --bars checkpoints/htx-archive-primary-20261004/near-archive-minute-counts-20261003.json.gz --contract NEAR-USDT --day 2026-10-03 --day-offset-minutes 480 --as-of-ts "$(node -p 'Date.now()')" --outdir audit-output/delayed-price-history
          node tools/verify-delayed-price-history.mjs audit-output/delayed-price-history > audit-output/historical-consumer-console.json
      - name: Verify strict reachable entry and approved delivery pipeline
        run: |
          node current-generation/tests/approved-entry-path.runtime.mjs runtime > audit-output/approved-entry-path.json
          node current-generation/tests/approved-entry-performance.runtime.mjs runtime > audit-output/approved-entry-performance.json
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/approved-telegram-plain.runtime.mjs current-generation/tests/brief-telegram-facts.runtime.mjs current-generation/tests/batched-delivery.runtime.mjs > audit-output/approved-delivery-runtime.tap
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
      - name: Validate generation and exact runtime binding
        run: |
          REPORT2_VALIDATION_RECEIPT_DIR=audit-output node current-generation/validate.mjs > audit-output/validation.json 2> audit-output/validation-errors.txt
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          git rev-parse HEAD > audit-output/head.txt
          sha256sum runtime/src/technical-move-potential.mjs runtime/src/canonical-runtime-adapter.mjs > audit-output/target-runtime-hashes.txt
      - name: Show meaningful check failure locations
        if: failure()
        run: |
          node --input-type=module -e "import fs from 'node:fs';for(const f of fs.readdirSync('audit-output').filter(f=>f.endsWith('.tap')||f.endsWith('errors.txt'))){const ls=fs.readFileSync('audit-output/'+f,'utf8').split(String.fromCharCode(10));for(let i=0;i<ls.length;i++)if(/not ok|AssertionError|ERR_ASSERTION|error:|expected:|actual:|test at/.test(ls[i]))process.stdout.write(f+':'+ls.slice(Math.max(0,i-2),i+18).join(String.fromCharCode(10))+String.fromCharCode(10));}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-tz-connected-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Retain immutable original D1 chain and actual producer source on review branch
        uses: actions/github-script@v7
        with:
          script: |
            const crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo,ref=context.ref.replace('refs/','');
            if((await github.rest.git.getRef({owner,repo,ref})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
            const bytes=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:11610529688,archive_format:'zip'})).data);
            if(crypto.createHash('sha256').update(bytes).digest('hex')!=='7919a82f17043da9ebc2627174697b9945862cc8b2a4bb67e1f5449d23f511ad')throw Error('ORIGINAL_CHAIN_ARCHIVE_DIGEST_REQUIRED');
            const blob=(await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'})).data;
            const commit=(await github.rest.git.getCommit({owner,repo,commit_sha:context.sha})).data;
            const tree=(await github.rest.git.createTree({owner,repo,base_tree:commit.tree.sha,tree:[{path:'checkpoints/full-chain-original-37920121613.zip',mode:'100644',type:'blob',sha:blob.sha}]})).data;
            const next=(await github.rest.git.createCommit({owner,repo,tree:tree.sha,parents:[context.sha],message:'proof: retain immutable original current chain and producer source'})).data;
            if((await github.rest.git.getRef({owner,repo,ref})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED_BEFORE_RETENTION');
            await github.rest.git.updateRef({owner,repo,ref,sha:next.sha,force:false});
