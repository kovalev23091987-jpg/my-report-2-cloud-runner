name: Report 2 Actual Cardano Official Context Acceptance
on:
  push:
    branches: [autonomous/cardano-official-context-20261005]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: cardano-official-acceptance-37263699095
          run-id: 37263699095
          github-token: ${{ github.token }}
          path: prior-output
      - name: Verify only audit/workflow changed since accepted code validation
        run: |
          git fetch origin e39ca6a26d3b310ec1ffc2cede1cc26a3616f9ce
          git diff --name-only e39ca6a26d3b310ec1ffc2cede1cc26a3616f9ce HEAD > audit-output/changed-since-validation.txt
          node -e "const fs=require('fs'); const allowed=['.github/workflows/cardano-official-context-20261005.yml','audit-fixes/cardano-official-context-20261005/verify-live.mjs']; for(const p of fs.readFileSync('audit-output/changed-since-validation.txt','utf8').trim().split('\n'))if(!allowed.includes(p))throw Error('CHANGED_DEPENDENCY_REQUIRES_TEST:'+p);"
      - name: Verify accepted fresh source cache reaches approved reports
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_CONTINUATION_OWNER: 'HTX:20261005T041915:87ed7a01-25a2-46ac-ae40-aadd39f1e0e5'
        run: node audit-fixes/cardano-official-context-20261005/verify-live.mjs runtime > audit-output/cardano-official-acceptance.json
      - name: Runtime manifest
        if: always()
        run: |
          sha256sum runtime/src/official-token-schedule.mjs runtime/src/official-events-evidence.mjs runtime/src/official-source-registry.mjs runtime/src/block-result-context.mjs > audit-output/runtime-sha256.txt
          git rev-parse HEAD > audit-output/github-head.txt
          git rev-parse HEAD^{tree} > audit-output/github-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardano-official-acceptance-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
