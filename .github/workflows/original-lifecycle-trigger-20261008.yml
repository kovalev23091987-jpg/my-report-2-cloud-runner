name: Report2 Exact Natural SENT Lifecycle And Task Deadline Read
on:
  push:
    branches: [codex/automatic-full-batch-20261008]
    paths: ['.github/workflows/original-lifecycle-trigger-20261008.yml']
permissions:
  contents: write
jobs:
  retained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact released head and current owner
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo,head=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(head!=='5ce59b2dc05adb660c1b46074e60e0775a569d60')throw Error('MAIN_MOVED');
            const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261008:1791470809266:full-owner-connected-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');
      - name: Read hash-verified original collector history without source calls or task mutations
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/read-original-lifecycle-trigger-20261008.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-lifecycle-trigger-clocks-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Retain original-clock result
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),{owner,repo}=context.repo,path='checkpoints/ORIGINAL_LIFECYCLE_TRIGGER_CLOCKS_20261008.json',content=fs.readFileSync('audit-output/original-lifecycle-trigger-clocks.json'),proof=JSON.parse(content);
            if(proof.status!=='EXACT_ORIGINAL_LIFECYCLE_CLOCKS_READ'||proof.sourceHTTP!==0||proof.task_writes!==0)throw Error('READ_NOT_CLOSED');
            const ref=context.ref.replace('refs/heads/',''),parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;
            if(parent!==context.sha)throw Error('REVIEW_MOVED');
            const base=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data.tree.sha,b=(await github.rest.git.createBlob({owner,repo,content:content.toString('base64'),encoding:'base64'})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:base,tree:[{path,mode:'100644',type:'blob',sha:b.sha}]})).data,c=(await github.rest.git.createCommit({owner,repo,message:'Retain original collector price predicates for exact SENT159 and SENT160 lifetimes',tree:tree.sha,parents:[parent]})).data;
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:c.sha,force:false});console.log(JSON.stringify({proof_commit:c.sha,status:proof.status,cases:proof.cases.map(c=>({contract:c.contract,retained_price_trigger_reached:c.lifecycle_expires_before_due,original_row_exact:c.original_row_exact})),D1:proof.d1_usage,sourceHTTP:0,Telegram:0}));
