name: N05 available single and two venue flow assembled cloud verification
on:
  push:
    branches: [n05-available-flow-context-20261010]
    paths: ['current-generation/**', '.github/workflows/n05-available-context-20261010.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact main and owned lease
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,head=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(head!=='3cbebf21eec529d6f7ffd64d608b0298dbba923c')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='CODEX:N05_AVAILABLE_SOURCE_CONTEXT:1791655228671'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Restore exact already retained delivery fixtures with immutable digests
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),owner=context.repo.owner,repo=context.repo.repo;
            const manifest=JSON.parse(fs.readFileSync('current-generation/tests/fixtures/batched-retained-delivery-source-manifest.json'));
            for(const s of [...manifest.sources,{name:'qnt1826',artifact_id:11423583100,sha256:'f0f94d4beb9740adfdbf7dc83a276b305b7665e39dfb1aa0ae025005de3c7585'}]){
              const b=s.zip_path?fs.readFileSync(s.zip_path):Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:s.artifact_id,archive_format:'zip'})).data);
              if(crypto.createHash('sha256').update(b).digest('hex')!==s.sha256)throw Error('RETAINED_SOURCE_ZIP_HASH:'+s.name);
              fs.mkdirSync('batch-source/'+s.name,{recursive:true});fs.writeFileSync('batch-source/'+s.name+'.zip',b);cp.execFileSync('unzip',['-q','batch-source/'+s.name+'.zip','-d','batch-source/'+s.name]);
            }
            fs.mkdirSync('audit-output',{recursive:true});
            for(const [from,to] of [['checkpoints/actual-zec-sent150-original-input-20261007.json.gz','audit-output/exact-current-data.json.gz'],['checkpoints/production-liq-original-20261008/near0930/exact-current-data.json.gz','audit-output/near0930-exact-current-data.json.gz']])fs.copyFileSync(from,to);
      - name: Assemble current runtime and install pinned runtime dependencies
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output/n05-available-context
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/n05-available-context/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Verify generation, assembled pause, score, report and runtime binding
        env:
          REPORT2_TEST_RUNTIME: runtime
          REPORT2_UNIFIED_MODULE_ROOT: runtime/src
          REPORT2_JOINT_REPAIR_RUNTIME_ROOT: runtime
          REPORT2_VALIDATION_RECEIPT_DIR: audit-output/n05-available-context
        run: |
          node current-generation/validate.mjs > audit-output/n05-available-context/generation.log 2>&1
          REPORT2_NATIVE_MODULE_ROOT=runtime/src node --test current-generation/tests/joint-spot-futures-flow.test.mjs current-generation/tests/paused-block-report-chains.test.mjs > audit-output/n05-available-context/assembled-pause.tap
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/n05-available-context/binding.json
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/n05-available-context/integration.json
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/approved-telegram-plain.runtime.mjs current-generation/tests/brief-telegram-facts.runtime.mjs current-generation/tests/batched-delivery.runtime.mjs > audit-output/n05-available-context/approved-delivery.tap
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const out='audit-output/n05-available-context/',files=fs.readdirSync(out),sha=b=>createHash('sha256').update(b).digest('hex');
          const proof={schema:'N05_AVAILABLE_FLOW_CONTEXT_ASSEMBLED_CLOUD_VERIFICATION_V1',run:Number(process.env.GITHUB_RUN_ID),head:process.env.GITHUB_SHA,verified_ts:Date.now(),status:'ASSEMBLED_AVAILABLE_VENUE_FLOW_SCORE_AND_BOTH_REPORTS_VERIFIED',source_http:0,D1_reads:0,D1_writes:0,Telegram:0,controlled_cases_not_live_signal_acceptance:true,manual_and_Telegram_both_verified:true,threshold:70,source_caps_reset:false,N01_N02_N03_paused:true,N05_score_contribution:0,N05_calibration_pending:true,project_complete:false,files:Object.fromEntries(files.map(f=>[f,sha(fs.readFileSync(out+f))]))};
          fs.writeFileSync(out+'proof.json',JSON.stringify(proof,null,2)+'\n');
          JS
      - name: Print bounded failed test evidence
        if: failure()
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';const p='audit-output/n05-available-context/';for(const f of fs.readdirSync(p).filter(f=>/log|tap/.test(f))){const s=fs.readFileSync(p+f,'utf8');if(/failing tests|not ok|Error|fail [1-9]/.test(s))console.log(f,s.slice(-24000));}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n05-available-context-${{ github.run_id }}
          path: audit-output/n05-available-context/
          retention-days: 30
      - name: Retain exact cloud proof on review branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),owner=context.repo.owner,repo=context.repo.repo,ref=context.ref.replace('refs/','');
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(main!=='3cbebf21eec529d6f7ffd64d608b0298dbba923c')throw Error('MAIN_MOVED');
            const phase=JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:'checkpoints/CLOUD_PHASE_STATE_20261004.json',ref:main})).data.content,'base64').toString());if(phase.lease?.owner!=='CODEX:N05_AVAILABLE_SOURCE_CONTEXT:1791655228671'||phase.lease.expires_ts<=Date.now())throw Error('OWNER_BLOCKED');
            const current=(await github.rest.git.getRef({owner,repo,ref})).data.object.sha;if(current!==context.sha)throw Error('SUPERSEDED_HEAD');
            const base=(await github.rest.git.getCommit({owner,repo,commit_sha:current})).data.tree.sha,tree=[];
            for(const name of fs.readdirSync('audit-output/n05-available-context')){const b=fs.readFileSync('audit-output/n05-available-context/'+name),blob=(await github.rest.git.createBlob({owner,repo,content:b.toString('base64'),encoding:'base64'})).data;tree.push({path:'checkpoints/n05-available-context-'+context.runId+'/'+name,mode:'100644',type:'blob',sha:blob.sha});}
            const t=(await github.rest.git.createTree({owner,repo,base_tree:base,tree})).data,c=(await github.rest.git.createCommit({owner,repo,tree:t.sha,parents:[current],message:'Retain assembled N05 native flow proof '+context.runId})).data;await github.rest.git.updateRef({owner,repo,ref,sha:c.sha,force:false});
