name: Retained whole-register and actual block-use audit
on:
  push:
    branches: [codex/cold-ohlc-intervals-20261009]
    paths: ['tools/audit-retained-whole-register-use-20261009.mjs','.github/workflows/retained-whole-register-use-20261009.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='5c8ee5258a2959174ad4881eca488c78c5473608')throw Error('MAIN_MOVED');
            const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='CODEX:FULL_TZ:20261009:1791542831880'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
      - run: |
          mkdir -p audit-output
          node tools/audit-retained-whole-register-use-20261009.mjs > audit-output/whole-register-console.json
          git rev-parse HEAD > audit-output/head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-whole-register-use-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
