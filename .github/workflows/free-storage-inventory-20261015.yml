name: Free D1 account storage inventory (metadata only)
on:
  push:
    branches: [fix/free-storage-rolling-20261015]
    paths: [checkpoints/FREE_STORAGE_INVENTORY_REQUEST_20261015.json]
permissions:
  contents: read
concurrency:
  group: report2-free-storage-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify account-wide capacity, protected data and metadata-only routes
        run: node --test runner/free-storage-capacity.test.mjs
      - name: Check exact owner then list database descriptors without SQL
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.REPORT2_CANONICAL_ARCHIVE_D1_API_TOKEN || secrets.REPORT2_ISOLATED_D1_API_TOKEN }}
          REPORT2_FREE_STORAGE_TOKEN_ROLE: ${{ secrets.REPORT2_CANONICAL_ARCHIVE_D1_API_TOKEN != '' && 'REPORT2_CANONICAL_ARCHIVE_D1_API_TOKEN' || 'REPORT2_ISOLATED_D1_API_TOKEN' }}
        run: node tools/free-storage-inventory-20261015.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-storage-inventory-${{ github.run_id }}
          path: audit-output/free-storage/inventory.json
          if-no-files-found: error
          retention-days: 30
