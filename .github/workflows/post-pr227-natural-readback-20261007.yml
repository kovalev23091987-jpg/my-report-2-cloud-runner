name: Retained post PR227 natural report readback
on:
  push:
    branches: [codex/post-pr227-natural-readback-20261007]
    paths: ['.github/workflows/post-pr227-natural-readback-20261007.yml']
permissions:
  contents: write
  actions: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),zlib=require('zlib'),owner=context.repo.owner,repo=context.repo.repo;
            const expected='33af2beda9febe124557a47db7ddaa8011542048',main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(main!==expected)throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64'));
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261007:1791394702919:connected-source-health'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            const original=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:37663457675})).data;if(original.head_sha!=='33af2beda9febe124557a47db7ddaa8011542048'||original.event!=='schedule'||original.conclusion!=='success')throw Error('ORIGINAL_RUN_NOT_CLOSED');
            const specs=[{key:'report',id:11502056801,digest:'d41f63bf0e68f55e9c1baacdb39940d42d749416501b4c0437f5ad4ca045a1db'},{key:'delivery',id:11502311118,digest:'80b8eb61f525055acb6e14598602fe570de5f46d963b5a5148099db94953d5e6'}];
            for(const s of specs){const meta=(await github.rest.actions.getArtifact({owner,repo,artifact_id:s.id})).data;if(meta.workflow_run?.id!==37663457675||meta.workflow_run?.head_sha!==original.head_sha||meta.digest!=='sha256:'+s.digest)throw Error('ARTIFACT_ORIGIN:'+s.key);const bytes=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:s.id,archive_format:'zip'})).data);if(crypto.createHash('sha256').update(bytes).digest('hex')!==s.digest)throw Error('ARTIFACT_DIGEST:'+s.key);fs.mkdirSync(s.key);fs.writeFileSync(s.key+'.zip',bytes);cp.execFileSync('unzip',['-q',s.key+'.zip','-d',s.key]);}
            const find=(dir,name)=>{const f=cp.execFileSync('find',[dir,'-type','f']).toString().trim().split('\n').filter(x=>x.endsWith('/'+name));if(f.length!==1)throw Error('MISSING_OR_DUPLICATE_FILE:'+name);return f[0];};
            const bytes=fs.readFileSync(find('report','report2-run-result.json')),result=JSON.parse(bytes),tgBytes=fs.readFileSync(find('delivery','telegram-info-proof.json')),telegram=JSON.parse(tgBytes);if(result.head!==original.head_sha||result.source!=='schedule'||!result.run_id||!Array.isArray(result.candidates))throw Error('CANONICAL_ORIGIN_NOT_EXACT');
            const manifest={schema:'ACTUAL_POST_PR227_NATURAL_REPORT_RETAINED_20261007_V1',cloud_run:37663457675,head:result.head,run_id:result.run_id,generated_at:result.generated_at,status:result.status,artifact_specs:specs,report_sha256:crypto.createHash('sha256').update(bytes).digest('hex'),telegram_sha256:crypto.createHash('sha256').update(tgBytes).digest('hex'),sourceHTTP:0,D1:0,MAIN:0,Telegram:0,source_clocks_refreshed:false,natural_report_unchanged:true,liquidation_source_acquisition_audit:result.liquidation_source_acquisition_audit??null,telegram_proof:telegram,candidates:result.candidates.map(c=>({contract:c.contract,run_id:c.run_id,snapshot_id:c.snapshot_id,observed_ts:c.observed_ts,canonical_state:c.canonical_state,direction:c.direction,scores:c.canonical?.scores,participating_block_count:c.block_decision_use?.participating_block_count,participating_block_ids:c.block_decision_use?.participating_block_ids,score_applied_block_count:c.block_decision_use?.score_applied_block_count,checked_block_count:c.block_decision_use?.checked_block_count,rendered_blocks:c.block_rendered_results?.used_context_block_ids,liquidations:c.canonical?.liquidations,data_quality_keys:Object.keys(c.canonical?.data_quality||{})}))};
            const files=[['checkpoints/POST_PR227_NATURAL_REPORT_37663457675.json',bytes],['checkpoints/source-inputs/post-pr227-natural-37663457675.json.gz',zlib.gzipSync(bytes)],['checkpoints/POST_PR227_TELEGRAM_37663457675.json',tgBytes],['checkpoints/POST_PR227_NATURAL_RETAINED_READBACK_20261007.json',Buffer.from(JSON.stringify(manifest,null,2)+'\n')]],entries=[];
            const current=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(current!==expected)throw Error('MAIN_MOVED_BEFORE_SAVE');const ph=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fe=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(ph.lease?.owner!==phase.lease.owner||ph.lease.expires_ts<=Date.now()||fe.active)throw Error('OWNER_OR_FENCE_BLOCKED_BEFORE_SAVE');
            for(const [path,b]of files){const expectedBlob=crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');let blob;try{blob=(await github.rest.git.createBlob({owner,repo,content:b.toString('base64'),encoding:'base64'})).data;}catch(error){if(![500,502,503,504].includes(error.status))throw error;try{blob=(await github.rest.git.getBlob({owner,repo,file_sha:expectedBlob})).data;}catch(readError){if(readError.status!==404)throw readError;blob=(await github.rest.git.createBlob({owner,repo,content:b.toString('base64'),encoding:'base64'})).data;}}if(blob.sha!==expectedBlob)throw Error('BLOB_CONTENT_NOT_EXACT');entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}
            const ref=context.ref.replace('refs/heads/','');if(ref!=='codex/post-pr227-natural-readback-20261007')throw Error('REVIEW_REF');const parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('TESTED_HEAD_MOVED');
            const base=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:base.tree.sha,tree:entries})).data,commit=(await github.rest.git.createCommit({owner,repo,message:'Retain exact digest verified actual post PR227 natural report without source rereads',tree:tree.sha,parents:[parent]})).data;
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:commit.sha,force:false});console.log(JSON.stringify({status:'EXACT_NATURAL_REPORT_RETAINED',review_head:commit.sha,original_run_id:result.run_id,candidates:manifest.candidates.map(c=>({contract:c.contract,participating:c.participating_block_count,checked:c.checked_block_count})),sourceHTTP:0,D1:0,MAIN:0,Telegram:0}));
