name: Report2 Current Natural Report Reader
on:
  push:
    branches: [tools/read-current-report]
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - name: Await one existing naturally admitted fresh report
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
            const owner=context.repo.owner,repo=context.repo.repo,expected='763edae791e6f224b8554fd2eebf632b7af5cb3a',deadline=Date.now()+17*60*1000,seen=new Set();
            fs.mkdirSync('audit-output',{recursive:true});
            const result={schema:'report2-bounded-natural-scheduled-readback-v1',observer_head:context.sha,expected_production_head:expected,sourceHTTP:0,MAIN:0,Telegram_send:0,D1:0,created_after:'2026-10-06T06:49:00Z',skipped:[],status:'WAITING_FOR_NATURALLY_ADMITTED_RESULT'};
            const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
            const read=async(path,ref)=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref})).data.content,'base64').toString());
            const signatures=new Map();
            const runtimeSignature=async head=>{
             if(signatures.has(head))return signatures.get(head);
             const commit=(await github.rest.git.getCommit({owner,repo,commit_sha:head})).data;
             const tree=(await github.rest.git.getTree({owner,repo,tree_sha:commit.tree.sha,recursive:'1'})).data;
             if(tree.truncated)throw Error('RUNTIME_TREE_TRUNCATED');
             const rows=tree.tree.filter(r=>r.type==='blob'&&(/^(?:payload\/|runner\/|current-generation\/files\/|post-v7-consolidated\/)/.test(r.path)||['current-generation/apply-runtime-overlay.mjs','REPORT2_CURRENT_GENERATION.json','.github/workflows/report2.yml'].includes(r.path))).map(r=>[r.path,r.sha]).sort((a,b)=>a[0].localeCompare(b[0]));
             const sig=hash(Buffer.from(JSON.stringify(rows)));signatures.set(head,sig);return sig;
            };
            const guard=async sourceHead=>{
             const latest=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
             if(await runtimeSignature(latest)!==await runtimeSignature(expected))throw Error('PRODUCTION_RUNTIME_MOVED');
             if(sourceHead&&await runtimeSignature(sourceHead)!==await runtimeSignature(expected))throw Error('SOURCE_RUNTIME_MISMATCH');
            };
            const download=async(a,label,file)=>{
             if(!/^sha256:[a-f0-9]{64}$/.test(a.digest||'')||a.expired)throw Error('ARTIFACT_DIGEST_REQUIRED');
             const zip=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:a.id,archive_format:'zip'})).data);
             if(hash(zip)!==a.digest.slice(7))throw Error('ARTIFACT_DIGEST_MISMATCH');
             const zipPath='audit-output/'+label+'.zip';fs.writeFileSync(zipPath,zip);
             const bytes=cp.execFileSync('unzip',['-p',zipPath,file],{maxBuffer:8*1024*1024});
             const json=JSON.parse(bytes);fs.writeFileSync('audit-output/'+file,bytes);
             return {json,artifact:{id:a.id,name:a.name,zip_sha256:hash(zip),json_sha256:hash(bytes)}};
            };
            try{
             await new Promise(resolve=>setTimeout(resolve,10000));
             while(Date.now()<deadline){
              await guard();
              const runs=(await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:358951594,event:'schedule',per_page:10,created:'>=2026-10-06T06:49:00Z'})).data.workflow_runs.filter(r=>r.id>37423984921&&r.status==='completed').sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at));
              for(const run of runs){
               if(seen.has(run.id))continue;
               const artifacts=(await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:run.id,per_page:30})).data.artifacts;
               const reports=artifacts.filter(a=>a.name==='report2-run-result'),telegrams=artifacts.filter(a=>a.name==='report2-telegram-info-proof');
               if(reports.length===0){seen.add(run.id);result.skipped.push({run:run.id,created_at:run.created_at,conclusion:run.conclusion,reason:'NO_NEW_REPORT_ARTIFACT_NOT_A_FRESH_REPORT'});continue;}
               if(reports.length!==1||telegrams.length>1)throw Error('AMBIGUOUS_EXISTING_ARTIFACTS');
               await guard(run.head_sha);
               const fresh=await download(reports[0],'fresh','report2-run-result.json'),report=fresh.json;
               if(report.head!==run.head_sha||report.source!=='schedule'||!report.run_id||Date.parse(report.generated_at)<Date.parse(run.created_at))throw Error('FRESH_REPORT_RUN_BINDING_FAILED');
               let tg=null;if(telegrams.length){tg=await download(telegrams[0],'telegram','telegram-info-proof.json');if(tg.json.head!==run.head_sha||tg.json.source_run_id!==report.run_id||tg.json.source!=='schedule')throw Error('TELEGRAM_SAME_RUN_BINDING_FAILED');}
               Object.assign(result,{status:'ACTUAL_FRESH_REPORT_READ',cloud_run:run.id,source_head:run.head_sha,created_at:run.created_at,generated_at:report.generated_at,run_id:report.run_id,report_status:report.status,report_reason:report.reason,report_artifact:fresh.artifact,telegram_artifact:tg?.artifact??null,candidates:(report.candidates||[]).map(c=>({contract:c.contract,snapshot_id:c.snapshot_id,canonical_state:c.canonical_state,direction:c.direction,participating:c.block_decision_use?.participating_block_count,participating_ids:c.block_decision_use?.participating_block_ids,neutral:c.block_decision_use?.neutral_assessed_and_rendered_block_count,unscored_diagnostic:c.block_decision_use?.unscored_diagnostic_assessed_and_rendered_block_count,nonzero_score:c.block_decision_use?.score_applied_block_count,block_use:c.block_decision_use?.blocks,liquidations:c.canonical?.liquidations})),telegram_lifecycle:tg?.json?.lifecycle??null,telegram_proof_missing:!tg,project_complete:false});
               break;
              }
              fs.writeFileSync('audit-output/bounded-readback.json',JSON.stringify(result,null,2)+'\n');
              if(result.status==='ACTUAL_FRESH_REPORT_READ')break;
              await new Promise(resolve=>setTimeout(resolve,60000));
             }
             if(result.status!=='ACTUAL_FRESH_REPORT_READ')result.status='NO_NEW_ADMITTED_RESULT_WITHIN_BOUNDED_CHECK';
            }catch(e){result.status='READBACK_BLOCKED';result.error=String(e.message).slice(0,180);}
            fs.writeFileSync('audit-output/bounded-readback.json',JSON.stringify(result,null,2)+'\n');
            console.log(JSON.stringify({status:result.status,cloud_run:result.cloud_run,generated_at:result.generated_at,run_id:result.run_id,error:result.error,sourceHTTP:0,MAIN:0,Telegram_send:0,D1:0}));
            if(result.status==='READBACK_BLOCKED')throw Error(result.error);
            
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-natural-readback-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
