name: Report2 Exact Same Run Flow With Optional Storage Failure
on:
  push:
    branches: [codex/post238-connected-blocks-20261008]
    paths: ['current-generation/**', 'tools/read-post238-natural-sent-20261008.mjs', '.github/workflows/post238-connected-blocks-20261008.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact owner main and review before any work
        uses: actions/github-script@v7
        with:
          script: |
            const h=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;if(h!=='53af5273fa0070ba20afda4679930b80437a6b64')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const branch=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(branch!==context.sha)throw Error('REVIEW_MOVED');
      - name: Assemble current runtime and exact previous source control
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          git fetch --no-tags --depth=1 origin b67841da3af3ee752b7a75087c34467a6d54c7bb
          git show b67841da3af3ee752b7a75087c34467a6d54c7bb:current-generation/files/src/htx-signed-tape.mjs > runtime/src/htx-signed-tape.baseline.mjs
      - name: Verify causal current flow preservation and existing exact source guards
        run: |
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/current-run-flow-storage-failure.runtime.mjs current-generation/tests/signed-tape-storage.runtime.mjs current-generation/tests/signed-tape-read-diagnostics.runtime.mjs > audit-output/current-flow-storage.tap
          REPORT2_SIGNED_TAPE_MODULE_ROOT="$PWD/runtime/src" node --test current-generation/tests/htx-signed-tape.test.mjs > audit-output/signed-tape-integrity.tap
      - name: Read one exact new natural CT SENT receipt and original task without source calls
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/read-post238-natural-sent-20261008.mjs
      - name: Verify approved pipeline and current generation
        run: |
          node current-generation/validate.mjs > audit-output/validation.json 2> audit-output/validation-errors.txt
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/approved-telegram-plain.runtime.mjs current-generation/tests/brief-telegram-facts.runtime.mjs current-generation/tests/batched-delivery.runtime.mjs > audit-output/observation-pipeline-tests.tap
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
          cmp current-generation/files/src/htx-signed-tape.mjs runtime/src/htx-signed-tape.mjs
          cmp current-generation/files/src/source-closure-diagnostics.mjs runtime/src/source-closure-diagnostics.mjs
          git rev-parse HEAD > audit-output/head.txt
          sha256sum runtime/src/htx-signed-tape.mjs runtime/src/worker.js runtime/runner-main.mjs > audit-output/runtime-hashes.txt
      - name: Print bounded failure evidence
        if: failure()
        run: |
          node --input-type=module -e "import fs from 'node:fs';for(const f of fs.readdirSync('audit-output').filter(f=>f.endsWith('.tap')||f.endsWith('errors.txt'))){const ls=fs.readFileSync('audit-output/'+f,'utf8').split(String.fromCharCode(10)),ix=ls.map((s,i)=>/not ok|✖|AssertionError|ERR_ASSERTION|test at|error:|expected:|actual:|operator:/.test(s)?i:null).filter(i=>i!==null),keep=new Set(ix.flatMap(i=>Array.from({length:18},(_,j)=>i-2+j).filter(n=>n>=0&&n<ls.length)));if(keep.size)process.stdout.write(f+':'+String.fromCharCode(10)+[...keep].sort((a,b)=>a-b).map(i=>ls[i]).join(String.fromCharCode(10)).slice(0,16000)+String.fromCharCode(10));}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post238-connected-flow-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Persist verified assembled causal and exact receipt proof
        uses: actions/github-script@v7
        with:
          script: |
            const h=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;if(h!=='53af5273fa0070ba20afda4679930b80437a6b64')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const branch=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(branch!==context.sha)throw Error('REVIEW_MOVED');
            const fs=require('fs'),crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo,tests={},files=fs.readdirSync('audit-output').filter(f=>f.endsWith('.tap')||['integration.json','validation.json','binding.json','head.txt','runtime-hashes.txt','current-run-flow-write-failure-proof.json','natural-sent-task-read.json'].includes(f));
            for(const f of files.filter(f=>f.endsWith('.tap'))){const t=fs.readFileSync('audit-output/'+f,'utf8'),pass=Number(t.match(/(?:#|ℹ) pass (\d+)/)?.[1]),fail=Number(t.match(/(?:#|ℹ) fail (\d+)/)?.[1]);if(!Number.isInteger(pass)||fail!==0)throw Error('TEST_FAILED:'+f);tests[f]={pass,fail,sha256:crypto.createHash('sha256').update(t).digest('hex')};}
            if(tests['current-flow-storage.tap']?.pass!==17||tests['observation-pipeline-tests.tap']?.pass!==35)throw Error('REQUIRED_TESTS_NOT_CLOSED');
            const read=f=>JSON.parse(fs.readFileSync('audit-output/'+f)),integration=read('integration.json'),validation=read('validation.json'),replay=read('current-run-flow-write-failure-proof.json'),task=read('natural-sent-task-read.json');
            if(integration.status!=='PASS'||integration.failed!==0||validation.status!=='CURRENT_GENERATION_VALIDATED'||!replay.N05_rendered||!replay.successful_storage_and_failed_storage_canonical_equal)throw Error('CONNECTED_PROOF_NOT_CLOSED');
            if(task.status!=='BOUNDED_EXACT_NATURAL_SENT_TASK_READ_CLOSED'||task.cases.length!==1)throw Error('EXACT_NATURAL_TASK_NOT_READ');
            const proof={schema:'POST238_SAME_RUN_EXACT_FLOW_STORAGE_CONNECTED_20261008_V1',status:'EXACT_CURRENT_FLOW_RETAINED_DESPITE_OPTIONAL_DURABILITY_FAILURE_COMPOSED_VERIFIED',tested_head:context.sha,cloud_run:context.runId,tests,integration,validation,replay,natural_CT:task.cases[0],sourceHTTP:0,D1:task.d1_usage,MAIN:0,Telegram:0,actual_ENTRY:false,current_release_new_fresh_SENT:false,new_native_level_SENT:false,full_project_complete:false,persistence_transport_root_cause:'ORIGINAL_GENERIC_ERROR_CODE_NOT_RETAINED;WRITE_STAGE_PROVEN_ONLY',old_source_clocks_unchanged:true,entry_gates_changed:false,quotas_changed:false};
            const entries=[];for(const f of files){const b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('audit-output/'+f).toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/post238-flow-storage-tests-'+context.runId+'/'+f,mode:'100644',type:'blob',sha:b.sha});}
            const b=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(proof,null,2)+'\n').toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/POST238_SAME_RUN_FLOW_STORAGE_CONNECTED_20261008.json',mode:'100644',type:'blob',sha:b.sha});
            const ref=context.ref.replace('refs/heads/',''),parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');const c=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:c.tree.sha,tree:entries})).data,n=(await github.rest.git.createCommit({owner,repo,message:'Retain exact same-run N05 storage-failure and natural CT receipt proof',tree:tree.sha,parents:[parent]})).data;await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:n.sha,force:false});console.log('VERIFIED_PROOF_HEAD',n.sha);

