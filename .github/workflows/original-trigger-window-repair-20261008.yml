name: Report2 Original SENT Task Window And Actual Missed Trigger Replay
on:
  push:
    branches: [codex/original-trigger-window-repair-20261008]
    paths: ['current-generation/**', 'tools/read-entry-transition-20261008.mjs', '.github/workflows/original-trigger-window-repair-20261008.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fresh owner before assembled tests
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='5ce59b2dc05adb660c1b46074e60e0775a569d60')throw Error('MAIN_MOVED');
            const branchHead=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(branchHead!==context.sha)throw Error('SUPERSEDED_REVIEW_HEAD');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261008:1791470809266:full-owner-connected-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Load all retained inputs with immutable artifact digests
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
            const manifest=JSON.parse(fs.readFileSync('current-generation/tests/fixtures/batched-retained-delivery-source-manifest.json'));
            for(const s of [...manifest.sources,{name:'qnt1826',artifact_id:11423583100,sha256:'f0f94d4beb9740adfdbf7dc83a276b305b7665e39dfb1aa0ae025005de3c7585'}]){
              const b=s.zip_path?fs.readFileSync(s.zip_path):Buffer.from((await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:s.artifact_id,archive_format:'zip'})).data);
              if(crypto.createHash('sha256').update(b).digest('hex')!==s.sha256)throw Error('SOURCE_ZIP_DIGEST_MISMATCH:'+s.name);
              fs.mkdirSync('batch-source/'+s.name,{recursive:true});fs.writeFileSync('batch-source/'+s.name+'.zip',b);
              cp.execFileSync('unzip',['-q','batch-source/'+s.name+'.zip','-d','batch-source/'+s.name]);
            }
      - name: Retain exact current NEAR full report without another source or D1 request
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
            const b=Buffer.from((await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:11527530922,archive_format:'zip'})).data);
            if(crypto.createHash('sha256').update(b).digest('hex')!=='8271cedd89682733e9dacfdc601ad739186d161e678f8e9cb6740566196918ee')throw Error('CURRENT_NEAR_ARTIFACT_DIGEST_MISMATCH');
            fs.mkdirSync('current-near',{recursive:true});fs.mkdirSync('audit-output',{recursive:true});fs.writeFileSync('current-near.zip',b);cp.execFileSync('unzip',['-q','current-near.zip','-d','current-near']);
            const raw=fs.readFileSync('current-near/report2-run-result.json'),r=JSON.parse(raw),c=r.candidates.find(c=>c.contract==='NEAR-USDT');
            if(r.head!=='e3c470f332d79e685c7a40f6e8f5c20b2f73907c'||!c||r.source!=='manual')throw Error('CURRENT_NEAR_SCOPE_MISMATCH');
            fs.writeFileSync('audit-output/current-near-report.json',raw);
            fs.writeFileSync('audit-output/current-near-source-control.json',JSON.stringify({schema:'ACTUAL_POST_PR235_CURRENT_NEAR_FULL_REPORT_V1',cloud_run:37724477546,head:r.head,run_id:r.run_id,source:r.source,snapshot:c.snapshot_id,publication:c.publication_id,state:c.canonical_state,liquidations:c.canonical.liquidations,acquisition_audit:r.liquidation_source_acquisition_audit,original_artifact:11527530922,original_artifact_digest:'8271cedd89682733e9dacfdc601ad739186d161e678f8e9cb6740566196918ee',new_source_HTTP:0,new_D1:0,new_Telegram:0,original_source_clocks_preserved:true,fresh_SENT:false,full_project_complete:false},null,2)+'\n');
      - name: Assemble exact runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Reuse immutable retained reports without repeated D1 or source calls
        run: |
          cp checkpoints/production-liq-original-20261008/near0930/exact-current-data.json.gz audit-output/near0930-exact-current-data.json.gz
          cp checkpoints/production-liq-original-20261008/near0930/readback-summary.json audit-output/near0930-readback-summary.json
          cp checkpoints/actual-zec-sent150-original-input-20261007.json.gz audit-output/exact-current-data.json.gz
          cp checkpoints/production-liq-original-20261008/near0524/report2-run-result.json audit-output/near0524-report2-run-result.json
      - name: Reuse already verified exact SENT155 task read without another D1 query
        run: |
          cp checkpoints/entry-trigger-recheck-tests-37696777714/actual-entry-transition-read.json audit-output/actual-entry-transition-read.json
          node --input-type=module -e "import fs from 'node:fs';import crypto from 'node:crypto';const b=fs.readFileSync('audit-output/actual-entry-transition-read.json');if(crypto.createHash('sha256').update(b).digest('hex')!=='3795c9439d5f60845e0f1044ec630a2422176d49cf4f56d475ea7bdb6fa5bcf8')throw Error('ORIGINAL_TASK_READ_DIGEST_MISMATCH');"
      - name: Verify original-clock trigger to full analysis admission and strict reachable ENTRY route
        run: |
          REPORT2_TEST_RUNTIME=runtime REPORT2_CADENCE_RUNTIME_ROOT=runtime node --test current-generation/tests/triggered-entry-recheck.test.mjs current-generation/tests/scheduled-cadence-effective.test.mjs > audit-output/triggered-recheck-runtime.tap
          node current-generation/tests/approved-entry-path.runtime.mjs runtime > audit-output/approved-entry-path.json
      - name: Verify contiguous native collection before unrelated deep work
        run: |
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/native-source-batch.runtime.mjs current-generation/tests/cache-only-native-caller.test.mjs > audit-output/native-source-batch.tap
          cmp current-generation/files/src/liquidation-extension/selected-native-batch.mjs runtime/src/liquidation-extension/selected-native-batch.mjs
      - name: Reuse already verified exact SENT159 and SENT160 without new D1 reads
        run: cp checkpoints/native-source-batch-tests-37799119119/natural-sent-task-read.json audit-output/natural-sent-task-read.json
      - name: Verify native routing, original real NEAR response and all display paths
        run: |
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/native-relevant-search.runtime.mjs current-generation/tests/proven-native-route.runtime.mjs current-generation/tests/native-wallet-routing.test.mjs current-generation/tests/liquidation-futures-coverage-policy.test.mjs current-generation/tests/liquidation-futures-coverage.test.mjs current-generation/tests/liquidation-two-native-candidates.test.mjs current-generation/tests/native-account-reuse.test.mjs current-generation/tests/native-cache-completeness.test.mjs current-generation/tests/native-discovery-quota-fallback.test.mjs current-generation/tests/liquidation-run-cap.test.mjs current-generation/tests/native-source-health.runtime.mjs current-generation/tests/liquidation-relevance.runtime.mjs > audit-output/native-route-runtime.tap
          REPORT2_TEST_RUNTIME=runtime node tools/production-entry-liq-20261008.mjs > audit-output/near0524-diagnosis.json
      - name: Validate current generation and unchanged approved delivery chain
        run: |
          node current-generation/validate.mjs > audit-output/validation.json 2> audit-output/validation-errors.txt
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/approved-telegram-plain.runtime.mjs current-generation/tests/brief-telegram-facts.runtime.mjs current-generation/tests/batched-delivery.runtime.mjs > audit-output/observation-pipeline-tests.tap
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
      - name: Preserve exact source bindings and tested clock audit
        if: always()
        run: |
          for f in src/worker.js src/triggered-entry-recheck.mjs src/recheck-scheduler.mjs runner-main.mjs; do cmp "current-generation/files/$f" "runtime/$f"; node --check "runtime/$f"; done
          git rev-parse HEAD > audit-output/head.txt
          git rev-parse HEAD^{tree} > audit-output/tree.txt
          sha256sum runtime/runner-main.mjs runtime/src/manual-run-summary.mjs runtime/src/canonical-display.mjs runtime/src/canonical-publication.mjs runtime/src/native-liquidation-guard.mjs runtime/src/worker.js runtime/src/block-score-policy.mjs runtime/src/telegram-compact-formatter.mjs runtime/src/manual-report-formatter.mjs > audit-output/runtime-hashes.txt
      - name: Print exact failure locations
        if: failure()
        run: |
          node --input-type=module -e "import fs from 'node:fs';for(const f of fs.readdirSync('audit-output').filter(f=>f.endsWith('.tap')||f.endsWith('errors.txt'))){const ls=fs.readFileSync('audit-output/'+f,'utf8').split(String.fromCharCode(10)),ix=ls.map((s,i)=>/not ok|✖|AssertionError|ERR_ASSERTION|test at|error:|expected:|actual:|operator:/.test(s)?i:null).filter(i=>i!==null),keep=new Set(ix.flatMap(i=>Array.from({length:18},(_,j)=>i-2+j).filter(n=>n>=0&&n<ls.length)));if(keep.size)process.stdout.write(f+':'+String.fromCharCode(10)+[...keep].sort((a,b)=>a-b).map(i=>ls[i]).join(String.fromCharCode(10)).slice(0,20000)+String.fromCharCode(10));}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-trigger-window-connected-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Retain successful composed proof on review branch
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='5ce59b2dc05adb660c1b46074e60e0775a569d60')throw Error('MAIN_MOVED');
            const branchHead=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(branchHead!==context.sha)throw Error('SUPERSEDED_REVIEW_HEAD');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261008:1791470809266:full-owner-connected-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            const fs=require('fs'),crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo,tests={};
            const files=fs.readdirSync('audit-output').filter(f=>f.endsWith('.tap')||['integration.json','validation.json','runtime-hashes.txt','head.txt','tree.txt','triggered-recheck-proof.json','actual-entry-transition-read.json','approved-entry-path.json','binding.json','actual-lifecycle-trigger-replay.json','near0524-diagnosis.json','native-relevant-search-proof.json','natural-sent-task-read.json','current-near-report.json','current-near-source-control.json'].includes(f));
            for(const f of files.filter(f=>f.endsWith('.tap'))){const t=fs.readFileSync('audit-output/'+f,'utf8'),pass=Number(t.match(/(?:#|ℹ) pass (\d+)/)?.[1]),fail=Number(t.match(/(?:#|ℹ) fail (\d+)/)?.[1]);if(!Number.isInteger(pass)||fail!==0)throw Error('TEST_NOT_PASS:'+f);tests[f]={pass,fail,sha256:crypto.createHash('sha256').update(t).digest('hex')};}
            if(tests['native-source-batch.tap']?.pass!==10)throw Error('BATCH_REGRESSION_NOT_CLOSED');
            if(!tests['native-route-runtime.tap']||tests['native-route-runtime.tap'].pass<60)throw Error('NATIVE_ROUTING_TESTS_MISSING');
            if(tests['triggered-recheck-runtime.tap']?.pass!==22||tests['observation-pipeline-tests.tap']?.pass!==35)throw Error('REQUIRED_TESTS_MISSING');
            const integration=JSON.parse(fs.readFileSync('audit-output/integration.json'));if(integration.status!=='PASS'||integration.failed!==0)throw Error('INTEGRATION_NOT_PASS');
            const validation=JSON.parse(fs.readFileSync('audit-output/validation.json'));if(validation.status!=='CURRENT_GENERATION_VALIDATED')throw Error('GENERATION_NOT_VALIDATED');
            const replay=JSON.parse(fs.readFileSync('audit-output/triggered-recheck-proof.json'));if(replay.cases.length!==17||!replay.canonical_unchanged||replay.actual_ENTRY!==false)throw Error('ORIGINAL_CLOCK_REPLAY_NOT_CLOSED');
            const actual=JSON.parse(fs.readFileSync('audit-output/actual-entry-transition-read.json'));if(!['ACTUAL_ORIGINAL_SENT_RECHECK_TASK_READ','ORIGINAL_SENT_RECHECK_TASK_NOT_FOUND'].includes(actual.status))throw Error('ACTUAL_TASK_READ_NOT_CLOSED');
            const entry=JSON.parse(fs.readFileSync('audit-output/approved-entry-path.json'));if(entry.status!=='APPROVED_ENTRY_PATH_REACHABLE'||entry.route!=='ENTRY_NOW_ANALYTICAL')throw Error('STRICT_ENTRY_ROUTE_NOT_REACHABLE');
            const taskRead=JSON.parse(fs.readFileSync('audit-output/natural-sent-task-read.json'));if(taskRead.status!=='BOUNDED_EXACT_NATURAL_SENT_TASK_READ_CLOSED'||taskRead.cases.length!==2)throw Error('ACTUAL_TASK_READ_NOT_CLOSED');
            const actualReplay=JSON.parse(fs.readFileSync('audit-output/actual-lifecycle-trigger-replay.json'));if(actualReplay.cases.find(c=>c.contract==='NEAR-USDT')?.new_admission!=='TRIGGERED_FULL_ANALYSIS_ADMITTED'||actualReplay.cases.find(c=>c.contract==='NIL-USDT')?.new_admission!=='NO_FRESH_EXACT_SENT_TRIGGER')throw Error('ORIGINAL_CLOCK_REPLAY_NOT_CLOSED');
            const proof={original_lifecycle_replay:actualReplay,retained_natural_task_read:taskRead,shared_source_deadline_ms:45000,following_candidate_http_cap:2,original_automatic_reports:[37769881607,37777495159,37785013367,37792641591],schema:'ORIGINAL_TRIGGER_WINDOW_CONNECTED_20261008_V1',status:'ORIGINAL_SENT_TASK_LIFETIME_CONTROLS_NEW_ANALYSIS_PENDING_NATURAL_ENTRY',tested_head:context.sha,cloud_run:context.runId,tests,integration,validation,full_project_complete:false,fresh_liquidation_SENT:false,production_NOT_DUE_checked:false,original_near0524_cloud_run:37717554433,original_near0524_head:'7d4ea84e2641fcfac39aa5f0317d506a270248aa',native_http_cap_unchanged:5,sourceHTTP:0,D1:0,retained_actual_read_D1:actual.d1_usage,retained_actual_read_cloud_run:37696777714,MAIN:0,Telegram:0,source_clocks_refreshed:false,new_fresh_SENT:false,actual_ENTRY:false,entry_gates_changed:false,regular_cadence_minutes:40,burst_candidates_per_attempt:1,burst_attempts_per_UTC_day:3,manual_commands_per_day:8,original_ttl_unchanged:true,golden_fixtures_changed:false,actual_task_status:taskRead.status,actual_tasks:taskRead.cases.map(c=>({contract:c.contract,state:c.task?.state,attempts:c.task?.attempt_count,exact_SENT:c.exact_SENT,message_id:c.receipt?.telegram_message_id})),replay_proof:'triggered-recheck-proof.json'};
            const entries=[];for(const f of files){const b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('audit-output/'+f).toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/original-trigger-window-tests-'+context.runId+'/'+f,mode:'100644',type:'blob',sha:b.sha});}
            const b=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(proof,null,2)+'\n').toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/ORIGINAL_TRIGGER_WINDOW_CONNECTED_20261008.json',mode:'100644',type:'blob',sha:b.sha});
            const ref=context.ref.replace('refs/heads/','');if(ref!=='codex/original-trigger-window-repair-20261008')throw Error('REVIEW_REF_MISMATCH');const parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('TESTED_HEAD_MOVED');
            const commit=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:commit.tree.sha,tree:entries})).data,created=(await github.rest.git.createCommit({owner,repo,message:'Retain actual original SENT lifecycle clock failure and repaired analysis admission',tree:tree.sha,parents:[parent]})).data;
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:created.sha,force:false});console.log(JSON.stringify({status:proof.status,proof_commit:created.sha,tested_head:context.sha,tests,sourceHTTP:proof.sourceHTTP,D1:proof.D1,MAIN:0,Telegram:0}));

