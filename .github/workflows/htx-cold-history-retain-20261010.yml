name: Retain actual HTX archive bytes and bounded acquisition proof
on:
  push:
    branches: [codex/htx-cold-history-actual-acquisition-20261010]
    paths:
      - .github/workflows/htx-cold-history-retain-20261010.yml
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Require current own lease, no fence, exact branch head
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json');
            const fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(fence.active||phase.lease?.owner!=='CHATGPT:HTX_COLD_BACKFILL:20261010:SESSION'||phase.lease.expires_ts<=Date.now())throw Error('OWNER_LEASE_REQUIRED');
            if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_HEAD_MOVED');
      - name: Retrieve exact original source artifact and verify immutable digest
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo;
            const b=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:11665071206,archive_format:'zip'})).data);
            const digest=crypto.createHash('sha256').update(b).digest('hex');
            if(digest!=='f1d31e942ea70aa90fe3992d299b261353e7476359ecf2cb34441371b0bc4429')throw Error('EXACT_ORIGINAL_ARCHIVE_DIGEST_REQUIRED');
            fs.writeFileSync('checkpoints/actual-htx-cold-history-38038404724.zip',b);
      - name: Verify original receipts and retain conservative proof
        run: |
          set -e
          python3 - <<'PY'
          import zipfile,json,hashlib,datetime
          p='checkpoints/actual-htx-cold-history-38038404724.zip'
          with zipfile.ZipFile(p) as z:
              j=json.loads(z.read('actual-acquisition.json'))
              assert z.read('tested-head.txt').decode().strip()=='197f31cd015e1b84de6d5a1ece5c7f24633d6501'
              assert j['head']=='197f31cd015e1b84de6d5a1ece5c7f24633d6501'
              assert j['cloud_run']==38038404724 and j['status']=='BOUNDED_ACTUAL_SOURCE_ATTEMPTS_COMPLETED'
              assert j['sourceHTTP']==6 and j['source_http_reserved']==6 and j['verified_archive_count']==3
              assert j['D1']['unknown_ops']==0 and j['D1']['rows_read']<=500 and j['D1']['rows_written']<=32
              assert sorted(a['contract'] for a in j['archives'])==['AAVE-USDT','ACE-USDT','ADA-USDT']
              for a in j['archives']:
                  assert a['archive_day']=='2026-10-03'
                  assert a['status']=='CHECKSUM_AND_1440_MINUTE_GRID_VERIFIED_PRICE_API_NOT_CROSSCHECKED'
                  assert a['structural']['minute_count']==1440 and a['structural']['archive_day_offset_minutes']==480
                  assert [r['status'] for r in a['receipts']]==[200,200]
                  name=a['contract']+'/2026-10-03/archive.zip'
                  assert hashlib.sha256(z.read(name)).hexdigest()==a['archive_sha256']
          proof={'schema':'ACTUAL_HTX_COLD_HISTORY_BATCH_20261010_V1',
              'status':'THREE_ACTUAL_OFFICIAL_ARCHIVE_PAIRS_RETAINED_CHECKSUM_AND_GRID_VERIFIED',
              'source_run':38038404724,'tested_head':'197f31cd015e1b84de6d5a1ece5c7f24633d6501',
              'source_artifact_id':11665071206,'source_artifact_sha256':'f1d31e942ea70aa90fe3992d299b261353e7476359ecf2cb34441371b0bc4429',
              'retained_zip':p,'sourceHTTP':6,'D1':j['D1'],
              'contracts':['AAVE-USDT','ACE-USDT','ADA-USDT'],'archive_day':'2026-10-03',
              'verified_archive_pairs':3,'structurally_verified_minutes':4320,
              'native_api_ohlc_crosschecked':False,'price_qualified':False,'volume_qualified':False,
              'full_30_90day_102asset_history':False,'actual_ENTRY':False,'project_complete':False,
              'next':'Admit API OHLC crosschecks and 102-asset backfill only within existing budgets; preserve separate price-only lineage.'}
          with open('checkpoints/ACTUAL_HTX_COLD_HISTORY_BATCH_20261010.json','w') as f:json.dump(proof,f,ensure_ascii=False,indent=2);f.write('\n')
          print(json.dumps({'retained':p,'archives':3,'minutes':4320,'sourceHTTP':6}))
          PY
      - name: Commit exact retained original bytes on review branch
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkpoints/actual-htx-cold-history-38038404724.zip checkpoints/ACTUAL_HTX_COLD_HISTORY_BATCH_20261010.json
          git commit -m 'Retain three actual HTX checksum-matched archive days and bounded source receipts'
          git push origin HEAD:codex/htx-cold-history-actual-acquisition-20261010
