name: Scheduled report recovery offline verification
on:
  pull_request:
    paths:
      - '.github/workflows/report2.yml'
      - '.github/workflows/report2-public-collector-backup.yml'
      - '.github/workflows/scheduled-report-recovery-offline.yml'
      - 'cloudflare/public-collector/github-backup.mjs'
      - 'cloudflare/public-collector/continuous-backup-worker.mjs'
      - 'cloudflare/public-collector/scheduled-report-recovery*.mjs'
      - 'cloudflare/public-collector/trigger-analysis-kick.test.mjs'
      - 'tools/admit-weekly-maintenance-after-report*.mjs'
      - 'runner/offline-review-authority*.mjs'
      - 'tools/retain-current-canonical-private*.mjs'
      - '.github/workflows/liq-assembled-offline-20261012.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify workflow YAML, recovery guard and report priority without network
        run: |
          ruby -e "require 'yaml'; ARGV.each{|p| abort(p) unless YAML.load_file(p)['name']}" .github/workflows/report2.yml .github/workflows/report2-public-collector-backup.yml .github/workflows/scheduled-report-recovery-offline.yml .github/workflows/liq-assembled-offline-20261012.yml
          node --check cloudflare/public-collector/scheduled-report-recovery.mjs
          node --check cloudflare/public-collector/github-backup.mjs
          node --test cloudflare/public-collector/scheduled-report-recovery.test.mjs cloudflare/public-collector/continuous-backup-worker.test.mjs cloudflare/public-collector/trigger-analysis-kick.test.mjs tools/admit-weekly-maintenance-after-report.test.mjs runner/offline-review-authority.test.mjs tools/retain-current-canonical-private.test.mjs
