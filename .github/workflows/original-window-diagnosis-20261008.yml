name: Actual original task queue and raw-window diagnosis
on:
  push:
    branches: [codex/original-window-diagnosis-20261008]
    paths: ['tools/diagnose-original-task-window-20261008.mjs', '.github/workflows/original-window-diagnosis-20261008.yml']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact owner before bounded work
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='4b87c28a629757aebba677606edc7c6922e2ee5f')throw Error('MAIN_MOVED');const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString()),phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const parent=(await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');
      - name: Assemble exact current signed-tape decoder without source probes
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          cmp runtime/src/htx-signed-tape.mjs current-generation/files/src/htx-signed-tape.mjs
          node --check tools/diagnose-original-task-window-20261008.mjs
      - name: Read exact original FIL task, unchanged collector queue and two retained rings
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/diagnose-original-task-window-20261008.mjs
      - name: Upload measured read and exact source bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-window-diagnosis-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact bounded diagnostic without task changes
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='4b87c28a629757aebba677606edc7c6922e2ee5f')throw Error('MAIN_MOVED');const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString()),phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const parent=(await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');
            const fs=require('fs');
            if(!fs.existsSync('audit-output/original-window-diagnosis.json'))throw Error('NO_READ_PROOF');
            const p=JSON.parse(fs.readFileSync('audit-output/original-window-diagnosis.json'));
            if(p.sourceHTTP!==0||p.task_writes!==0||p.cache_writes!==0||p.d1_usage.unknown_ops!==0||p.d1_usage.rows_read>1000||p.d1_usage.rows_written>16)throw Error('READ_SCOPE');
            const dir='checkpoints/original-window-diagnosis-'+context.runId;fs.mkdirSync(dir,{recursive:true});
            const files=[],index='checkpoints/ORIGINAL_TASK_QUEUE_RAW_WINDOW_DIAGNOSIS_20261008.json';
            fs.copyFileSync('audit-output/original-window-diagnosis.json',index);files.push(index);
            for(const n of fs.readdirSync('audit-output/original-window-source')){fs.copyFileSync('audit-output/original-window-source/'+n,dir+'/'+n);files.push(dir+'/'+n);}
            const entries=[];for(const path of files){const b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(path).toString('base64'),encoding:'base64'})).data;entries.push({path,mode:'100644',type:'blob',sha:b.sha});}
            const parentCommit=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,t=(await github.rest.git.createTree({owner,repo,base_tree:parentCommit.tree.sha,tree:entries})).data,c=(await github.rest.git.createCommit({owner,repo,message:'Retain exact original task queue and raw-window diagnostic with measured usage',tree:t.sha,parents:[parent]})).data;
            await github.rest.git.updateRef({owner,repo,ref:context.ref.replace('refs/',''),sha:c.sha,force:false});
            console.log(JSON.stringify({proof_head:c.sha,status:p.status,FIL_state:p.FIL_task?.state,queue:p.queue_identity_checks,raw_windows:p.raw_windows?.map(r=>({contract:r.contract,known_minutes:r.retained_and_known_by_original_decision_minutes}))}));
