name: Report2 Additional Native Primary Blocks Connected Verification
on:
  push:
    branches: [codex/native-evm-connected-20261007]
    paths: ['current-generation/**', '.github/workflows/native-evm-connected-20261007.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fresh owner before tests and replay
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='711e34f91cf7213128b02451253fe3627ed2bafe')throw Error('MAIN_MOVED');
            const branchHead=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(branchHead!==context.sha)throw Error('SUPERSEDED_REVIEW_HEAD');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261007:1791365140268:liquidation-max-data'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Load all retained inputs with immutable artifact digests
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
            const manifest=JSON.parse(fs.readFileSync('current-generation/tests/fixtures/batched-retained-delivery-source-manifest.json'));
            for(const s of [...manifest.sources,{name:'qnt1826',artifact_id:11423583100,sha256:'f0f94d4beb9740adfdbf7dc83a276b305b7665e39dfb1aa0ae025005de3c7585'}]){
              const b=s.zip_path?fs.readFileSync(s.zip_path):Buffer.from((await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:s.artifact_id,archive_format:'zip'})).data);
              if(crypto.createHash('sha256').update(b).digest('hex')!==s.sha256)throw Error('SOURCE_ZIP_DIGEST_MISMATCH:'+s.name);
              fs.mkdirSync('batch-source/'+s.name,{recursive:true});fs.writeFileSync('batch-source/'+s.name+'.zip',b);
              cp.execFileSync('unzip',['-q','batch-source/'+s.name+'.zip','-d','batch-source/'+s.name]);
            }
      - name: Assemble exact runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Reuse successful exact09:30 read without another D1 query
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
            const b=Buffer.from((await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:11466345739,archive_format:'zip'})).data);
            if(crypto.createHash('sha256').update(b).digest('hex')!=='a3e376f8be618ccc210a542686237b09bb6e7b88003d80a94d6bb441d0736c80')throw Error('EXACT_READ_ARCHIVE_DIGEST_MISMATCH');
            fs.mkdirSync('retained0930',{recursive:true});fs.writeFileSync('retained0930.zip',b);cp.execFileSync('unzip',['-q','retained0930.zip','-d','retained0930']);
            fs.copyFileSync('retained0930/exact-current-data.json.gz','audit-output/near0930-exact-current-data.json.gz');
            fs.copyFileSync('retained0930/readback-summary.json','audit-output/near0930-readback-summary.json');
            fs.copyFileSync('checkpoints/actual-zec-sent150-original-input-20261007.json.gz','audit-output/exact-current-data.json.gz');
      - name: Verify new primary native sources and all current generation guards
        run: |
          node current-generation/validate.mjs > audit-output/validation.json 2> audit-output/validation-errors.txt
          REPORT2_NATIVE_MODULE_ROOT=runtime/src node --test current-generation/tests/native-evm-finalized-context.test.mjs > audit-output/native-evm-assembled-tests.tap
          node --test current-generation/tests/source-closure-diagnostics.test.mjs current-generation/tests/htx-signed-tape.test.mjs current-generation/tests/fresh-flow-sector-consumers.test.mjs current-generation/tests/candidate-block-coverage.test.mjs current-generation/tests/block-decision-use-audit.test.mjs current-generation/tests/source-use-accounting.test.mjs current-generation/tests/source-quality-empty-response.test.mjs current-generation/tests/internal-source-surface-invariance.test.mjs current-generation/tests/chain-supply-evidence.test.mjs current-generation/tests/xrpl-native-payment-sample.test.mjs current-generation/tests/block-result-context.test.mjs > audit-output/connected-primary-consumers.tap
      - name: Verify complete existing composed report and delivery gates
        run: |
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/approved-telegram-plain.runtime.mjs current-generation/tests/brief-telegram-facts.runtime.mjs current-generation/tests/batched-delivery.runtime.mjs > audit-output/observation-pipeline-tests.tap
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
      - name: Prove source and consumer are the exact assembled release code
        run: |
          cmp current-generation/files/src/native-evm-finalized-context.mjs runtime/src/native-evm-finalized-context.mjs
          cmp current-generation/files/src/finalized-chain-events.mjs runtime/src/finalized-chain-events.mjs
          cmp current-generation/files/src/candidate-evidence-v2-runtime.mjs runtime/src/candidate-evidence-v2-runtime.mjs
          cmp current-generation/files/src/block-result-context.mjs runtime/src/block-result-context.mjs
          node --check tools/verify-native-evm-primary-connected-20261007.mjs
          sha256sum runtime/src/native-evm-finalized-context.mjs runtime/src/finalized-chain-events.mjs runtime/src/candidate-evidence-v2-runtime.mjs runtime/src/block-result-context.mjs runtime/src/block-score-policy.mjs runtime/src/block-weight-calibration.mjs runtime/src/evidence-v2.mjs runtime/src/tz101-cost-assessment.mjs > audit-output/runtime-hashes.txt
      - name: Fresh owner guard before bounded actual missing native facts
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,head=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(head!=='711e34f91cf7213128b02451253fe3627ed2bafe')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:head})).data.content,'base64'));
            const p=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),f=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(p.lease?.owner!=='HTX:20261007:1791365140268:liquidation-max-data'||p.lease.expires_ts<=Date.now()||f.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: One current source batch with existing source and D1 admission
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/verify-native-evm-primary-connected-20261007.mjs
      - name: Print precise failures
        if: failure()
        run: |
          node --input-type=module -e "import fs from 'node:fs';for(const f of fs.readdirSync('audit-output').filter(f=>f.endsWith('.tap')||f.endsWith('errors.txt'))){const ls=fs.readFileSync('audit-output/'+f,'utf8').split(String.fromCharCode(10)),ix=ls.map((s,i)=>!/Error: FAILED node --test/.test(s)&&/not ok|✖|AssertionError|ERR_ASSERTION|test at|error:|expected:|actual:|operator:/.test(s)?i:null).filter(i=>i!==null),keep=new Set(ix.flatMap(i=>Array.from({length:18},(_,j)=>i-2+j).filter(n=>n>=0&&n<ls.length)));if(keep.size)process.stdout.write(f+':'+String.fromCharCode(10)+[...keep].sort((a,b)=>a-b).map(i=>ls[i]).join(String.fromCharCode(10)).slice(0,18000)+String.fromCharCode(10));}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evm-connected-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Retain source receipts and composed verification on review branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(main!=='711e34f91cf7213128b02451253fe3627ed2bafe')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64'));
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261007:1791365140268:liquidation-max-data'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            const files=['native-evm-assembled-tests.tap','connected-primary-consumers.tap','observation-pipeline-tests.tap','integration.json','validation.json','runtime-hashes.txt','native-evm-current-proof.json','native-evm-current-raw.json.gz'],tests={};
            for(const f of files.filter(f=>f.endsWith('.tap'))){const t=fs.readFileSync('audit-output/'+f,'utf8'),pass=Number(t.match(/(?:#|ℹ) pass (\d+)/)?.[1]),fail=Number(t.match(/(?:#|ℹ) fail (\d+)/)?.[1]);if(!Number.isInteger(pass)||fail!==0)throw Error('TEST_NOT_PASS:'+f);tests[f]={pass,fail,sha256:crypto.createHash('sha256').update(t).digest('hex')};}
            if(tests['native-evm-assembled-tests.tap'].pass!==14||tests['observation-pipeline-tests.tap'].pass!==35)throw Error('REQUIRED_TESTS_MISSING');
            const integration=JSON.parse(fs.readFileSync('audit-output/integration.json')),actual=JSON.parse(fs.readFileSync('audit-output/native-evm-current-proof.json'));if(integration.status!=='PASS'||integration.failed!==0)throw Error('INTEGRATION_NOT_PASS');
            const proof={schema:'NATIVE_EVM_PRIMARY_CONNECTED_VERIFICATION_20261007_V1',status:'NATIVE_PRIMARY_IMPLEMENTATION_AND_CONSUMER_TESTS_PASS',tested_head:context.sha,cloud_run:context.runId,tests,integration:{passed:integration.passed,failed:integration.failed},actual_source_status:actual.status,verified_useful_networks:actual.verified_useful_networks||[],source_http:actual.source_http,D1:actual.d1_usage,MAIN:0,Telegram:0,new_fresh_SENT:false,threshold_weights_entry_or_freshness_changed:false,source_clock_refreshed:false,production_total_participation_increase_not_yet_proven:true};
            const entries=[];for(const f of files){const b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('audit-output/'+f).toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/native-evm-connected-'+context.runId+'/'+f,mode:'100644',type:'blob',sha:b.sha});}
            const b=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(proof,null,2)+'\n').toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/NATIVE_EVM_PRIMARY_CONNECTED_VERIFICATION_20261007.json',mode:'100644',type:'blob',sha:b.sha});
            const ref=context.ref.replace('refs/heads/','');if(ref!=='codex/native-evm-connected-20261007')throw Error('REVIEW_REF_MISMATCH');const parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('TESTED_HEAD_MOVED');
            const commit=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:commit.tree.sha,tree:entries})).data,created=(await github.rest.git.createCommit({owner,repo,message:'Retain bounded native primary source facts and connected consumer proof',tree:tree.sha,parents:[parent]})).data;
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:created.sha,force:false});console.log(JSON.stringify({status:proof.status,actual_source_status:proof.actual_source_status,verified_useful_networks:proof.verified_useful_networks,proof_commit:created.sha,tested_head:context.sha,tests,source_http:proof.source_http,MAIN:0,Telegram:0}));
