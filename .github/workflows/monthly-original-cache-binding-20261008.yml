name: Bind qualified original monthly source cache without new queries
on:
  push:
    branches: [codex/monthly-original-cache-binding-20261008]
    paths: ['tools/bind-monthly-original-cache-20261008.mjs', '.github/workflows/monthly-original-cache-binding-20261008.yml']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact owner before bounded work
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='5e389fe1cb66787b6bb29c391a5141ea919eba17')throw Error('MAIN_MOVED');const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString()),phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const parent=(await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');
      - name: Assemble deployed current source and consumer
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          cmp runtime/src/published-monthly-supply-schedule.mjs current-generation/files/src/published-monthly-supply-schedule.mjs
          node --check tools/bind-monthly-original-cache-20261008.mjs
      - name: Conditionally bind one retained qualified source with original expiry
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/bind-monthly-original-cache-20261008.mjs
      - name: Upload measured read and exact source bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-original-cache-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact bounded diagnostic without task changes
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='5e389fe1cb66787b6bb29c391a5141ea919eba17')throw Error('MAIN_MOVED');const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString()),phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const parent=(await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');
            const fs=require('fs');
            if(!fs.existsSync('audit-output/monthly-original-cache.json'))throw Error('NO_READ_PROOF');
            const p=JSON.parse(fs.readFileSync('audit-output/monthly-original-cache.json'));
            if(p.status!=='ACTUAL_ORIGINAL_PRIMARY_SCHEDULE_CACHE_BOUND_AND_READBACK_VERIFIED'||p.sourceHTTP!==0||p.task_writes!==0||p.cache_writes>1||p.d1_usage.unknown_ops!==0||p.d1_usage.rows_read>1000||p.d1_usage.rows_written>16)throw Error('BOUND_SCOPE');
            const index='checkpoints/ACTUAL_ORIGINAL_PRIMARY_MONTHLY_CACHE_BINDING_20261008.json';
            fs.copyFileSync('audit-output/monthly-original-cache.json',index);const files=[index];
            const entries=[];for(const path of files){const b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(path).toString('base64'),encoding:'base64'})).data;entries.push({path,mode:'100644',type:'blob',sha:b.sha});}
            const parentCommit=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,t=(await github.rest.git.createTree({owner,repo,base_tree:parentCommit.tree.sha,tree:entries})).data,c=(await github.rest.git.createCommit({owner,repo,message:'Retain exact original task queue and raw-window diagnostic with measured usage',tree:t.sha,parents:[parent]})).data;
            await github.rest.git.updateRef({owner,repo,ref:context.ref.replace('refs/',''),sha:c.sha,force:false});
            console.log(JSON.stringify({proof_head:c.sha,status:p.status,cache:p.cache}));
