name: Retain automatic reports after native relevance release
on:
  push:
    branches: [codex/automatic-full-batch-20261008]
    paths: ['.github/workflows/automatic-full-batch-20261008.yml']
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read immutable current automatic report and delivery artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),zlib=require('zlib'),owner=context.repo.owner,repo=context.repo.repo;
            const check=async()=>{const h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='fcc57d9333387f0e9047fec260b40f7eeada60d7')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:20261008:1791470809266:full-owner-connected-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');};await check();
            const inputs=[{"id":37792641591,"artifacts":[{"id":11557810723,"name":"report2-telegram-info-proof","digest":"sha256:d345142764d9d923f5c95913693c3c6ebeea08db3323acd06916e5927eeba6f0","head":"9e90488b15c5872b8bd4e50963afdf92732c4273"},{"id":11557391400,"name":"report2-run-result","digest":"sha256:02d7120c62b36280f814a355b2ded6021b9fc119dff747b4945274993ab90b38","head":"9e90488b15c5872b8bd4e50963afdf92732c4273"}],"job":113363850357},{"id":37785013367,"artifacts":[{"id":11553772069,"name":"report2-run-result","digest":"sha256:658c4ec2ee18ee7eaaf6902c2492d4d54dd92af846ae62574c0e094599083ad9","head":"e0f0573cbb9880fcd2d817c5bef696266a313b11"},{"id":11553248704,"name":"report2-telegram-info-proof","digest":"sha256:11a654c2212f76b42902ff05b7e12faa75ebc605a6d81f42c6bbfb01363cfbc4","head":"e0f0573cbb9880fcd2d817c5bef696266a313b11"}],"job":113337464641},{"id":37777495159,"artifacts":[{"id":11551520588,"name":"report2-telegram-info-proof","digest":"sha256:4e454e590d0ff0c609d287ae49129f45cec64ac6df49750108c6893f83e92b46","head":"ea0cc7a97913e7e3da91284a605dc82950c80d6f"},{"id":11551225848,"name":"report2-run-result","digest":"sha256:f5f6a360d0dffe44dabd2feacef92e8370795c0331bb0dae039cb2e88a9a69ed","head":"ea0cc7a97913e7e3da91284a605dc82950c80d6f"}],"job":113311965313},{"id":37769881607,"artifacts":[{"id":11547198771,"name":"report2-run-result","digest":"sha256:c441dc54830826b08105158542481a39f3c781ec07b962510209484a979181b1","head":"241f196ff9f07b85adfb15fb47fcd01fc9cc2799"},{"id":11546974431,"name":"report2-telegram-info-proof","digest":"sha256:4e7c88228879a0855c63d308aaadbd96b3c833d9b0b7447d0565a8980eb71dd0","head":"241f196ff9f07b85adfb15fb47fcd01fc9cc2799"}],"job":113286610437}],out='checkpoints/automatic-pr236-20261008',entries=[],summaries=[];
            fs.mkdirSync(out,{recursive:true});
            for(const s of inputs){const files={};
              await Promise.all(s.artifacts.map(async a=>{const meta=(await github.rest.actions.getArtifact({owner,repo,artifact_id:a.id})).data;if(meta.workflow_run.id!==s.id||meta.workflow_run.head_sha!==a.head||meta.digest!==a.digest)throw Error('ARTIFACT_IDENTITY_MISMATCH');const b=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:a.id,archive_format:'zip'})).data);if('sha256:'+crypto.createHash('sha256').update(b).digest('hex')!==a.digest)throw Error('ZIP_DIGEST_MISMATCH');const folder='retained/'+s.id+'/'+a.name;fs.mkdirSync(folder,{recursive:true});fs.writeFileSync(folder+'.zip',b);cp.execFileSync('unzip',['-q',folder+'.zip','-d',folder]);const name=a.name==='report2-run-result'?'report2-run-result.json':'telegram-info-proof.json',raw=fs.readFileSync(folder+'/'+name);files[a.name]={a,raw,json:JSON.parse(raw)};}));
              const f=files['report2-run-result'],r=f.json,t=files['report2-telegram-info-proof']?.json;if(r.head!==f.a.head||r.source!=='schedule'||t?.head!==f.a.head||t?.source_run_id!==r.run_id)throw Error('SAME_RUN_REPORT_DELIVERY_MISMATCH');
              const candidates=r.candidates.map(c=>({contract:c.contract,snapshot:c.snapshot_id,publication:c.publication_id,fingerprint:c.analytical_fingerprint||c.canonical?.analytical_fingerprint,state:c.canonical_state,canonical_keys:Object.keys(c.canonical||{}),candidate_keys:Object.keys(c),observed_ts:c.canonical?.observed_ts,canonical_trigger:c.canonical?.trigger,canonical_target:c.canonical?.target,canonical_targets:c.canonical?.targets,canonical_gates:c.canonical?.gates,canonical_entry:c.canonical?.entry,canonical_reasons:c.canonical?.reasons,canonical_direction:c.canonical?.direction,canonical_interest:c.canonical?.interest,liquidations:c.canonical?.liquidations,telegram_text:c.telegram_text||c.canonical?.telegram_text||c.canonical?.telegram,manual_text:c.manual_text,coverage:c.block_coverage?.summary||c.block_coverage?.counts,block_use:c.block_decision_use?.summary,blocks:Object.fromEntries(['N01','N02','N05','N12','N15'].map(id=>[id,{coverage:c.block_coverage?.blocks?.[id],use:c.block_decision_use?.blocks?.[id],rendered:c.block_rendered_results?.context_receipts?.filter(x=>x.block_id===id)}]))}));
              const p={schema:'ACTUAL_POST_PR236_AUTOMATIC_ORIGINAL_CLOCK_READBACK_V1',cloud_run:s.id,head:r.head,run_id:r.run_id,generated_at:r.generated_at,status:r.status,reason:r.reason,canonical_persistence:r.canonical_persistence_audit,candidates,acquisition:r.liquidation_source_acquisition_audit,selection:r.candidate_selection_audit,telegram:t,source_artifacts:s.artifacts,reader_run:context.runId,reader_sourceHTTP:0,reader_D1:0,reader_Telegram:0,source_clocks_refreshed:false,full_project_complete:false};summaries.push(p);
              for(const x of Object.values(files)){const raw=zlib.gzipSync(x.raw),blob=(await github.rest.git.createBlob({owner,repo,content:raw.toString('base64'),encoding:'base64'})).data;entries.push({path:out+'/'+s.id+'/'+x.a.name+'.json.gz',mode:'100644',type:'blob',sha:blob.sha});}
              const b=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(p,null,2)+'\n').toString('base64'),encoding:'base64'})).data;entries.push({path:out+'/'+s.id+'/summary.json',mode:'100644',type:'blob',sha:b.sha});
              console.log('AUTOMATIC_REPORT_RETAINED',JSON.stringify({run:s.id,source_run:r.run_id,candidates:candidates.map(c=>({contract:c.contract,state:c.state,direction:c.canonical_direction,liquidation_count:c.liquidations?.all_zones?.length,canonical_keys:c.canonical_keys})),telegram:t?.output}));
            }
            const manifest={schema:'AUTOMATIC_POST_PR236_RETAINED_BATCH_20261008_V1',reader_run:context.runId,inputs,proofs:summaries.map(x=>({cloud_run:x.cloud_run,head:x.head,run_id:x.run_id,generated_at:x.generated_at,path:out+'/'+x.cloud_run+'/summary.json'})),sourceHTTP:0,D1:0,Telegram:0,original_clocks_preserved:true,full_project_complete:false};
            const b=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(manifest,null,2)+'\n').toString('base64'),encoding:'base64'})).data;entries.push({path:out+'/manifest.json',mode:'100644',type:'blob',sha:b.sha});
            await check();const ref=context.ref.replace('refs/heads/',''),parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');const c=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:c.tree.sha,tree:entries})).data,proof=(await github.rest.git.createCommit({owner,repo,message:'Retain actual automatic report and exact delivery original clocks',tree:tree.sha,parents:[parent]})).data;await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:proof.sha,force:false});console.log('RETAINED_PROOF_HEAD',proof.sha);
