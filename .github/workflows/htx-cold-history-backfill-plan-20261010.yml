name: Bounded HTX cold-history backfill plan
on:
  push:
    branches: [codex/htx-cold-history-backfill-plan-20261010]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require active owner lease, no fence and exact review head
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:main})).data.content,'base64').toString()),phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='chatgpt-cold-history-archive-20261010'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_LEASE_BLOCKED');
            if((await github.rest.git.getRef({owner,repo,ref:'heads/codex/htx-cold-history-backfill-plan-20261010'})).data.object.sha!==context.sha)throw Error('REVIEW_HEAD_MOVED');
      - name: Verify actual census, fair rotation and exact reservation
        run: |
          mkdir -p audit-output
          node --check runner/htx-cold-history-backfill-plan.mjs
          node --test runner/htx-cold-history-backfill-plan.test.mjs
          node tools/audit-htx-cold-history-backfill-plan.mjs
          git rev-parse HEAD > audit-output/tested-head.txt
          sha256sum runner/htx-cold-history-backfill-plan.mjs tools/audit-htx-cold-history-backfill-plan.mjs > audit-output/code-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: htx-cold-history-backfill-plan-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
