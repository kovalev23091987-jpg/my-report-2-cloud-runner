name: Verify existing free archive resource identities (GET only)
on:
  push:
    branches: [fix/free-storage-rolling-20261015]
    paths: [checkpoints/FREE_STORAGE_RESOURCE_READBACK_REQUEST_20261015.json]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test runner/free-storage-resource-readback.test.mjs
      - name: Read exact existing identities once; no creation or SQL
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT2_ISOLATED_D1_API_TOKEN: ${{ secrets.REPORT2_ISOLATED_D1_API_TOKEN }}
        run: node tools/readback-free-storage-resources-20261015.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-storage-resource-readback-${{ github.run_id }}
          path: audit-output/free-storage-readback/readback.json
          if-no-files-found: error
          retention-days: 30
