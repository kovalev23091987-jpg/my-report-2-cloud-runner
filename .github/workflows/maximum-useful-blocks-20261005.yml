name: Report 2 Maximum Useful Block Package Validation
on:
  push:
    branches: [codex/maximum-useful-blocks-20261005, codex/maximum-useful-delivery-gate-20261005, codex/quality-neutral-context-repair-20261005, codex/official-source-diagnostic-20261005, codex/general-native-supply-history-20261005, codex/source-use-and-sector-20261005]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble exact runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output audit-input
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Validate connected package without live sources
        run: |
          node current-generation/validate.mjs > audit-output/validation.json
          node --test current-generation/tests/source-accounting-20261005.test.mjs current-generation/tests/coinpaprika-sector-evidence.test.mjs > audit-output/source-accounting-sector.tap
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
          node current-generation/tests/actual-quality-replay.mjs runtime > audit-output/actual-quality-replay.json
          node --test runner/continuation-stage-gate.test.mjs > audit-output/continuation-stage-gate.tap
      - name: Read the already completed failed final joint artifact
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const r = await github.rest.actions.downloadArtifact({owner: context.repo.owner, repo: context.repo.repo, artifact_id: 11353447687, archive_format: 'zip'});
            const zip = Buffer.from(r.data);
            const sha = crypto.createHash('sha256').update(zip).digest('hex');
            if (sha !== 'c53481a8f7c5e221837f047cdfd692e38587a30294f5eec8e83599cddd75249e') throw new Error('SAVED_FINAL_ARTIFACT_HASH_MISMATCH');
            fs.writeFileSync('audit-input/saved-final.zip', zip);
            fs.writeFileSync('audit-output/saved-final-artifact.json', JSON.stringify({run:37329607419,artifact:11353447687,sha256:sha,sourceHTTP:0,historical_only:true}));
      - name: Verify saved immutable facts at their original clock
        run: |
          unzip -q audit-input/saved-final.zip -d audit-input/saved-final
          node current-generation/tests/saved-final-replay.mjs audit-input/saved-final > audit-output/saved-final-replay.json
      - name: Exact package hashes
        if: always()
        run: |
          sha256sum runtime/src/worker.js runtime/runner-main.mjs runtime/src/candidate-evidence-v2-runtime.mjs runtime/src/supplemental-score-evidence.mjs runtime/src/canonical-runtime-adapter.mjs runtime/src/block-decision-use-audit.mjs > audit-output/runtime-sha256.txt
          git rev-parse HEAD > audit-output/github-head.txt
          git rev-parse HEAD^{tree} > audit-output/github-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maximum-useful-blocks-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
