name: Report 2 Core 15 Functional Acceptance
on:
  push:
    branches: [autonomous/core15-functional-acceptance-20261004]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate all 15 consumers and the phase guard in one offline package
        run: |
          mkdir -p audit-output
          node --import ./current-generation/tests/early-evidence-repair/no-network.mjs --test \
            current-generation/tests/candidate-block-coverage.test.mjs \
            current-generation/tests/remaining-block-facts.test.mjs \
            current-generation/tests/unified-block-output.test.mjs \
            current-generation/tests/manual-run-summary.test.mjs \
            current-generation/tests/official-events-evidence.test.mjs \
            current-generation/tests/htx-public-risk-evidence.test.mjs \
            current-generation/tests/deribit-option-risk-batch.test.mjs \
            current-generation/tests/shared-sector-batch.test.mjs > audit-output/core15-consumers.tap
          node --test runner/continuation-stage-gate.test.mjs > audit-output/continuation-stage-gate.tap
      - name: Reconcile immutable source and use proofs without new source calls
        env:
          REPORT2_CONTINUATION_OWNER: 'HTX:20261004T2141:6253a1db'
        run: node audit-fixes/core15-functional-acceptance-20261004/verify-ledger.mjs > audit-output/core15-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core15-functional-acceptance-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
