name: Report 2 Storage Recovery Backup
on:
  push:
    branches: [fix/storage-retention-before-write]
    paths: ['cloudflare/public-collector/storage-backup-request.json']
permissions:
  contents: read
jobs:
  backup-approved-expired-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
      REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Copy exact approved rows and verify every payload hash
        run: node cloudflare/public-collector/storage-backup.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: report2-storage-recovery-backup
          path: |
            report2-expired-market-snapshots-20261004.jsonl.gz
            report2-storage-backup-manifest.json
            report2-retained-snapshot-hashes.json
          if-no-files-found: error
          retention-days: 30
