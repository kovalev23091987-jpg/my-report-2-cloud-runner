name: Existing source history sequence candidate validation
on:
  push:
    branches: ['existing-source-history-sequence-candidate-v1-20260925']
permissions:
  contents: read
concurrency:
  group: existing-source-history-sequence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPORT2_TELEGRAM_SHADOW_DECISION_AUTO: "0"
      REPORT2_V3_TELEGRAM_NETWORK_ENABLED: "0"
      REPORT2_TELEGRAM_OUTPUT_ENABLED: "0"
      REPORT2_TRADING_EXECUTION_ENABLED: "0"
      REPORT2_VALIDATED_SIGNAL_ENABLED: "0"
      REPORT2_LIVE_PROBABILITY_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact parent and protected main
        shell: bash
        run: |
          set -Eeuo pipefail
          PARENT='9057cabf58cc33aebaab33951f026b5acb1a1dbd'
          MAIN='08d98579c5ecbeb4de426ffeb1160f25ece52708'
          test "$(git rev-parse HEAD^)" = "$PARENT"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN"
          mapfile -t changed < <(git diff --name-only "$PARENT" HEAD | sort)
          test "${#changed[@]}" -gt 0
          for p in "${changed[@]}"; do case "$p" in existing-source-history-sequence-delta/*|.github/workflows/existing-source-history-sequence-candidate-validation.yml) ;; *) echo "PROTECTED_PATH_CHANGED:$p" >&2; exit 41;; esac; done
          echo EXACT_PARENT_AND_MAIN_PASS
      - name: Reconstruct current verified runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir runtime
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node runner/apply-telegram-runtime-overlay.mjs runtime runner/telegram-runtime-overlay.json
          node cross-venue-delta-overlay/apply-runtime-overlay.mjs runtime
          node cross-venue-delta-overlay/apply-runtime-overlay.mjs runtime
          node architecture-cleanup-delta/canonical-final-overlay/apply-canonical-final-overlay.mjs runtime
          node existing-source-consumer-delta/overlay/apply-existing-source-consumer-overlay.mjs runtime
          node existing-source-coverage-delta/overlay/apply-existing-source-coverage-overlay.mjs runtime
          echo CURRENT_VERIFIED_RUNTIME_PASS
      - name: Apply history sequence overlay and safety
        shell: bash
        run: |
          set -Eeuo pipefail
          node existing-source-history-sequence-delta/overlay/apply-existing-source-history-sequence-overlay.mjs runtime
          node existing-source-history-sequence-delta/overlay/apply-existing-source-history-sequence-overlay.mjs runtime
          node - <<'NODE'
          const p=require('./runtime/existing-source-history-sequence-overlay-proof.json');
          if(p.production_changed||p.d1_migration||p.telegram_send||p.telegram_recipients_changed||p.cloudflare_deploy||p.force_push||p.hard_gates_changed||p.strategy_weights_changed||p.thresholds_changed||p.automatic_execution||p.validated_signal||p.live_probability||p.new_sources_added||p.worker_copy_added||p.hot_cycle_external_request_delta!==0||p.automatic_voting)process.exit(42);
          console.log('HISTORY_SEQUENCE_OVERLAY_SAFETY_PASS');
          NODE
      - name: Prepare test harness
        shell: bash
        run: |
          set -Eeuo pipefail
          cp cross-venue-delta-overlay/tests/*.mjs runtime/tests/
          cp unified-entry-signal-delta/overlay/runtime-test-overrides/*.mjs runtime/tests/
          cp runner/apply-telegram-runtime-overlay.mjs runner/runner-main.mjs runner/r8-20-prospective-validation-sidecar.mjs runner/telegram-info-runtime.mjs runner/telegram-output.mjs runner/telegram-zero-reason.mjs runner/plain-text-telegram.mjs runner/telegram-readonly-diagnostic.mjs runner/report2-d1-adapter.mjs runner/d1-preaction-budget-guard.mjs runtime/
          cp -R telegram-repair-tests runtime/telegram-repair-tests
          echo FINAL_RUNTIME_HARNESS_PASS
      - name: History sequence focused tests
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check runtime/src/existing-source-consumer.mjs
          node --check runtime/src/history-sequence-utility.mjs
          node --check existing-source-history-sequence-delta/maintenance/history-sequence-live-proof.mjs
          node --test --test-reporter=tap existing-source-history-sequence-delta/overlay/tests/*.test.mjs > history-sequence-tests.tap
          grep -F '# fail 0' history-sequence-tests.tap >/dev/null
          echo HISTORY_SEQUENCE_FOCUSED_PASS
      - name: Retained focused suites
        shell: bash
        env:
          REPORT2_EXISTING_SOURCE_RUNTIME_DIR: runtime
          REPORT2_ARCH_RUNTIME_DIR: runtime
        run: |
          set -Eeuo pipefail
          node --test --test-reporter=tap existing-source-coverage-delta/overlay/tests/*.test.mjs > coverage-retained.tap
          node --test --test-reporter=tap existing-source-consumer-delta/overlay/tests/*.test.mjs > consumer-retained.tap
          node --test --test-reporter=tap architecture-cleanup-delta/overlay/tests/*.test.mjs > architecture-retained.tap
          node --test --test-reporter=tap free-sources-delta/overlay/tests/*.test.mjs > free-sources-retained.tap
          rm -rf r10_7_auth && mkdir -p r10_7_auth && ln -s ../runtime/src r10_7_auth/src
          node --test --test-reporter=tap unified-entry-signal-delta/overlay/tests/*.test.mjs > unified-retained.tap
          for f in coverage-retained.tap consumer-retained.tap architecture-retained.tap free-sources-retained.tap unified-retained.tap; do grep -F '# fail 0' "$f" >/dev/null; done
          echo RETAINED_FOCUSED_PASS
      - name: Inherited runtime regression
        working-directory: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test --test-reporter=tap tests/cross-venue-delta.test.mjs tests/public-evidence-adapters.test.mjs tests/full-evidence-contract.test.mjs tests/full-evidence-shadow-model.test.mjs tests/report2-source-isolation.test.mjs > cross-venue-delta-tests.tap
          mapfile -t regression_files < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'deep-check-journal.CHECKPOINT-full-evidence-shadow-production.test.mjs' ! -name 'deep-check-journal.CHECKPOINT-shadow-decision-layer-production.test.mjs' ! -name 'deep-check-journal.CHECKPOINT-shadow-outcome-calibration-production.test.mjs' ! -name 'htx-liquidation-budget.test.mjs' ! -name 'v3-telegram-lifecycle-sidecar.test.mjs' ! -name 'v3-telegram-lifecycle-sidecar-sqlite.test.mjs' -print | sort)
          node --test --test-reporter=tap "${regression_files[@]}" > runtime-regression-tests.tap
          node --test --test-reporter=tap tests/fast-move-watch-failure-injection.test.mjs tests/multi-wave-campaign-failure-injection.test.mjs tests/final-decision-integration-failure-injection.test.mjs > failure-injection-tests.tap
          echo INHERITED_ACTIVE_REGRESSION_PASS
      - name: Telegram and TZ10.1 retention
        working-directory: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test --test-reporter=tap telegram-repair-tests/*.test.mjs > telegram-candidate-tests.tap
          node telegram-repair-tests/final-chain-regression.mjs > telegram-final-chain.txt
          node --test --test-reporter=tap tests/tz101-publication-input-runtime.test.mjs tests/tz101-liquidation-context.test.mjs tests/tz101-publication-runtime.test.mjs tests/tz101-publication-wiring-static.test.mjs tests/tz101-scenario-plan.test.mjs tests/tz101-cost-assessment.test.mjs > tz101-candidate-tests.tap
          echo TELEGRAM_TZ101_RETENTION_PASS
      - name: Live history sequence utility proof
        shell: bash
        env:
          REPORT2_HISTORY_SEQUENCE_RUNTIME_DIR: runtime
        run: |
          set -Eeuo pipefail
          REPORT2_HISTORY_SEQUENCE_PROOF_OUTPUT=history-sequence-live-proof.json node existing-source-history-sequence-delta/maintenance/history-sequence-live-proof.mjs
          node - <<'NODE'
          const p=require('./history-sequence-live-proof.json');
          if(p.production_writes||p.d1_writes||p.telegram_send||p.trading||p.auto_payment||p.calls_used>p.max_calls)process.exit(43);
          if(p.binance_history?.normalized?.status!=='CLOSED'||p.binance_history.normalized.span_days<30||p.binance_history.normalized.gaps!==0)process.exit(44);
          if(p.coinbase_sequence?.normalized?.status!=='CLOSED'||p.coinbase_sequence.normalized.recovery!=='REST_L2_SNAPSHOT_RELOAD'||p.coinbase_sequence.normalized.institutional_buying_claim!==false)process.exit(45);
          if(p.bitget_utility?.utility?.status!=='CLOSED'||p.bitget_utility.utility.decision!=='KEEP_SHADOW_THIRD_VENUE_CONTEXT_ONLY'||p.bitget_utility.utility.automatic_voting!==false)process.exit(46);
          if(p.hyperliquid_recorder_audit?.decision!=='KEEP_SHADOW_NO_PRODUCTION_RECORDER_EXTENSION_FOUND')process.exit(47);
          for(const k of ['binance','coinbase','bitget']){const c=p.checks[k];if(!c.canonical_closed||!c.manual_ok||!c.telegram_ok||!c.fingerprint_equal||!c.manual_has_context||!c.telegram_has_context)process.exit(48);}
          console.log('LIVE_HISTORY_SEQUENCE_UTILITY_PASS');
          NODE
      - name: Read-only replay retention
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_REPLAY_OUTPUT: history-sequence-unified-replay.json
          REPORT2_FREE_FUNNEL_OUTPUT: history-sequence-funnel-replay.json
        shell: bash
        run: |
          set -Eeuo pipefail
          node runner/telegram-readonly-diagnostic.mjs
          node unified-entry-signal-delta/validation/unified-readonly-replay.mjs
          node free-sources-delta/validation/free-sources-funnel-replay.mjs
          REPORT2_ARCH_STATS_OUTPUT=history-sequence-shadow-statistics.json node architecture-cleanup-delta/validation/architecture-shadow-statistics.mjs
          node - <<'NODE'
          const u=require('./history-sequence-unified-replay.json'),f=require('./history-sequence-funnel-replay.json'),s=require('./history-sequence-shadow-statistics.json');
          if(u.d1_usage?.rows_written!==0||u.d1_usage?.unknown_ops!==0||u.no_lookahead?.status==='FAIL')process.exit(49);
          if(f.production_writes!==false||f.d1_usage?.rows_written!==0||f.d1_usage?.unknown_ops!==0)process.exit(50);
          if(s.d1_usage?.rows_written!==0||s.d1_usage?.unknown_ops!==0)process.exit(51);
          console.log('READ_ONLY_REPLAY_RETENTION_PASS');
          NODE
      - name: Verify protected main unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN='08d98579c5ecbeb4de426ffeb1160f25ece52708'
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN"
          echo PRODUCTION_MAIN_UNCHANGED_PASS
      - name: Save proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-source-history-sequence-candidate-proof
          path: |
            runtime/existing-source-history-sequence-overlay-proof.json
            history-sequence-tests.tap
            coverage-retained.tap
            consumer-retained.tap
            architecture-retained.tap
            free-sources-retained.tap
            unified-retained.tap
            runtime/cross-venue-delta-tests.tap
            runtime/runtime-regression-tests.tap
            runtime/failure-injection-tests.tap
            runtime/telegram-candidate-tests.tap
            runtime/telegram-final-chain.txt
            runtime/tz101-candidate-tests.tap
            history-sequence-live-proof.json
            telegram-readonly-diagnosis.json
            history-sequence-unified-replay.json
            history-sequence-funnel-replay.json
            history-sequence-shadow-statistics.json
            existing-source-history-sequence-delta/spec/*.md
          retention-days: 14
