name: Report 2 Actual Official N07 Acceptance
on:
  push:
    branches: [autonomous/n07-official-context-acceptance-20261004]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble accepted runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Validate the targeted new N07 requirement
        run: |
          REPORT2_OFFICIAL_MODULE_ROOT=runtime/src node --test current-generation/tests/official-events-evidence.test.mjs current-generation/tests/official-source-registry.test.mjs > audit-output/n07-targeted.tap
          node --test runner/continuation-stage-gate.test.mjs > audit-output/continuation-stage-gate.tap
      - name: Verify actual official event reaches the approved report
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_CONTINUATION_OWNER: 'HTX:20261004T2141:6253a1db'
        run: node audit-fixes/n07-official-context-acceptance-20261004/verify-live.mjs runtime > audit-output/n07-official-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n07-official-context-acceptance-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
