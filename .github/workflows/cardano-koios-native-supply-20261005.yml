name: Report 2 Actual Cardano Koios Acceptance
on:
  push:
    branches: [autonomous/cardano-koios-native-supply-20261005]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Validate changed package once
        run: |
          REPORT2_NATIVE_MODULE_ROOT=runtime/src node --test current-generation/tests/cardano-koios-native-supply.test.mjs current-generation/tests/chain-supply-evidence.test.mjs current-generation/tests/native-supply-batch.test.mjs current-generation/tests/technical-native-facts.test.mjs > audit-output/cardano-targeted.tap
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
          # Runtime was already assembled with the current overlay above. Validate
          # the full source tree once; integration + exact cmp below validate the
          # assembled runtime without applying the overlay a second time.
          node current-generation/validate.mjs > audit-output/validation.json
          node --test runner/continuation-stage-gate.test.mjs > audit-output/continuation-stage-gate.tap
          cmp current-generation/files/src/chain-supply-evidence.mjs runtime/src/chain-supply-evidence.mjs
          cmp current-generation/files/src/evidence-source-adapters.mjs runtime/src/evidence-source-adapters.mjs
          cmp current-generation/files/src/candidate-evidence-v2-runtime.mjs runtime/src/candidate-evidence-v2-runtime.mjs
          cmp current-generation/files/src/block-result-context.mjs runtime/src/block-result-context.mjs
      - name: Verify actual Koios data reaches approved reports
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_CONTINUATION_OWNER: 'HTX:20261005T034920950Z:e7b9ca73-6a44-43a7-9a28-3d98175bb64c'
        run: node audit-fixes/cardano-koios-acceptance-20261005/verify-live.mjs runtime > audit-output/cardano-koios-acceptance.json
      - name: Runtime manifest
        if: always()
        run: |
          sha256sum runtime/src/chain-supply-evidence.mjs runtime/src/evidence-source-adapters.mjs runtime/src/candidate-evidence-v2-runtime.mjs runtime/src/block-result-context.mjs > audit-output/runtime-sha256.txt
          git rev-parse HEAD > audit-output/github-head.txt
          git rev-parse HEAD^{tree} > audit-output/github-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardano-koios-acceptance-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
