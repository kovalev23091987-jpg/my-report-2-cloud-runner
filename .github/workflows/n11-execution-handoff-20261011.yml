name: N11 HTX execution handoff and Telegram gate offline
on:
  pull_request:
    paths:
      - .github/workflows/n11-execution-handoff-20261011.yml
      - current-generation/files/src/tz101-execution-facts.mjs
      - current-generation/files/src/canonical-runtime-adapter.mjs
      - current-generation/files/src/worker.js
      - current-generation/tests/decision-timeline.runtime.mjs
      - current-generation/validate.mjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require unchanged main, bounded N11 owner lease and inactive fence
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(main!==context.payload.pull_request.base.sha)throw Error('MAIN_MOVED');
            const read=async(path,ref)=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json',main);
            const branch=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json',context.payload.pull_request.head.sha);
            const fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json',main);
            if(!/^CODEX:OWNER_/.test(phase.lease?.owner||'')||branch.lease?.owner!==phase.lease.owner||branch.lease?.acquired_ts!==phase.lease.acquired_ts||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Assemble current encrypted runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output/n11-execution-handoff
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/n11-execution-handoff/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Verify HTX book source, routed side, publication gate and approved output offline
        env:
          REPORT2_TEST_RUNTIME: runtime
          REPORT2_UNIFIED_MODULE_ROOT: runtime/src
          NODE_OPTIONS: --import ${{ github.workspace }}/current-generation/tests/early-evidence-repair/no-network.mjs
        run: |
          cmp current-generation/files/src/worker.js runtime/src/worker.js
          cmp current-generation/files/src/tz101-execution-facts.mjs runtime/src/tz101-execution-facts.mjs
          cmp current-generation/files/src/canonical-runtime-adapter.mjs runtime/src/canonical-runtime-adapter.mjs
          node --test current-generation/tests/execution-report-context.test.mjs current-generation/tests/early-observation-target-pending.test.mjs > audit-output/n11-execution-handoff/target-unit.tap
          node current-generation/tests/decision-timeline.runtime.mjs runtime > audit-output/n11-execution-handoff/decision-timeline.json
          node --test current-generation/tests/paused-block-report-chains.test.mjs > audit-output/n11-execution-handoff/report-telegram.tap
          node current-generation/validate.mjs > audit-output/n11-execution-handoff/generation.log 2>&1
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/n11-execution-handoff/binding.json
      - name: Show failure locations
        if: failure()
        run: |
          for file in audit-output/n11-execution-handoff/*.tap audit-output/n11-execution-handoff/generation.log audit-output/n11-execution-handoff/decision-timeline.json; do
            if test -f "$file"; then echo "FAILED_LOG: $file"; tail -90 "$file"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n11-execution-handoff-${{ github.run_id }}
          path: audit-output/n11-execution-handoff/
          retention-days: 30
