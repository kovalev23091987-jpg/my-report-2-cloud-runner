name: Report2 Exact Retained Current Data
on:
  push:
    branches: [codex/exact-retained-current-20261006]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fresh owner and exact head
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='8b5361e77ea16ccb04ed02fa055f3c6f53eeb32f')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261005T215136067Z:source-storage'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Read four exact retained rows under D1 budget
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node runner/exact-retained-current-20261006.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-retained-current-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
