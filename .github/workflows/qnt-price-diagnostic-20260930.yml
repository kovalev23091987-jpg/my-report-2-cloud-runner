name: QNT exact price diagnostic
on:
  push:
    branches: [autonomous/qnt-price-20260930]
    paths:
      - audit-fixes/qnt-price-20260930/**
      - .github/workflows/qnt-price-diagnostic-20260930.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read eight exact public endpoints once
        run: node audit-fixes/qnt-price-20260930/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qnt-exact-price-${{ github.run_id }}
          path: qnt-price-output/
          retention-days: 30
