name: Retained HTX daily price series validation
on:
  push:
    branches: [codex/htx-retained-series-20261009]
    paths: ['runner/htx-delayed-price*','tools/verify-htx-retained-series.mjs','.github/workflows/htx-retained-series-20261009.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact main, current own lease and review head
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(h!=='a1ed4ca6d90e7f333c4e2811d23daaa67c0030d4')throw Error('MAIN_MOVED');
            const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='CODEX:FULL_TZ:20261009:HISTORY_SERIES:1791565038304'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');
            if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
      - name: Restore checksum-bound retained native day without new source calls
        run: |
          python - <<'PY'
          import hashlib,pathlib,zipfile
          p=pathlib.Path('checkpoints/native-kline-price-connected-37929161332.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='854bc3431a77a13c17fbb4da57ae314c034d4f8df6de2e1edbc40a14ea0cefe5'
          with zipfile.ZipFile(p) as z:z.extractall('retained-native')
          PY
      - name: Validate bounded series and exact historical endpoint consumer
        run: |
          mkdir -p audit-output
          node --test runner/htx-delayed-price-series.test.mjs > audit-output/series-tests.tap
          node tools/verify-htx-retained-series.mjs retained-native/native-price-history audit-output/native-series-consumer-proof.json > audit-output/consumer-console.json
          git rev-parse HEAD > audit-output/head.txt
          sha256sum runner/htx-delayed-price-history.mjs tools/verify-htx-retained-series.mjs > audit-output/changed-code-hashes.txt
          sha256sum current-generation/files/src/worker.js current-generation/files/src/outcome-v2.mjs > audit-output/unchanged-consumer-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: htx-retained-series-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
