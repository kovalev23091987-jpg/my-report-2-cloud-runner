name: Report2 Retained Current PairInfos Failure Decode
on:
  push:
    branches: [codex/veranta-current-pairinfos-retained-20261007]
    paths: ['tools/decode-veranta-current-pairinfos-retained-20261007.mjs', '.github/workflows/veranta-current-pairinfos-retained-20261007.yml']
permissions:
  contents: write
  actions: read
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fresh main phase and fence before retained-only verification
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;if(head!=='dc7ce51fea3b29cdb0d50379974a40f74d270747')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64'));
            const p=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),f=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(p.lease?.owner!=='HTX:20261007:1791399140815:cache-only-full-register'||p.lease.expires_ts<=Date.now()||f.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Decode exact retained failure without source HTTP or D1
        run: node tools/decode-veranta-current-pairinfos-retained-20261007.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: veranta-current-pairinfos-retained-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Retain verified original failure
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;if(head!=='dc7ce51fea3b29cdb0d50379974a40f74d270747')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64'));
            const p=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),f=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(p.lease?.owner!=='HTX:20261007:1791399140815:cache-only-full-register'||p.lease.expires_ts<=Date.now()||f.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            const fs=require('fs'),owner=context.repo.owner,repo=context.repo.repo,ref=context.ref.replace('refs/heads/','');if(ref!=='codex/veranta-current-pairinfos-retained-20261007')throw Error('REVIEW_REF_MISMATCH');const parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_HEAD_MOVED');
            const commit=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('audit-output/veranta-current-pairinfos-retained-failure.json').toString('base64'),encoding:'base64'})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:commit.tree.sha,tree:[{path:'checkpoints/VERANTA_CURRENT_PAIRINFOS_RETAINED_FAILURE_20261007.json',mode:'100644',type:'blob',sha:b.sha}]})).data,created=(await github.rest.git.createCommit({owner,repo,message:'Retain exact current PairInfos verification failure without repeat request',tree:tree.sha,parents:[parent]})).data;await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:created.sha,force:false});console.log(JSON.stringify({proof_commit:created.sha,sourceHTTP:0,D1:0,MAIN:0,Telegram:0}));
