name: Retain exact current NEAR native receipt
on:
  push:
    branches: [codex/current-near-native-receipt-20261008]
    paths: ['.github/workflows/current-near-native-receipt-20261008.yml']
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify original artifact and retain source-to-report proof
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),owner=context.repo.owner,repo=context.repo.repo;
            const ref=context.ref.replace('refs/heads/','');
            const assertOwner=async()=>{const h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='ff8fdceb0e1b56ddc6149579e2d34dd563fbb061')throw Error('MAIN_MOVED');const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString());const p=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),f=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(p.lease?.owner!=='HTX:20261008:1791430073069:trigger-history-reader-fix'||p.lease.expires_ts<=Date.now()||f.active)throw Error('OWNER_BLOCKED');};
            await assertOwner();
            const artifact=(await github.rest.actions.getArtifact({owner,repo,artifact_id:11527976123})).data;
            if(artifact.workflow_run.id!==37725892943||artifact.workflow_run.head_sha!=='ff8fdceb0e1b56ddc6149579e2d34dd563fbb061'||artifact.digest!=='sha256:5a0cf3aac4bcda46e09903bb510c40156ed273c681312d3ee7fda43107429052')throw Error('EXACT_ARTIFACT_RUN_HEAD_MISMATCH');
            const b=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:11527976123,archive_format:'zip'})).data);
            if(crypto.createHash('sha256').update(b).digest('hex')!=='5a0cf3aac4bcda46e09903bb510c40156ed273c681312d3ee7fda43107429052')throw Error('ARTIFACT_DIGEST_MISMATCH');
            fs.writeFileSync('current-near.zip',b);fs.mkdirSync('retained',{recursive:true});cp.execFileSync('unzip',['-q','current-near.zip','-d','retained']);
            const raw=fs.readFileSync('retained/report2-run-result.json'),r=JSON.parse(raw);
            console.log('ACTUAL_ARTIFACT_IDENTITY',JSON.stringify({head:r.head,source:r.source,mode:r.mode,contract:r.verified_candidate,run_id:r.run_id}));
            if(r.head!=='340f249cceda6204c4cee125dd84dda2e107c9290bc629f206d79ffa3335eebc'||r.source!=='manual'||r.mode!=='LIQUIDATION_ONLY'||r.verified_candidate!=='NEAR-USDT'||r.run_id!=='LIQ_ONLY:1791432460451')throw Error('EXACT_RUN_MISMATCH');
            const map=r.liquidation_map||r.result?.liquidation_map;
            console.log('RETAINED_OUTPUT_KEYS',JSON.stringify(Object.keys(r)));
            if(!map)throw Error('MAP_MISSING');
            if(map.future_levels_status!=='EXTERNAL_SOURCE_LEVELS_AVAILABLE'||!map.below.length||!map.above.length)throw Error('NATIVE_LEVELS_MISSING');
            const source=r.liquidation_sources||r.result?.liquidation_sources;
            const p={schema:'ACTUAL_POST_PR236_NEAR_NATIVE_SOURCE_CONTROL_20261008_V1',status:'FRESH_NATIVE_LEVELS_IN_EXACT_LIQUIDATION_ONLY_REPORT',cloud_run:37725892943,job:113144018176,head:artifact.workflow_run.head_sha,worker_sha256:r.head,run_id:r.run_id,mode:r.mode,source:r.source,generated_at:r.generated_at,contract:'NEAR-USDT',artifact_id:11527976123,artifact_digest:'sha256:5a0cf3aac4bcda46e09903bb510c40156ed273c681312d3ee7fda43107429052',original_report_sha256:crypto.createHash('sha256').update(raw).digest('hex'),coverage_admission:r.coverage_admission,above:map.above,below:map.below,liquidation_sources:source,source_receipts:map.source_receipts,source_chain:r.source_chain,freshness_audit:r.freshness_audit,d1_usage:r.d1_usage,request_caps:r.request_caps,report_text:r.report_text,reader_cloud_run:context.runId,reader_sourceHTTP:0,reader_D1:0,reader_Telegram:0,source_clocks_refreshed:false,fresh_automatic_SENT:false,actual_ENTRY:false,full_project_complete:false,scope:'Current liquidation-only manual native source and report verified; not new automatic Telegram or full ENTRY acceptance.'};
            console.log('CURRENT_NEAR_NATIVE_PROOF',JSON.stringify(p));
            await assertOwner();const parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');
            const entries=[];for(const [path,buf] of [['checkpoints/current-near-native-20261008/report2-run-result.json',raw],['checkpoints/ACTUAL_POST_PR236_NEAR_NATIVE_SOURCE_CONTROL_20261008.json',Buffer.from(JSON.stringify(p,null,2)+'\n')]]){const blob=(await github.rest.git.createBlob({owner,repo,content:buf.toString('base64'),encoding:'base64'})).data;entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}
            const base=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data;
            const tree=(await github.rest.git.createTree({owner,repo,base_tree:base.tree.sha,tree:entries})).data;
            const c=(await github.rest.git.createCommit({owner,repo,message:'Retain exact current NEAR native levels and report without new source calls',tree:tree.sha,parents:[parent]})).data;
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:c.sha,force:false});
            console.log('CURRENT_NEAR_PROOF_COMMIT',c.sha);
