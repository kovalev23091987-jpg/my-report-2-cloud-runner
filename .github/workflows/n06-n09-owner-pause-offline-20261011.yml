name: N06 N07 N08 N09 owner pause offline validation
on:
  pull_request:
    paths:
      - .github/workflows/n06-n09-owner-pause-offline-20261011.yml
      - checkpoints/OWNER_PAUSED_N06_N07_N08_N09_SHARED_SOURCE_AUDIT_20261011.json
  push:
    branches: [main]
    paths:
      - .github/workflows/n06-n09-owner-pause-offline-20261011.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact main, owner lease and inactive fence
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(context.eventName==='push' && main!==context.sha)throw Error('MAIN_MOVED');
            if(context.eventName==='pull_request' && main!==context.payload.pull_request.base.sha)throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json');
            const fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            if(phase.lease?.owner!=='CODEX:OWNER_APPROVED_PR312_MAIN:1791733288680'||phase.lease.expires_ts<=Date.now()){
              core.info('Prior N06-N09 pause proof is retained; another owner holds the current phase. No assembled check is run.');
              core.setOutput('run','false');return;
            }
            core.setOutput('run','true');
      - name: Assemble the current encrypted runtime
        if: steps.guard.outputs.run == 'true'
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output/n06-n09-owner-pause
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/n06-n09-owner-pause/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Validate paused report and Telegram chains without provider calls
        if: steps.guard.outputs.run == 'true'
        env:
          REPORT2_TEST_RUNTIME: runtime
          REPORT2_UNIFIED_MODULE_ROOT: runtime/src
          NODE_OPTIONS: --import ${{ github.workspace }}/current-generation/tests/early-evidence-repair/no-network.mjs
        run: |
          node current-generation/validate.mjs > audit-output/n06-n09-owner-pause/generation.log 2>&1
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/n06-n09-owner-pause/binding.json
          tail -35 audit-output/n06-n09-owner-pause/generation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n06-n09-owner-pause-${{ github.run_id }}
          path: audit-output/n06-n09-owner-pause/
          retention-days: 30
