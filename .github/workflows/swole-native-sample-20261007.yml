name: Report2 Alternative Native Account Discovery
on:
  push:
    branches: [codex/swole-native-sample-20261007]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current owner and immutable main
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='2bf8bedca66ee82f80d57b3d1fdc78bfb68a3635')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261007:1791360171004:owner-authorized-new-chat'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Load original discovery without another page request
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
            const b=Buffer.from((await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:11470748481,archive_format:'zip'})).data);
            if(crypto.createHash('sha256').update(b).digest('hex')!=='694548d35df21a786aa943520195a4ad67a6132db2aa93ce493f3fd23443caa3')throw Error('DISCOVERY_ARTIFACT_DIGEST_MISMATCH');
            fs.mkdirSync('retained-discovery',{recursive:true});fs.writeFileSync('retained-discovery.zip',b);cp.execFileSync('unzip',['-q','retained-discovery.zip','-d','retained-discovery']);
      - name: Verify one nearest native account using the retained discovery and original page clock
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/verify-swole-native-sample-20261007.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swole-native-sample-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
