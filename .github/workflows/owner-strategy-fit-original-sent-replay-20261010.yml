name: Original SENT Telegram strategy-fit no-drop replay
on:
  push:
    branches: [codex/owner-telegram-original-sent-shadow-replay-20261010]
    paths:
      - tools/replay-owner-strategy-fit-original-sent-20261010.mjs
      - .github/workflows/owner-strategy-fit-original-sent-replay-20261010.yml
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require same bounded owner lease and exact tested head
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json');
            const fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(fence.active||phase.lease?.owner!=='CHATGPT:OWNER_STRATEGY_FIT_SHADOW:20261010'||phase.lease.expires_ts<=Date.now())throw Error('OWNER_LEASE_REQUIRED');
            if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_HEAD_MOVED');
      - name: Replay original retained SENT snapshots and prove zero selection or message changes
        run: |
          set -e
          node --check tools/replay-owner-strategy-fit-original-sent-20261010.mjs
          node tools/replay-owner-strategy-fit-original-sent-20261010.mjs
          git rev-parse HEAD > audit-output/tested-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sent-shadow-no-drop-${{ github.run_id }}
          path: audit-output/
          retention-days: 90
