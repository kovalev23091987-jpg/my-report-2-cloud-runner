name: Report 2 Source Role Audit
on:
  push:
    branches: [repair/manual-request-result-binding-v2-20261001, autonomous/verified-flow-binding-20260930, autonomous/sector-integration-20260930, autonomous/current-acceptance-20260930, autonomous/okx-asset-class-20260930, autonomous/volume-profile-20260930, autonomous/free-sources-20260930, autonomous/volume-research-20260930, autonomous/receipt-context-20260930, autonomous/htx-flow-integrity-20260930, autonomous/source-quota-role-20260930, autonomous/source-role-consumer-20260930, autonomous/prospective-repair-20260930, autonomous/prospective-integration-20260930, autonomous/source-allocation-20260930, autonomous/source-allocation-cache-20260930, autonomous/specialist-context-20260930, autonomous/specialist-consumers-20260930, autonomous/exchange-flows-20260930, autonomous/exchange-flow-acceptance-20260930]
    paths:
      - current-generation/**
      - runner/current-runtime-binding.mjs
      - .github/workflows/early-evidence-isolated-acceptance.yml
      - runner/r8-20-prospective-validation-sidecar.mjs
      - audit-fixes/source-optimization-20260930/**
      - audit-fixes/v13/p1-integration-17.mjs
      - .github/workflows/source-role-audit-20260930.yml
permissions:
  contents: read
concurrency:
  group: report2-source-role-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fence the candidate to its expected production commit
        if: github.ref != 'refs/heads/repair/manual-request-result-binding-v2-20261001'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          current=$(gh api repos/${{ github.repository }}/branches/main --jq .commit.sha)
          expected=$(node -p "JSON.parse(require('fs').readFileSync('audit-fixes/source-optimization-20260930/execution-lock.json')).expected_main")
          test "$current" = "$expected"
          gh api repos/${{ github.repository }}/contents/audit-fixes/source-optimization-20260930/execution-lock.json?ref=report2-execution-lock --jq .content | base64 --decode > /tmp/shared-lock.json
          node --input-type=module -e "import fs from 'node:fs';const l=JSON.parse(fs.readFileSync('/tmp/shared-lock.json')),candidate=JSON.parse(fs.readFileSync('audit-fixes/source-optimization-20260930/execution-lock.json'));if(!l.active||l.owner!==candidate.owner||l.expected_main!==candidate.expected_main||Date.parse(l.expires_at)<=Date.now())throw Error('SHARED_RELEASE_LOCK_REQUIRED')"
      - name: Assemble exact runtime and pinned SDK
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Validate the complete change block
        run: |
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/current-runtime-binding.json
          node current-generation/validate.mjs > audit-output/validation.json
          REPORT2_CLASS_TEST_ROOT="$(realpath runtime/src)" node --test current-generation/tests/okx-asset-class.test.mjs > audit-output/okx-asset-class.tap
          node current-generation/tests/specialist-consumers.runtime.mjs runtime > audit-output/specialist-consumers.json
          node current-generation/tests/sector-context.runtime.mjs runtime > audit-output/sector-context.json
          node current-generation/tests/volume-profile.runtime.mjs runtime > audit-output/volume-profile.json
          node --import ./current-generation/tests/early-evidence-repair/no-network.mjs --test current-generation/tests/early-evidence-repair/repair.test.mjs telegram-repair-tests/v3-early-sidecar.test.mjs > audit-output/early.tap
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
          node current-generation/tests/htx-trade-json.runtime.mjs runtime > audit-output/htx-trade-runtime.json
          node current-generation/tests/verified-futures-flow-binding.runtime.mjs runtime > audit-output/verified-flow-binding.json
          node current-generation/tests/prospective-public-history.runtime.mjs runtime > audit-output/prospective-runtime.tap
          node current-generation/tests/approved-entry-performance.runtime.mjs runtime > audit-output/prospective-performance.json
          REPORT2_QUOTA_TEST_MODULE="file://$(realpath runtime/src/cross-exchange-risk-context.mjs)" node --test current-generation/tests/coinalyze-quota-fallback.test.mjs > audit-output/quota-fallback-runtime.tap
          node --test current-generation/tests/quota-periods.test.mjs current-generation/tests/source-health-journal.test.mjs > audit-output/quota-boundaries-health.tap
          REPORT2_ROLE_TEST_MODULE="file://$(realpath runtime/src/source-role-consumer.mjs)" REPORT2_ROLE_PUBLICATION_MODULE="file://$(realpath runtime/src/canonical-publication.mjs)" node --test current-generation/tests/source-role-evidence.test.mjs > audit-output/source-role-evidence-runtime.tap
          node audit-fixes/source-optimization-20260930/runtime-manifest.mjs runtime audit-output/runtime-manifest.json
      - name: Verify ready sector producers with six public requests at most
        if: github.ref == 'refs/heads/autonomous/sector-integration-20260930'
        run: node audit-fixes/sector-integration-20260930/live-acceptance.mjs runtime
      - name: Verify isolated manual request and actual assembled result binding
        if: github.ref == 'refs/heads/repair/manual-request-result-binding-v2-20261001'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          current=$(gh api repos/${{ github.repository }}/branches/main --jq .commit.sha)
          expected=$(node -p "JSON.parse(require('fs').readFileSync('audit-fixes/source-optimization-20260930/execution-lock.json')).expected_main")
          test "$current" = "$expected"
          node --check runtime/runner-main.mjs
          node --check runner/enqueue-manual-command.mjs
          REPORT2_MANUAL_BINDING_MODULE="file://$(realpath runtime/src/manual-result-binding.mjs)" node --test current-generation/tests/manual-result-binding.test.mjs > audit-output/manual-result-binding.tap
      - name: Explain failed offline checks
        if: failure()
        run: |
          for file in audit-output/*.tap audit-output/specialist-consumers.json; do
            if [ -f "$file" ]; then tail -80 "$file"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-role-validation-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
  live:
    if: github.ref != 'refs/heads/repair/manual-request-result-binding-v2-20261001' && github.ref != 'refs/heads/autonomous/verified-flow-binding-20260930' && github.ref != 'refs/heads/autonomous/sector-integration-20260930' && github.ref != 'refs/heads/autonomous/current-acceptance-20260930' && github.ref != 'refs/heads/autonomous/okx-asset-class-20260930' && github.ref != 'refs/heads/autonomous/volume-profile-20260930' && github.ref != 'refs/heads/autonomous/exchange-flow-acceptance-20260930' && github.ref != 'refs/heads/autonomous/exchange-flows-20260930' && github.ref != 'refs/heads/autonomous/specialist-consumers-20260930' && github.ref != 'refs/heads/autonomous/specialist-context-20260930' && github.ref != 'refs/heads/autonomous/receipt-context-20260930' && github.ref != 'refs/heads/autonomous/source-quota-role-20260930' && github.ref != 'refs/heads/autonomous/source-role-consumer-20260930' && github.ref != 'refs/heads/autonomous/prospective-repair-20260930' && github.ref != 'refs/heads/autonomous/prospective-integration-20260930' && github.ref != 'refs/heads/autonomous/source-allocation-20260930' && github.ref != 'refs/heads/autonomous/source-allocation-cache-20260930'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        phase: [htx-flow]
    env:
      REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
      REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
      REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
      OXARCHIVE_API_KEY: ${{ secrets.OXARCHIVE_API_KEY }}
      LIQFLOW_API_KEY: ${{ secrets.LIQFLOW_API_KEY }}
      COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
      BLOCKSCOUT_PRO_API_KEY: ${{ secrets.BLOCKSCOUT_PRO_API_KEY }}
      REPORT2_SUPPLEMENTAL_IDENTITY_REGISTRY_JSON: ${{ secrets.REPORT2_SUPPLEMENTAL_IDENTITY_REGISTRY_JSON }}
      REPORT2_V3_TELEGRAM_NETWORK: '0'
      REPORT2_DISABLE_TELEGRAM: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble exact verified runtime
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Audit bounded sources with Telegram disabled
        run: node audit-fixes/source-optimization-20260930/live-audit.mjs runtime '${{ matrix.phase }}' 'audit-output/${{ matrix.phase }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-role-${{ matrix.phase }}-${{ github.run_id }}
          path: audit-output/
          retention-days: 30

  flow-acceptance:
    if: github.ref == 'refs/heads/autonomous/exchange-flow-acceptance-20260930'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify corrected endpoint with one request and no history writes
        env:
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
        run: node audit-fixes/specialist-access-20260930/check-exchange-flows.mjs

  volume-acceptance:
    if: github.ref == 'refs/heads/autonomous/volume-profile-20260930'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check ready public history without accumulating or writing production data
        run: node audit-fixes/volume-profile-20260930/live-acceptance.mjs

  real-manual-binding-acceptance:
    if: github.ref == 'refs/heads/repair/manual-request-result-binding-v2-20261001'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: my-report-2-production-cycle
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT2_RUNNER_ENABLED: ${{ secrets.REPORT2_RUNNER_ENABLED }}
      ANALYTICS_ENABLED: '1'
      PUBLIC_COLLECTOR_ENABLED: '0'
      DELIVERY_ENABLED: '0'
      CALIBRATION_APPLY_ENABLED: '0'
      REPORT2_MANUAL_RUN_AUTHORIZED: '1'
      REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
      REPORT2_EXPECTED_WORKER_SHA: '5e38f08bbeb50f7ec49f03c3633f2a2f1597813c5a11321718ec28f3a689c173'
      REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
      REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
      REPORT2_SOURCE_PROXY_URL: ${{ secrets.REPORT2_SOURCE_PROXY_URL }}
      REPORT2_SOURCE_PROXY_TOKEN: ${{ secrets.REPORT2_SOURCE_PROXY_TOKEN }}
      BYKARANTELI_API_KEY: CLOUDFLARE_PROXY_CONFIGURED
      OXARCHIVE_API_KEY: ${{ secrets.OXARCHIVE_API_KEY }}
      LIQFLOW_API_KEY: ${{ secrets.LIQFLOW_API_KEY }}
      COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
      NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
      VYX_API_KEY: ${{ secrets.VYX_API_KEY }}
      BLOCKSCOUT_PRO_API_KEY: ${{ secrets.BLOCKSCOUT_PRO_API_KEY }}
      REPORT2_SUPPLEMENTAL_IDENTITY_REGISTRY_JSON: ${{ secrets.REPORT2_SUPPLEMENTAL_IDENTITY_REGISTRY_JSON }}
      REPORT2_RUN_SOURCE: manual
      REPORT2_MANUAL_COMMAND: 'Создать отчёт'
      REPORT2_MANUAL_COIN_CONTRACT: ''
      REPORT2_CURRENT_GENERATION: MY_REPORT_2_CURRENT_20260929_CURRENT_CYCLE_V13_20M
      REPORT2_POST_V7_UNIFIED_ENABLED: '1'
      REPORT2_LIQUIDATION_EXTENSION_MODE: SHADOW_ONLY
      REPORT2_ANALYTICS_ACTOR: GITHUB_ACTIONS
      REPORT2_D1_RUNS_PER_DAY: '80'
      REPORT2_D1_MAX_DAILY_READS: '3500000'
      REPORT2_D1_MAX_DAILY_WRITES: '70000'
      REPORT2_TELEGRAM_OUTPUT_ENABLED: '0'
      REPORT2_TELEGRAM_SHADOW_DECISION_AUTO: '0'
      REPORT2_TELEGRAM_WATCH70_ENABLED: '0'
      REPORT2_TELEGRAM_INFO_ENABLED: '0'
      REPORT2_TELEGRAM_INFO_OBSERVE_ENABLED: '0'
      REPORT2_TELEGRAM_INSTALL_VALIDATION: '0'
      REPORT2_TELEGRAM_REPORT_TEST: '0'
      REPORT2_V3_TELEGRAM_JOURNAL_ENABLED: '1'
      REPORT2_V3_TELEGRAM_NETWORK_ENABLED: '0'
      REPORT2_R8_20_PROSPECTIVE_VALIDATION_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm working baseline before any live request
        run: |
          set -Eeuo pipefail
          current=$(gh api repos/${{ github.repository }}/branches/main --jq .commit.sha)
          expected=$(node -p "JSON.parse(require('fs').readFileSync('audit-fixes/source-optimization-20260930/execution-lock.json')).expected_main")
          test "$current" = "$expected"
      - name: Assemble the same offline validated candidate
        run: |
          set -Eeuo pipefail
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/manual-live-assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/manual-live-runtime-binding.json
      - name: Create new real manual report with isolated command and zero Telegram network
        working-directory: runtime
        run: node --import ../audit-fixes/manual-request-binding-20261001/real-report-isolation.mjs runner-main.mjs > ../audit-output/manual-live-report.log 2>&1
      - name: Confirm working baseline did not change during acceptance
        run: |
          set -Eeuo pipefail
          current=$(gh api repos/${{ github.repository }}/branches/main --jq .commit.sha)
          expected=$(node -p "JSON.parse(require('fs').readFileSync('audit-fixes/source-optimization-20260930/execution-lock.json')).expected_main")
          test "$current" = "$expected"
      - name: Explain a real report failure
        if: failure()
        run: tail -40 audit-output/manual-live-report.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-manual-result-binding-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
