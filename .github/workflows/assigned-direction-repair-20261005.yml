name: Report2 Assigned Direction State Repair Validation
on:
  push:
    branches: [codex/assigned-direction-repair-20261005]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fresh owner before tests and readback
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='85d198441ac06bb7fcbcba84f51e210e155c8d38')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261005T203355595Z:combined-runtime'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Assemble exact runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Validate general direction repair and unchanged approved observation paths
        run: |
          node current-generation/validate.mjs > audit-output/validation.json
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
          node current-generation/tests/early-observation-state.runtime.mjs runtime > audit-output/early-observation.json
          node current-generation/tests/volume-profile.runtime.mjs runtime > audit-output/volume-profile.json
          node --test current-generation/tests/early-direction-state-20261005.test.mjs > audit-output/direction-receipt.tap
      - name: Read exact original shadow direction and lifecycle lineage
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node audit-fixes/exact-direction-lineage-read-20261005.mjs > audit-output/read-console.json
      - name: Exact package hashes
        if: always()
        run: |
          git rev-parse HEAD > audit-output/head.txt
          git rev-parse HEAD^{tree} > audit-output/tree.txt
          sha256sum runtime/src/worker.js runtime/src/canonical-runtime-adapter.mjs runtime/src/early-direction-receipt.mjs > audit-output/runtime-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assigned-direction-repair-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
