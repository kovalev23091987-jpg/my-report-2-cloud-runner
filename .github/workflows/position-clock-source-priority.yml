name: Report2 Position Clock Source Priority
on:
  push:
    branches: [codex/position-clock-source-priority-20261006]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fresh owner before tests and replay
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='715ed2aed1352e04f12b8cfce0ba0afd397d3ad2')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:2026-10-06T11:49:37.490Z:batched-delivery-replay'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Verify retained actual gTrade source archive
        run: |
          mkdir -p priority-source
          echo 'e063dcaa070b4e476d3d2da0d74d6ec01f13d64b425aa61042e889956a637d8a  checkpoints/source-inputs/gtrade-one-batch-live-37435081885.zip' | sha256sum -c -
          unzip -q checkpoints/source-inputs/gtrade-one-batch-live-37435081885.zip -d priority-source
      - name: Assemble exact runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Verify composed actual position source and bounded fallback matrix
        run: |
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/position-clock-source-order.runtime.mjs > audit-output/source-priority-runtime.tap
          node --test current-generation/tests/position-clock-source-order.test.mjs > audit-output/source-priority-unit.tap
      - name: Integrated release regression
        run: node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
      - name: Current generation validation
        if: always()
        run: node current-generation/validate.mjs > audit-output/validation.json 2> audit-output/validation-errors.txt
      - name: Exact package hashes
        if: always()
        run: |
          git rev-parse HEAD > audit-output/head.txt
          git rev-parse HEAD^{tree} > audit-output/tree.txt
          sha256sum runtime/src/liquidation-source-weighting.mjs runtime/src/liquidation-extension/combined-runner-service.mjs runtime/src/telegram-delivery-receipt.mjs runtime/src/v3-telegram-delivery-sidecar.mjs runtime/src/v3-telegram-runtime.mjs runtime/src/worker.js runtime/src/canonical-runtime-adapter.mjs runtime/src/observation-technical-range.mjs runtime/src/manual-report-formatter.mjs runtime/src/telegram-compact-formatter.mjs > audit-output/runtime-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: position-clock-source-priority-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
