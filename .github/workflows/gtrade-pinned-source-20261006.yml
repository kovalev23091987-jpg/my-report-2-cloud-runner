name: Report2 GTrade Pinned Source Evaluation
on:
  push:
    branches: [codex/gtrade-pinned-source-20261006]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fresh owner before tests and replay
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='994afff632c244b72b43173613dde886f16d1c14')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261006T065915411Z:general-flow-gmx-clock'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Reuse exact already received source responses
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
            const r=await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:11397437411,archive_format:'zip'});
            const b=Buffer.from(r.data),sha=crypto.createHash('sha256').update(b).digest('hex');
            if(sha!=='1f6b256ec5217c17082755c3e363f190424e3704de176cd0fd2a712923e4f89f')throw Error('EXACT_SOURCE_ZIP_DIGEST_MISMATCH');
            fs.writeFileSync('original-source.zip',b);fs.mkdirSync('original-source',{recursive:true});
            cp.execFileSync('unzip',['-q','original-source.zip','-d','original-source']);
            const p=JSON.parse(fs.readFileSync('original-source/gtrade-pinned-source-proof.json'));
            if(p.head!=='c83dca78d657830cc92ec1448809e467ba54b639'||p.sourceHTTP!==5||p.error!=='RPC_HTTP_429')throw Error('ORIGINAL_SOURCE_BINDING_MISMATCH');
      - name: Assemble exact runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Bounded existing source read under durable admission
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_EXPECTED_MAIN: '994afff632c244b72b43173613dde886f16d1c14'
        run: |
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          node tools/gtrade-pinned-source-check.mjs
          git rev-parse HEAD > audit-output/head.txt
          git rev-parse HEAD^{tree} > audit-output/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtrade-pinned-source-${{ github.run_id }}
          path: audit-output/
          retention-days: 30

