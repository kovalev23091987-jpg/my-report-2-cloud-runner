name: HTX weekly exact universe and source proposal
on:
  schedule:
    # The source-week reservation still permits only one six-catalog attempt.
    # A daily retry handles a busy owner or source headroom at Monday's window.
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pull-requests: write
concurrency:
  group: report2-htx-weekly-universe
  cancel-in-progress: false
jobs:
  qualify_four_mirror:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/github-four-mirror-qualification-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check isolated branch, exact bytes, stale CAS and unknown reply controls
        run: node --test tools/qualify-four-mirror-github-20261018.test.mjs
      - name: Qualify one isolated GitHub branch without production writes
        run: node tools/qualify-four-mirror-github-20261018.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-four-mirror-qualification-${{ github.run_id }}
          path: audit-output/github-four-mirror-qualification/
          if-no-files-found: error
          retention-days: 30
  reconcile:
    if: github.ref != 'refs/heads/work/github-four-mirror-qualification-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPORT2_WEEKLY_QUALIFIED_PROPOSALS_ENABLED: ${{ vars.REPORT2_WEEKLY_QUALIFIED_PROPOSALS_ENABLED || 'false' }}
      REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
      REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check synchronized plan, source caps, byte-preserving ownership and retained history
        run: node --test runner/htx-weekly-universe-plan.test.mjs runner/github-bounded-phase-lease.test.mjs runner/htx-weekly-proposal-check.test.mjs runner/htx-weekly-finalize.test.mjs cloudflare/free-history/history-read.test.mjs cloudflare/free-history/hourly-archive.test.mjs cloudflare/free-history/spot-archive.test.mjs
      - name: Qualify original six catalogs once per week under existing shared budgets
        run: node tools/weekly-htx-universe-refresh.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: htx-weekly-source-proposal-${{ github.run_id }}
          path: audit-output/htx-weekly/
          if-no-files-found: error
          retention-days: 30
