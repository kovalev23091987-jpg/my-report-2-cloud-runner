name: Report2 Actual Continuous Cadence Exact Read
on:
  push:
    branches: [codex/current-continuous-cadence-read-20261008]
    paths: ['tools/read-current-continuous-cadence-20261008.mjs', '.github/workflows/current-continuous-cadence-read-20261008.yml']
permissions:
  contents: write
  actions: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check bounded owner before actual read
        uses: actions/github-script@v7
        with:
          script: |
            const h=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;if(h!=='ea4c2a2af76d2cf391cfe1732a9db4dfd8502db6')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');
      - name: Read exact original receipt and current collector counters within reserved bounds
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/read-current-continuous-cadence-20261008.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-continuous-cadence-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Retain immutable exact actual read
        uses: actions/github-script@v7
        with:
          script: |
            const h=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;if(h!=='ea4c2a2af76d2cf391cfe1732a9db4dfd8502db6')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');
            const fs=require('fs'),owner=context.repo.owner,repo=context.repo.repo,out=JSON.parse(fs.readFileSync('audit-output/current-cadence-read.json'));if(out.status!=='EXACT_CADENCE_AND_ORIGINAL_FIL_READ_CLOSED'||out.d1_usage.unknown_ops||out.d1_usage.rows_read>1000||out.d1_usage.rows_written>16)throw Error('READ_NOT_CLOSED');
            const w=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:37841797051})).data;if(w.head_sha!=='f9d6257febd31b1cbabf63668016006d439f273f')throw Error('CLOUD_WORKER_IDENTITY');out.actual_worker={cloud_run:w.id,head:w.head_sha,status:w.status,conclusion:w.conclusion,created_at:w.created_at,updated_at:w.updated_at};out.reader_head=context.sha;
            const b=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(out,null,2)+'\n').toString('base64'),encoding:'base64'})).data,ref=context.ref.replace('refs/heads/',''),parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');const c=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,t=(await github.rest.git.createTree({owner,repo,base_tree:c.tree.sha,tree:[{path:'checkpoints/CONTINUOUS_COLLECTOR_CURRENT_CADENCE_AND_FIL_SENT_20261008.json',mode:'100644',type:'blob',sha:b.sha}]})).data,n=(await github.rest.git.createCommit({owner,repo,message:'Retain bounded current collector cadence and exact original FIL receipt',tree:t.sha,parents:[parent]})).data;await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:n.sha,force:false});console.log('ACTUAL_CURRENT_PROOF',JSON.stringify({head:n.sha,status:out.status,worker:out.actual_worker,poll:out.poll,d1_usage:out.d1_usage}));
