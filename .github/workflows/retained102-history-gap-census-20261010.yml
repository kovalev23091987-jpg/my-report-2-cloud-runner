name: Retained 102 HTX history evidence gap census
on:
  push:
    branches: [codex/retained102-history-gap-census-20261010]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require active owner lease, no fence and exact review head
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json');
            const fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='chatgpt-large-history-denominator-20261010'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_LEASE_BLOCKED');
            const review=(await github.rest.git.getRef({owner,repo,ref:'heads/codex/retained102-history-gap-census-20261010'})).data.object.sha;
            if(review!==context.sha)throw Error('REVIEW_HEAD_MOVED');
      - name: Exact original retained proofs to factual coverage census
        run: |
          node --check runner/retained102-history-gap-census.mjs
          node --test tests/retained102-history-gap-census.test.mjs
          node tools/audit-retained102-history-gap-census.mjs
          git rev-parse HEAD > audit-output/tested-head.txt
          sha256sum runner/retained102-history-gap-census.mjs tools/audit-retained102-history-gap-census.mjs > audit-output/code-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained102-factual-gap-census-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
