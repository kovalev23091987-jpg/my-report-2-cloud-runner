name: N12 spot futures and cross venue report proof offline
on:
  pull_request:
    paths:
      - .github/workflows/n12-cross-venue-report-20261011.yml
      - current-generation/files/src/n12-market-trades.mjs
      - current-generation/files/src/htx-large-trades-evidence.mjs
      - current-generation/files/src/block-result-context.mjs
      - current-generation/files/src/gate-futures-trade-sample.mjs
      - current-generation/files/src/gate-futures-trade-collector.mjs
      - current-generation/files/src/bitget-n12-bounded-trade-sample.mjs
      - current-generation/files/src/bitget-flow-collector.mjs
      - current-generation/files/src/n12-native-public-trade-sample.mjs
      - current-generation/files/src/n12-native-public-trade-collector.mjs
      - current-generation/files/src/external-n05-flow-collector.mjs
      - current-generation/files/src/candidate-evidence-v2-runtime.mjs
      - current-generation/files/src/bounded-money-flow-diagnostic.mjs
      - current-generation/files/src/telegram-plain-facts.mjs
      - current-generation/files/src/canonical-publication.mjs
      - current-generation/files/src/telegram-compact-formatter.mjs
      - current-generation/files/src/manual-report-formatter.mjs
      - current-generation/files/src/canonical-runtime-adapter.mjs
      - current-generation/files/src/worker.js
      - current-generation/tests/n12-market-trades.test.mjs
      - current-generation/tests/n12-gate-futures-trades.test.mjs
      - current-generation/tests/n12-bitget-bounded-reuse.test.mjs
      - current-generation/tests/bitget-flow-collector.test.mjs
      - current-generation/tests/n12-native-public-trades.test.mjs
      - current-generation/tests/shared-spot-futures-market-context.test.mjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require unchanged main and owned bounded N12 lease
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(main!==context.payload.pull_request.base.sha)throw Error('MAIN_MOVED');
            const read=async(path,ref)=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json',main);
            const branch=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json',context.payload.pull_request.head.sha);
            const fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json',main);
            if(!/^CODEX:OWNER_/.test(phase.lease?.owner||'')||branch.lease?.owner!==phase.lease.owner||branch.lease?.acquired_ts!==phase.lease.acquired_ts||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Assemble current encrypted runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output/n12-cross-venue
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/n12-cross-venue/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Verify same-run trade reuse, source reconciliation and both report chains
        env:
          REPORT2_TEST_RUNTIME: runtime
          REPORT2_UNIFIED_MODULE_ROOT: runtime/src
          NODE_OPTIONS: --import ${{ github.workspace }}/current-generation/tests/early-evidence-repair/no-network.mjs
        run: |
          cmp current-generation/files/src/worker.js runtime/src/worker.js
          cmp current-generation/files/src/n12-market-trades.mjs runtime/src/n12-market-trades.mjs
          cmp current-generation/files/src/htx-large-trades-evidence.mjs runtime/src/htx-large-trades-evidence.mjs
          cmp current-generation/files/src/block-result-context.mjs runtime/src/block-result-context.mjs
          cmp current-generation/files/src/gate-futures-trade-sample.mjs runtime/src/gate-futures-trade-sample.mjs
          cmp current-generation/files/src/gate-futures-trade-collector.mjs runtime/src/gate-futures-trade-collector.mjs
          cmp current-generation/files/src/bitget-n12-bounded-trade-sample.mjs runtime/src/bitget-n12-bounded-trade-sample.mjs
          cmp current-generation/files/src/bitget-flow-collector.mjs runtime/src/bitget-flow-collector.mjs
          cmp current-generation/files/src/n12-native-public-trade-sample.mjs runtime/src/n12-native-public-trade-sample.mjs
          cmp current-generation/files/src/n12-native-public-trade-collector.mjs runtime/src/n12-native-public-trade-collector.mjs
          cmp current-generation/files/src/external-n05-flow-collector.mjs runtime/src/external-n05-flow-collector.mjs
          cmp current-generation/files/src/candidate-evidence-v2-runtime.mjs runtime/src/candidate-evidence-v2-runtime.mjs
          cmp current-generation/files/src/bounded-money-flow-diagnostic.mjs runtime/src/bounded-money-flow-diagnostic.mjs
          cmp current-generation/files/src/telegram-plain-facts.mjs runtime/src/telegram-plain-facts.mjs
          cmp current-generation/files/src/canonical-publication.mjs runtime/src/canonical-publication.mjs
          cmp current-generation/files/src/telegram-compact-formatter.mjs runtime/src/telegram-compact-formatter.mjs
          cmp current-generation/files/src/manual-report-formatter.mjs runtime/src/manual-report-formatter.mjs
          cmp current-generation/files/src/canonical-runtime-adapter.mjs runtime/src/canonical-runtime-adapter.mjs
          node --test current-generation/tests/n12-market-trades.test.mjs current-generation/tests/n12-gate-futures-trades.test.mjs current-generation/tests/n12-bitget-bounded-reuse.test.mjs current-generation/tests/n12-native-public-trades.test.mjs current-generation/tests/bitget-flow-collector.test.mjs current-generation/tests/htx-large-trades-evidence.test.mjs current-generation/tests/block-result-context.test.mjs current-generation/tests/joint-spot-futures-flow.test.mjs current-generation/tests/shared-spot-futures-market-context.test.mjs > audit-output/n12-cross-venue/target-unit.tap
          node --test current-generation/tests/paused-block-report-chains.test.mjs > audit-output/n12-cross-venue/paused-chains.tap
          node current-generation/validate.mjs > audit-output/n12-cross-venue/generation.log 2>&1
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/n12-cross-venue/binding.json
      - name: Show failure locations
        if: failure()
        run: |
          for file in audit-output/n12-cross-venue/*.tap audit-output/n12-cross-venue/generation.log; do
            if test -f "$file"; then echo "FAILED_LOG: $file"; tail -90 "$file"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n12-cross-venue-${{ github.run_id }}
          path: audit-output/n12-cross-venue/
          retention-days: 30
