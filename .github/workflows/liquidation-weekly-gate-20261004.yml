name: Report 2 Liquidation Weekly Gate
on:
  push:
    branches: [autonomous/liquidation-weekly-gate-20261004]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble accepted runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Validate staged weekly refresh and runtime
        run: |
          node --test current-generation/tests/liquidation-futures-coverage.test.mjs current-generation/tests/liquidation-futures-coverage-policy.test.mjs current-generation/tests/liquidation-only-command-wiring.test.mjs current-generation/tests/combined-oxarchive-routing.test.mjs > audit-output/weekly-targeted.tap
          node --import ./current-generation/tests/early-evidence-repair/no-network.mjs audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration-37.json
      - name: Verify current durable weekly gate without source calls
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_SOURCE_PROXY_URL: ${{ secrets.REPORT2_SOURCE_PROXY_URL }}
          REPORT2_SOURCE_PROXY_TOKEN: ${{ secrets.REPORT2_SOURCE_PROXY_TOKEN }}
          LIQFLOW_API_KEY: ${{ secrets.LIQFLOW_API_KEY }}
          OXARCHIVE_API_KEY: ${{ secrets.OXARCHIVE_API_KEY }}
          REPORT2_COVERAGE_MAINTENANCE_HTTP_CAP: '120'
        run: |
          node runner/liquidation-coverage-weekly.mjs runtime | tee audit-output/weekly-console.json
          mv liquidation-coverage-weekly-result.json audit-output/
          node -e "const r=require('./audit-output/liquidation-coverage-weekly-result.json');if(r.status!=='NOT_DUE'||r.source_http!==0||r.technical_telegram!==false)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquidation-weekly-gate-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
