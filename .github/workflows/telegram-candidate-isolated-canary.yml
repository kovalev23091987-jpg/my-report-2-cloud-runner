name: Telegram candidate isolated canary

on:
  push:
    branches:
      - "telegram-canary/v2-tz101-8a655153-20260921"

permissions:
  contents: read

concurrency:
  group: telegram-candidate-isolated-canary-once
  cancel-in-progress: false

jobs:
  isolated-canary:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_BASE_CANDIDATE_SHA: "8a6551535be74dc12935aff7cf0ac053bc85bfc0"
      EXPECTED_MAIN_SHA: "3cb2d9bdcb344e6034cd419824f31fd4f6ac1fd3"
      EXPECTED_PRODUCTION_WORKFLOW_SHA256: "ccd5a369bfd5dcd7705cc6bf1cb460b96896b85d07f1840c2240ef1b7dff4c94"
      EXPECTED_PAYLOAD_SHA256: "30f9d3b589b0caa8d409707e7e38f0a04c5080130fdd27ea7fa25826e234cf88"
      EXPECTED_RUNNER_SHA256: "596f4cd9f6f23d314f5853c110212fcead1874d0cd6a7b9f87f415ae1e401242"
      EXPECTED_RELAY_ROUTE_SHA256: "7c5b9f8ae8fa7c8715881010328da4307d5b965faefdc6233ddd563f6f495062"
      EXPECTED_RELAY_SENDER_SHA256: "96cbaadbd12dcace2070d6cbd7a772ebfed878c2c6f56be14bb2cdb8714a2cb7"
      EXPECTED_RECIPIENT_FINGERPRINT: "a27679395cbf4d857c57574535ed0155c95262a5bc2b0211201b38ff17658a0c"
      EXPECTED_RELAY_DEPLOYMENT_ID: "226545aa-1c35-4b53-8d64-764f8b3e38ba"
      EXPECTED_RELAY_VERSION_ID: "5f11b8af-ec0f-4959-b41d-6a6a23273a45"
      RELAY_URL: "https://my-report-2-hub.kovalev23091987.workers.dev/telegram-test"
      CANARY_ID: "REPORT2-V2-TZ101-8A655153-20260921"

    steps:
      - name: Checkout isolated candidate control commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove exact branch and protected state
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/telegram-canary/v2-tz101-8a655153-20260921"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_CANDIDATE_SHA"
          git fetch --no-tags origin main --depth=1
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git diff --name-only "$EXPECTED_BASE_CANDIDATE_SHA"..HEAD)" = ".github/workflows/telegram-candidate-isolated-canary.yml"
          git diff --quiet "$EXPECTED_BASE_CANDIDATE_SHA"..HEAD -- \
            .github/workflows/report2.yml \
            payload/report2-runtime.enc \
            runner/runner-main.mjs \
            runner/telegram-info-runtime.mjs \
            runner/telegram-output.mjs \
            runner/telegram-zero-reason.mjs \
            tz101-shadow-overlay/migrations
          test "$(sha256sum .github/workflows/report2.yml | awk '{print $1}')" = "$EXPECTED_PRODUCTION_WORKFLOW_SHA256"
          test "$(sha256sum payload/report2-runtime.enc | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          test "$(sha256sum runner/runner-main.mjs | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA256"
          if compgen -e | grep -Eq '^REPORT2_D1(_|$)'; then
            echo "D1_ENVIRONMENT_MUST_BE_ABSENT"
            exit 1
          fi
          echo "ISOLATION_GUARD=PASS"
          echo "MAIN_UNCHANGED=PASS"
          echo "D1_ENVIRONMENT=ABSENT"

      - name: Prove relay rejects unauthenticated request without sending
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          const response = await fetch(process.env.RELAY_URL, {
            method: 'POST',
            headers: {'content-type': 'application/json; charset=UTF-8'},
            body: JSON.stringify({text: 'AUTH_GUARD_PROBE_NO_SEND'}),
          });
          let body = null;
          try { body = await response.json(); } catch { body = null; }
          if (response.status !== 401 || body?.ok !== false || body?.endpoint !== 'telegram-test' || body?.error !== 'UNAUTHORIZED') {
            throw new Error(`RELAY_AUTH_GUARD_NOT_PROVEN:${response.status}`);
          }
          console.log('RELAY_AUTH_GUARD=PASS_NO_SEND');
          NODE

      - name: Send exactly one system-test canary
        env:
          REPORT2_TELEGRAM_RELAY_KEY: ${{ secrets.REPORT2_TELEGRAM_RELAY_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$REPORT2_TELEGRAM_RELAY_KEY"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const message = [
            '🧪 CANARY «МОЙ ОТЧЁТ 2»',
            'Техническая проверка Telegram V2 / TZ 10.1.',
            'Только тестовый получатель. НЕ торговый сигнал.',
            'Рыночной идеи нет. market_signal=false.',
            `Canary ID: ${process.env.CANARY_ID}`,
          ].join('\n');

          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 8_000);
          let response;
          try {
            response = await fetch(process.env.RELAY_URL, {
              method: 'POST',
              headers: {
                'content-type': 'application/json; charset=UTF-8',
                authorization: `Bearer ${process.env.REPORT2_TELEGRAM_RELAY_KEY}`,
              },
              body: JSON.stringify({text: message}),
              signal: controller.signal,
            });
          } catch (error) {
            throw new Error(error?.name === 'AbortError' ? 'CANARY_RESULT_AMBIGUOUS_TIMEOUT_NO_RETRY' : 'CANARY_NETWORK_ERROR_NO_RETRY');
          } finally {
            clearTimeout(timer);
          }

          let body = null;
          try { body = await response.json(); } catch { body = null; }
          const messageId = body?.message_id;
          if (response.status !== 200 || body?.ok !== true || body?.status !== 'SENT' || !Number.isInteger(messageId) || messageId < 1) {
            throw new Error(`CANARY_NOT_CONFIRMED_NO_RETRY:${response.status}:${String(body?.status || body?.error || 'INVALID_JSON')}`);
          }

          const proof = {
            schema: 'report2-v2-tz101-isolated-canary-v1',
            status: 'PASS',
            network_result: 'CONFIRMED_SENT',
            relay_status: 'SENT',
            message_id: messageId,
            sent_at_utc: new Date().toISOString(),
            canary_id: process.env.CANARY_ID,
            candidate_base_sha: process.env.EXPECTED_BASE_CANDIDATE_SHA,
            canary_control_sha: process.env.GITHUB_SHA,
            main_sha: process.env.EXPECTED_MAIN_SHA,
            route: '/telegram-test',
            relay_route_sha256: process.env.EXPECTED_RELAY_ROUTE_SHA256,
            relay_sender_sha256: process.env.EXPECTED_RELAY_SENDER_SHA256,
            relay_deployment_id: process.env.EXPECTED_RELAY_DEPLOYMENT_ID,
            relay_version_id: process.env.EXPECTED_RELAY_VERSION_ID,
            recipient_fingerprint: `sha256:${process.env.EXPECTED_RECIPIENT_FINGERPRINT}`,
            recipient_count: 1,
            sender_fanout: false,
            test_only: true,
            text_class: 'SYSTEM_TEST_NOT_MARKET_SIGNAL',
            market_signal: false,
            live_probability: null,
            validated_signal: false,
            trading_execution: false,
            production_workflow_invoked: false,
            d1_environment_present: false,
            d1_requests: 0,
            d1_writes: 0,
            retry_performed: false,
          };
          fs.writeFileSync('telegram-isolated-canary-proof.json', `${JSON.stringify(proof, null, 2)}\n`);
          console.log('ISOLATED_TELEGRAM_CANARY=CONFIRMED_SENT');
          console.log(`CANARY_MESSAGE_ID=${messageId}`);
          NODE

      - name: Reconfirm protected refs after delivery
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main --depth=1
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_CANDIDATE_SHA"
          echo "POST_SEND_MAIN_UNCHANGED=PASS"
          echo "PRODUCTION_WORKFLOW_INVOKED=NO"
          echo "D1_REQUESTS=0"
          echo "D1_WRITES=0"

      - name: Upload isolated canary proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: telegram-v2-tz101-isolated-canary-proof
          path: telegram-isolated-canary-proof.json
          if-no-files-found: warn
          retention-days: 30
