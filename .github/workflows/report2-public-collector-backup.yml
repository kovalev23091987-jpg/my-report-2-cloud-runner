name: Report 2 Public Collector Backup

on:
  schedule:
    - cron: "1-56/5 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "internal bounded backup worker renewal"
        required: false
        default: "manual"
  push:
    branches:
      - main
    paths:
      - "cloudflare/public-collector/backup-request.json"
      - "cloudflare/public-collector/*.mjs"
      - "cloudflare/public-collector/injected-worker-tail.js"
      - "runner/report2-d1-adapter.mjs"
      - "runner/retained-history.mjs"
      - "runner/private-archive-d1-api.mjs"
      - "runner/private-archive-pool.mjs"
      - "runner/canonical-cold-archive.mjs"
      - "runner/private-canonical-prefetch.mjs"
      - "runner/d1-preaction-budget-guard.mjs"
      - "runner/native-day-reconciliation-tokens.mjs"
      - "runner/verified-native-day-reconciliation.mjs"
      - "checkpoints/LATEST_VERIFIED_D1_AGGREGATE_RECONCILIATION.json"
      - "cloudflare/free-history/native-measured-d1.mjs"
      - "current-generation/files/**"
      - ".github/workflows/report2.yml"
      - ".github/workflows/report2-public-collector-backup.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: report2-public-collector-backup
  cancel-in-progress: false

jobs:
  reclaim-unclosed-current-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 315
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPORT2_BACKUP_WORKER_MINUTES: "300"
      REPORT2_TRIGGER_KICK_ENABLED: ${{ secrets.REPORT2_RUNNER_ENABLED }}
      REPORT2_SCHEDULED_RECOVERY_ENABLED: ${{ secrets.REPORT2_RUNNER_ENABLED }}
      REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
      REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
      REPORT2_CANONICAL_ARCHIVE_D1_API_TOKEN: ${{ secrets.REPORT2_CANONICAL_ARCHIVE_D1_API_TOKEN || secrets.REPORT2_ISOLATED_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require a public repository with standard runner before continuous work
        uses: actions/github-script@v7
        with:
          script: |
            const r=(await github.rest.repos.get({owner:context.repo.owner,repo:context.repo.repo})).data;
            if(r.private!==false)throw Error('CONTINUOUS_STANDARD_PUBLIC_RUNNER_REQUIRED');
      - name: Verify one current bounded slot before persistent work
        env:
          REPORT2_BACKUP_WORKER_MINUTES: "0"
        run: node cloudflare/public-collector/github-backup.mjs
      - name: Retain first exact current slot without waiting for worker shutdown
        uses: actions/upload-artifact@v4
        with:
          name: report2-collector-backup-bootstrap-${{ github.run_id }}
          path: report2-collector-backup-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Keep current-code guarded five-minute backup and exact trigger checks running
        run: node cloudflare/public-collector/github-backup.mjs
      - name: Save bounded backup receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report2-collector-backup-${{ github.run_id }}
          path: report2-collector-backup-proof.json
          if-no-files-found: warn
          retention-days: 7

