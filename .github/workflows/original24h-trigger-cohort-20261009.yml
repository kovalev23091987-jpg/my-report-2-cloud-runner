name: Original24h all approved canonical decisions and trigger prices
on:
  push:
    branches: [codex/original24h-general-trigger-cohort-20261009]
    paths: ['.github/workflows/original24h-trigger-cohort-20261009.yml', 'tools/original-trigger-cohort-audit*', 'tools/read-original24h-trigger-cohort-20261009.mjs']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact main and own original-window owner
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='c488ea18e9aba24b5f0ae83f4524299922bd58a5')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
      - name: Verify strict original sampled-window audit
        run: |
          mkdir -p audit-output
          node --test tools/original-trigger-cohort-audit.test.mjs > audit-output/controlled-tests.tap
          node --check tools/read-original24h-trigger-cohort-20261009.mjs
      - name: Read bounded original canonical cohort without source or task writes
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/read-original24h-trigger-cohort-20261009.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original24h-trigger-cohort-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Retain original states and measured bounded audit
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='c488ea18e9aba24b5f0ae83f4524299922bd58a5')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
            const fs=require('fs'),owner=context.repo.owner,repo=context.repo.repo,proof=JSON.parse(fs.readFileSync('audit-output/original24h-trigger-cohort.json'));
            if(proof.status!=='BOUNDED_ALL_APPROVED_ORIGINAL24H_DECISION_TRIGGER_AUDIT_CLOSED'||proof.sourceHTTP!==0||proof.task_writes!==0||proof.source_clocks_refreshed)throw Error('AUDIT_NOT_CLOSED');
            const tests=fs.readFileSync('audit-output/controlled-tests.tap','utf8');if(!/(?:#|ℹ) pass 8/.test(tests)||!/(?:#|ℹ) fail 0/.test(tests))throw Error('TEST_NOT_PASS');
            const entries=[];
            for(const file of fs.readdirSync('audit-output')){const b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('audit-output/'+file).toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/original24h-trigger-cohort-'+context.runId+'/'+file,mode:'100644',type:'blob',sha:b.sha});}
            const b=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(proof,null,2)+'\n').toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/ORIGINAL24H_ALL_APPROVED_TRIGGER_COHORT_20261009.json',mode:'100644',type:'blob',sha:b.sha});
            const parent=(await github.rest.git.getCommit({owner,repo,commit_sha:context.sha})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:parent.tree.sha,tree:entries})).data,commit=(await github.rest.git.createCommit({owner,repo,message:'Retain actual complete original24h canonical trigger diagnosis',tree:tree.sha,parents:[context.sha]})).data;
            await github.rest.git.updateRef({owner,repo,ref:context.ref.replace('refs/',''),sha:commit.sha,force:false});
