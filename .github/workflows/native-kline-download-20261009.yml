name: Native retained exact one-minute kline download qualification
on:
  push:
    branches: [codex/history-completion-20261009]
    paths: ['tools/download-retained-native-kline-20261009.mjs','.github/workflows/native-kline-download-20261009.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact current main and own live lease
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='525f8ab1242eb259dacfae6c1835ef905d96da37')throw Error('MAIN_MOVED');const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='CODEX:FULL_TZ:20261009:1791542831880'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
      - name: Assemble exact already verified runtime for existing source and D1 admission
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          node --check tools/download-retained-native-kline-20261009.mjs
      - name: Restore original one-attempt transport failure and unchanged four-attempt reservation
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo;const b=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:11614801469,archive_format:'zip'})).data);if(crypto.createHash('sha256').update(b).digest('hex')!=='f3c336fd6f1fe1aaa26b8c955cdd83c8ac7732046e9b93424fde9285f48273d2')throw Error('EXACT_ORIGINAL_PROBE_DIGEST');fs.writeFileSync('retained-native-kline.zip',b);fs.mkdirSync('retained-native-kline');cp.execFileSync('unzip',['-q','retained-native-kline.zip','-d','retained-native-kline']);
      - name: Preserve one bounded official kline archive and checksum
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: |
          node tools/download-retained-native-kline-20261009.mjs > audit-output/native-kline-console.json
          if [ -f audit-output/native-kline-archive/native-kline.zip ]; then unzip -l audit-output/native-kline-archive/native-kline.zip > audit-output/native-kline-files.txt; unzip -p audit-output/native-kline-archive/native-kline.zip | head -c 1500 > audit-output/native-kline-header.txt || true; fi
          git rev-parse HEAD > audit-output/head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-kline-download-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
