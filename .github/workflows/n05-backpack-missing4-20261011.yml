name: N05 four missing Backpack spot windows
on:
  push:
    branches: [n05-backpack-missing4-20261011]
    paths: ['tools/acquire-n05-backpack-missing4-20261011.mjs', '.github/workflows/n05-backpack-missing4-20261011.yml']
permissions:
  contents: write
  actions: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check bounded acquisition code
        run: |
          node --check tools/acquire-n05-backpack-missing4-20261011.mjs
          node tools/acquire-n05-backpack-missing4-20261011.mjs --plan
      - name: Acquire only when fresh main, owner, D1 and source caps permit all ten calls
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT2_EXPECTED_MAIN: 9c727ab4aba8bad0bb2531ce05dee565d1b2b8ef
          REPORT2_EXPECTED_LEASE_OWNER: CODEX:LOCAL_N05:20261011:1791715474614
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/acquire-n05-backpack-missing4-20261011.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n05-backpack-missing4-${{ github.run_id }}
          path: audit-output/n05-backpack-missing4/
          retention-days: 30
      - name: Retain exact outcomes on review branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),owner=context.repo.owner,repo=context.repo.repo,ref=context.ref.replace('refs/','');
            const dir='audit-output/n05-backpack-missing4';if(!fs.existsSync(dir))return;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(main!=='9c727ab4aba8bad0bb2531ce05dee565d1b2b8ef')throw Error('MAIN_MOVED');
            const phase=JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:'checkpoints/CLOUD_PHASE_STATE_20261004.json',ref:main})).data.content,'base64').toString());
            if(phase.lease?.owner!=='CODEX:LOCAL_N05:20261011:1791715474614'||phase.lease.expires_ts<=Date.now())throw Error('OWNER_BLOCKED');
            const current=(await github.rest.git.getRef({owner,repo,ref})).data.object.sha;if(current!==context.sha)throw Error('SUPERSEDED_HEAD');
            const base=(await github.rest.git.getCommit({owner,repo,commit_sha:current})).data.tree.sha,tree=[];
            for(const name of fs.readdirSync(dir)){const b=fs.readFileSync(dir+'/'+name),blob=(await github.rest.git.createBlob({owner,repo,content:b.toString('base64'),encoding:'base64'})).data;tree.push({path:'checkpoints/n05-backpack-missing4-'+context.runId+'/'+name,mode:'100644',type:'blob',sha:blob.sha});}
            const t=(await github.rest.git.createTree({owner,repo,base_tree:base,tree})).data,c=(await github.rest.git.createCommit({owner,repo,tree:t.sha,parents:[current],message:'Retain exact Backpack missing-four N05 outcome '+context.runId})).data;await github.rest.git.updateRef({owner,repo,ref,sha:c.sha,force:false});
