name: Actual producer technical target timeliness and connected pipeline
on:
  push:
    branches: [codex/actual-producer-technical-target-handoff-20261009]
    paths: ['current-generation/**', '.github/workflows/actual-producer-technical-target-20261009.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact main, own repair lease and review head
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='9f55efe0febf6631648597d5fca4d1bd465f04cb')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
      - name: Restore exact already retained delivery fixtures with immutable digests
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),owner=context.repo.owner,repo=context.repo.repo;
            const manifest=JSON.parse(fs.readFileSync('current-generation/tests/fixtures/batched-retained-delivery-source-manifest.json'));
            for(const s of [...manifest.sources,{name:'qnt1826',artifact_id:11423583100,sha256:'f0f94d4beb9740adfdbf7dc83a276b305b7665e39dfb1aa0ae025005de3c7585'}]){
              const b=s.zip_path?fs.readFileSync(s.zip_path):Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:s.artifact_id,archive_format:'zip'})).data);
              if(crypto.createHash('sha256').update(b).digest('hex')!==s.sha256)throw Error('RETAINED_SOURCE_ZIP_HASH:'+s.name);
              fs.mkdirSync('batch-source/'+s.name,{recursive:true});fs.writeFileSync('batch-source/'+s.name+'.zip',b);cp.execFileSync('unzip',['-q','batch-source/'+s.name+'.zip','-d','batch-source/'+s.name]);
            }
            fs.mkdirSync('audit-output',{recursive:true});
            for(const [from,to] of [['checkpoints/actual-zec-sent150-original-input-20261007.json.gz','audit-output/exact-current-data.json.gz'],['checkpoints/production-liq-original-20261008/near0930/exact-current-data.json.gz','audit-output/near0930-exact-current-data.json.gz']])fs.copyFileSync(from,to);
      - name: Assemble exact connected current runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Reproduce original actual-fill producer mismatch and verify assigned consumer
        run: |
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/technical-target-producer.runtime.mjs > audit-output/actual-producer-target-runtime.tap
          node --test current-generation/tests/technical-move-potential.test.mjs > audit-output/technical-target-unit.tap
          cp architecture-cleanup-delta/canonical-final-overlay/src/opportunity-intelligence-engine.mjs runtime/src/opportunity-before-prospective-test.mjs
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/prospective-observation.runtime.mjs current-generation/tests/observation-technical-range.runtime.mjs > audit-output/prospective-and-range-runtime.tap
          cmp current-generation/files/src/technical-move-potential.mjs runtime/src/technical-move-potential.mjs
          cmp current-generation/files/src/canonical-runtime-adapter.mjs runtime/src/canonical-runtime-adapter.mjs
      - name: Verify strict reachable entry and approved delivery pipeline
        run: |
          node current-generation/tests/approved-entry-path.runtime.mjs runtime > audit-output/approved-entry-path.json
          node current-generation/tests/approved-entry-performance.runtime.mjs runtime > audit-output/approved-entry-performance.json
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/approved-telegram-plain.runtime.mjs current-generation/tests/brief-telegram-facts.runtime.mjs current-generation/tests/batched-delivery.runtime.mjs > audit-output/approved-delivery-runtime.tap
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
      - name: Validate generation and exact runtime binding
        run: |
          REPORT2_VALIDATION_RECEIPT_DIR=audit-output node current-generation/validate.mjs > audit-output/validation.json 2> audit-output/validation-errors.txt
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          git rev-parse HEAD > audit-output/head.txt
          sha256sum runtime/src/technical-move-potential.mjs runtime/src/canonical-runtime-adapter.mjs > audit-output/target-runtime-hashes.txt
      - name: Show meaningful check failure locations
        if: failure()
        run: |
          node --input-type=module -e "import fs from 'node:fs';for(const f of fs.readdirSync('audit-output').filter(f=>f.endsWith('.tap')||f.endsWith('errors.txt'))){const ls=fs.readFileSync('audit-output/'+f,'utf8').split(String.fromCharCode(10));for(let i=0;i<ls.length;i++)if(/not ok|AssertionError|ERR_ASSERTION|error:|expected:|actual:|test at/.test(ls[i]))process.stdout.write(f+':'+ls.slice(Math.max(0,i-2),i+18).join(String.fromCharCode(10))+String.fromCharCode(10));}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-producer-technical-target-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Retain successful actual-source replay and composed pipeline
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='9f55efe0febf6631648597d5fca4d1bd465f04cb')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
            const fs=require('fs'),crypto=require('crypto'),tests={};
            for(const file of fs.readdirSync('audit-output').filter(f=>f.endsWith('.tap'))){const t=fs.readFileSync('audit-output/'+file,'utf8'),pass=Number(t.match(/(?:#|ℹ) pass (\d+)/)?.[1]),fail=Number(t.match(/(?:#|ℹ) fail (\d+)/)?.[1]);if(!Number.isInteger(pass)||fail!==0)throw Error('TEST_NOT_PASS:'+file);tests[file]={pass,fail,sha256:crypto.createHash('sha256').update(t).digest('hex')};}
            if(tests['actual-producer-target-runtime.tap']?.pass!==5||tests['technical-target-unit.tap']?.pass!==10||tests['approved-delivery-runtime.tap']?.pass!==35)throw Error('REQUIRED_TEST_COUNTS');
            const replay=JSON.parse(fs.readFileSync('audit-output/actual-producer-target-replay.json')),integration=JSON.parse(fs.readFileSync('audit-output/integration.json')),validation=JSON.parse(fs.readFileSync('audit-output/validation.json')),binding=JSON.parse(fs.readFileSync('audit-output/binding.json'));
            if(replay.status!=='ACTUAL_ORIGINAL_FILLS_PRODUCER_SCHEMA_AND_ASSIGNED_TARGET_CONSUMER_VERIFIED'||replay.old_potential.status!=='NOT_CLOSED'||replay.new_potential.status!=='CLOSED'||!replay.controlled_consumer.unchanged_scores||!replay.controlled_consumer.unchanged_state||!replay.controlled_consumer.unchanged_trigger_invalidation||integration.failed!==0||integration.passed!==37||validation.status!=='CURRENT_GENERATION_VALIDATED'||binding.status!=='CURRENT_RUNTIME_BINDING_VERIFIED')throw Error('CONNECTED_PROOF_NOT_CLOSED');
            const proof={schema:'ACTUAL_PRODUCER_TECHNICAL_TARGET_CONNECTED_20261009_V1',status:'ACTUAL_PRODUCER_TIMING_REACHES_MEASURED_TARGET_WITH_UNCHANGED_ENTRY_GATES',tested_head:context.sha,cloud_run:context.runId,tests,replay,integration,validation,binding,sourceHTTP:0,D1:0,MAIN:0,Telegram:0,actual_ENTRY:false,new_fresh_SENT:false,source_clocks_refreshed:false,weights_thresholds_ENTRY_quotas_unchanged:true,original_SENT_rewritten:false,full_project_complete:false,retained_directory:'checkpoints/actual-producer-target-'+context.runId};
            const entries=[];
            for(const file of fs.readdirSync('audit-output')){const b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('audit-output/'+file).toString('base64'),encoding:'base64'})).data;entries.push({path:proof.retained_directory+'/'+file,mode:'100644',type:'blob',sha:b.sha});}
            const b=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(proof,null,2)+'\n').toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/ACTUAL_PRODUCER_TECHNICAL_TARGET_CONNECTED_20261009.json',mode:'100644',type:'blob',sha:b.sha});
            const parent=(await github.rest.git.getCommit({owner,repo,commit_sha:context.sha})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:parent.tree.sha,tree:entries})).data,c=(await github.rest.git.createCommit({owner,repo,message:'Retain actual raw-fill producer target mismatch and repaired connected consumer proof',tree:tree.sha,parents:[context.sha]})).data;
            await github.rest.git.updateRef({owner,repo,ref:context.ref.replace('refs/',''),sha:c.sha,force:false});
