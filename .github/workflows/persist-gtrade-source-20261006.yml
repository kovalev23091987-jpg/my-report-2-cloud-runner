name: Persist Exact Public Source Evidence
on:
  push:
    branches: [tools/persist-gtrade-source-20261006]
permissions:
  contents: write
  actions: read
jobs:
  persist:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - name: Preserve already received exact public artifact bytes
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const owner=context.repo.owner,repo=context.repo.repo,expected='a29d03a8b5050ed227160a1f4450c14823001704';
            const head=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(head!==expected)throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261006T065915411Z:general-flow-gmx-clock'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            const downloaded=await github.rest.actions.downloadArtifact({owner,repo,artifact_id:11398985333,archive_format:'zip'});
            const bytes=Buffer.from(downloaded.data),sha256=crypto.createHash('sha256').update(bytes).digest('hex');
            if(sha256!=='e063dcaa070b4e476d3d2da0d74d6ec01f13d64b425aa61042e889956a637d8a')throw Error('EXACT_SOURCE_DIGEST_MISMATCH');
            const blob=(await github.rest.git.createBlob({owner,repo,encoding:'base64',content:bytes.toString('base64')})).data;
            const path='checkpoints/source-inputs/gtrade-one-batch-live-37435081885.zip';
            const base=(await github.rest.git.getCommit({owner,repo,commit_sha:expected})).data;
            const tree=(await github.rest.git.createTree({owner,repo,base_tree:base.tree.sha,tree:[{path,mode:'100644',type:'blob',sha:blob.sha}]})).data;
            const commit=(await github.rest.git.createCommit({owner,repo,message:'Preserve exact public gTrade inputs for original-clock replay; archival evidence only',tree:tree.sha,parents:[expected]})).data;
            const ref='refs/heads/archive/gtrade-pinned-source-20261006';
            await github.rest.git.createRef({owner,repo,ref,sha:commit.sha});
            const result={schema:'EXACT_PUBLIC_SOURCE_ARCHIVE_V1',sourceHTTP:0,MAIN:0,D1:0,Telegram:0,production_runtime_changes:0,artifact_id:11398985333,source_cloud_run:37435081885,zip_sha256:sha256,zip_bytes:bytes.length,blob_sha:blob.sha,path,archive_commit:commit.sha,archive_ref:ref,working_ref_unchanged:'refs/heads/main'};
            fs.mkdirSync('audit-output',{recursive:true});fs.writeFileSync('audit-output/source-archive-proof.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-source-archive-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
