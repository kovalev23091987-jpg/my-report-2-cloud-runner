name: N05 Coinbase original response reconciliation
on:
  push:
    branches: [n05-coinbase-pilot-20261011]
    paths:
      - 'tools/replay-n05-coinbase-pilot-20261011.mjs'
      - '.github/workflows/n05-coinbase-replay-20261011.yml'
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require fresh main owner and inactive fence
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(main!=='9975f2ed9a9ede9a1bb979c3a73505434d4964d6')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='CODEX:LOCAL_N05_NEW_VENUE:1791718957493'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Reconcile original Coinbase trades against closed candles
        run: |
          mkdir -p audit-output/n05-coinbase-replay
          node --check tools/replay-n05-coinbase-pilot-20261011.mjs
          node tools/replay-n05-coinbase-pilot-20261011.mjs > audit-output/n05-coinbase-replay/replay.log 2>&1
          cp checkpoints/N05_COINBASE_PILOT_CONSUMER_REPLAY_20261011.json audit-output/n05-coinbase-replay/proof.json
      - name: Retain exact replay result on branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),owner=context.repo.owner,repo=context.repo.repo,ref=context.ref.replace('refs/',''),dir='audit-output/n05-coinbase-replay';if(!fs.existsSync(dir))return;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(main!=='9975f2ed9a9ede9a1bb979c3a73505434d4964d6')throw Error('MAIN_MOVED');
            const phase=JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:'checkpoints/CLOUD_PHASE_STATE_20261004.json',ref:main})).data.content,'base64').toString());if(phase.lease?.owner!=='CODEX:LOCAL_N05_NEW_VENUE:1791718957493'||phase.lease.expires_ts<=Date.now())throw Error('OWNER_BLOCKED');
            const current=(await github.rest.git.getRef({owner,repo,ref})).data.object.sha;if(current!==context.sha)throw Error('SUPERSEDED_HEAD');
            const base=(await github.rest.git.getCommit({owner,repo,commit_sha:current})).data.tree.sha,tree=[];
            for(const name of fs.readdirSync(dir)){const b=fs.readFileSync(dir+'/'+name),blob=(await github.rest.git.createBlob({owner,repo,content:b.toString('base64'),encoding:'base64'})).data;tree.push({path:'checkpoints/n05-coinbase-replay-'+context.runId+'/'+name,mode:'100644',type:'blob',sha:blob.sha});}
            const t=(await github.rest.git.createTree({owner,repo,base_tree:base,tree})).data,c=(await github.rest.git.createCommit({owner,repo,tree:t.sha,parents:[current],message:'Retain original Coinbase N05 reconciliation '+context.runId})).data;await github.rest.git.updateRef({owner,repo,ref,sha:c.sha,force:false});
