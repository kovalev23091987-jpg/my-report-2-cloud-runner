name: Original ZEC165 window and dense long-horizon history diagnosis
on:
  push:
    branches: [codex/zec165-window-dense-history-20261009]
    paths: ['tools/dense-history-baseline-20261009.mjs', 'tools/read-original-zec165-price-window-20261009.mjs', '.github/workflows/zec165-window-dense-history-20261009.yml']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact owner before bounded read
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='837ca996645837de9c5d6ec680a604f53c8b5427')throw Error('MAIN_MOVED');const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString()),phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const parent=(await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');
      - name: Assemble exact current source and consumer
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          cmp runtime/src/deribit-alt-options-evidence.mjs current-generation/files/src/deribit-alt-options-evidence.mjs
          cmp runtime/src/block-result-context.mjs current-generation/files/src/block-result-context.mjs
      - name: Read original ZEC165 shards and reproduce dense history cap
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: |
          node --check tools/read-original-zec165-price-window-20261009.mjs
          node tools/read-original-zec165-price-window-20261009.mjs
          node tools/dense-history-baseline-20261009.mjs runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zec165-window-dense-history-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
      - name: Retain both scoped original-window and structural proofs
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='837ca996645837de9c5d6ec680a604f53c8b5427')throw Error('MAIN_MOVED');const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString()),phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const parent=(await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');
            const fs=require('fs'),p=JSON.parse(fs.readFileSync('audit-output/original-zec165-price-window.json')),baseline=JSON.parse(fs.readFileSync('audit-output/dense-history-baseline.json'));if(p.status!=='BOUNDED_ORIGINAL_IMMUTABLE_PRICE_WINDOW_READ_CLOSED'||p.sourceHTTP!==0||p.task_writes!==0||p.cache_writes!==0||p.d1_usage.rows_read>1000||p.d1_usage.rows_written>16||p.d1_usage.unknown_ops!==0||baseline.status!=='STRUCTURAL_DENSE_12H_24H_RAW_CAP_REPRODUCED')throw Error('PROOF_SCOPE');
            const dir='checkpoints/zec165-window-dense-history-'+context.runId,entries=[],walk=(d)=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(d+'/'+e.name):[d+'/'+e.name]);for(const file of walk('audit-output')){const b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(file).toString('base64'),encoding:'base64'})).data;entries.push({path:dir+'/'+file.slice('audit-output/'.length),mode:'100644',type:'blob',sha:b.sha});}
            for(const [path,proof] of [['checkpoints/ORIGINAL_ZEC165_IMMUTABLE_PRICE_WINDOW_DIAGNOSIS_20261009.json',p],['checkpoints/DENSE_HISTORY_RAW_CAP_BASELINE_20261009.json',baseline]]){const b=(await github.rest.git.createBlob({owner,repo,content:JSON.stringify({...proof,retained_directory:dir},null,2)+'\n',encoding:'utf-8'})).data;entries.push({path,mode:'100644',type:'blob',sha:b.sha});}
            const base=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,t=(await github.rest.git.createTree({owner,repo,base_tree:base.tree.sha,tree:entries})).data,c=(await github.rest.git.createCommit({owner,repo,message:'Retain exact original ZEC165 price window and separate structural dense-history baseline',tree:t.sha,parents:[parent]})).data;await github.rest.git.updateRef({owner,repo,ref:context.ref.replace('refs/',''),sha:c.sha,force:false});
