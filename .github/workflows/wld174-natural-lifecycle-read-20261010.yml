name: Exact WLD174 natural SENT-to-task read
on:
  push:
    branches: [codex/wld174-natural-lifecycle-read-20261010]
    paths:
      - tools/read-wld174-lifecycle-20261010.mjs
      - .github/workflows/wld174-natural-lifecycle-read-20261010.yml
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact owner lease and review head
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json');
            const fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(fence.active||phase.lease?.owner!=='CHATGPT:WLD174_LIFECYCLE:20261010'||phase.lease.expires_ts<=Date.now())throw Error('OWNER_LEASE_REQUIRED');
            if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_HEAD_MOVED');
      - name: Read original WLD174 SENT, task and outcome under daily D1 admission
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: |
          node --check tools/read-wld174-lifecycle-20261010.mjs
          node tools/read-wld174-lifecycle-20261010.mjs
          git rev-parse HEAD > audit-output/tested-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wld174-natural-lifecycle-${{ github.run_id }}
          path: audit-output/
          retention-days: 90
