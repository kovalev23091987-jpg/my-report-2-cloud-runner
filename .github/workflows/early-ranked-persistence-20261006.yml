name: Report2 Ranked Early Persistence
on:
  push:
    branches: [codex/market-ranked-early-persistence-20261006]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fresh owner before tests and replay
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='cc968f96a16ae7ba9d2ce00fd110c66651c93c99')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261006T0942:observation-gate-diagnosis'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Read exact existing 12:27 scheduled report
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
            const r=await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:11401843355,archive_format:'zip'});
            const b=Buffer.from(r.data);
            if(crypto.createHash('sha256').update(b).digest('hex')!=='8066265c6e8e31ac9b17b3ccb02b4de7ffe2ccde578f1c445f44740879af3b12')throw Error('EXACT_REPORT_DIGEST_MISMATCH');
            fs.writeFileSync('original-report.zip',b);fs.mkdirSync('original-report',{recursive:true});cp.execFileSync('unzip',['-q','original-report.zip','-d','original-report']);
      - name: Assemble exact runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Verify current binding, generation and lifecycle policy
        run: |
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/early-ranked-persistence.runtime.mjs current-generation/tests/early-evidence-repair/repair.test.mjs > audit-output/early-ranked-tests.tap
          node current-generation/validate.mjs > audit-output/validation.json 2> audit-output/validation-errors.txt
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
      - name: Exact package hashes
        if: always()
        run: |
          git rev-parse HEAD > audit-output/head.txt
          git rev-parse HEAD^{tree} > audit-output/tree.txt
          sha256sum runtime/src/worker.js runtime/src/canonical-publication.mjs runtime/src/canonical-lifecycle-authority.mjs runtime/src/observation-source-role-gate.mjs runtime/src/selected-early-evidence.mjs runtime/src/v3-early-sidecar.mjs runtime/src/v3-telegram-runtime.mjs runtime/src/v3-telegram-lifecycle-sidecar.mjs runtime/src/canonical-runtime-adapter.mjs runtime/src/manual-report-formatter.mjs runtime/src/telegram-compact-formatter.mjs > audit-output/runtime-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: early-ranked-persistence-${{ github.run_id }}
          path: audit-output/
          retention-days: 30

