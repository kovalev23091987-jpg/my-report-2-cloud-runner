name: Report 2 Liquidation Native Semantics
on:
  push:
    branches: [autonomous/liquidation-native-semantics-20261004]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble accepted runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Validate native future-level semantics
        run: |
          node --test current-generation/tests/future-liquidation-contract.test.mjs > audit-output/native-semantics.tap
          node --import ./current-generation/tests/early-evidence-repair/no-network.mjs audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration-37.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquidation-native-semantics-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
