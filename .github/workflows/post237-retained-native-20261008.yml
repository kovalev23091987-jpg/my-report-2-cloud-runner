name: Retain Actual Post237 Automatic Native Report
on:
  push:
    branches: [codex/original-trigger-window-repair-20261008]
    paths: ['.github/workflows/post237-retained-native-20261008.yml']
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),zlib=require('zlib'),cp=require('child_process'),{owner,repo}=context.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(main!=='b222489066b2c4ad8de44364bd3d7e114f21daa4')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:20261008:1791470809266:full-owner-connected-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');
            const a=(await github.rest.actions.getArtifact({owner,repo,artifact_id:11561745986})).data;
            if(a.workflow_run?.id!==37800810333||a.workflow_run?.head_sha!=='5ce59b2dc05adb660c1b46074e60e0775a569d60'||a.digest!=='sha256:edfa6dafae3c026a5430290c48876f56f930ae8863814e95153a029965a1cfba')throw Error('ARTIFACT_IDENTITY_MISMATCH');
            const bytes=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:a.id,archive_format:'zip'})).data);
            if(crypto.createHash('sha256').update(bytes).digest('hex')!==a.digest.slice(7))throw Error('ORIGINAL_ZIP_DIGEST_MISMATCH');
            fs.writeFileSync('source.zip',bytes);cp.execFileSync('unzip',['-q','source.zip','-d','source']);
            const body=fs.readFileSync('source/report2-run-result.json'),r=JSON.parse(body);if(r.head!==a.workflow_run.head_sha||r.source!=='schedule')throw Error('REPORT_SCOPE_MISMATCH');
            const p={schema:'ACTUAL_POST237_AUTOMATIC_NATIVE_REPORT_RETAINED_V1',reader_run:context.runId,cloud_run:37800810333,head:r.head,run_id:r.run_id,generated_at:r.generated_at,status:r.status,source:r.source,report_artifact:{id:a.id,digest:a.digest},original_report_sha256:crypto.createHash('sha256').update(body).digest('hex'),candidates:r.candidates.map(c=>({contract:c.contract,observed_ts:c.observed_ts,snapshot_id:c.snapshot_id,publication_id:c.publication_id,analytical_fingerprint:c.analytical_fingerprint,state:c.canonical_state,direction:c.canonical?.direction,trigger:c.canonical?.trigger,targets:c.canonical?.targets,liquidations:c.canonical?.liquidations})),acquisition:r.liquidation_source_acquisition_audit,canonical_persistence:r.canonical_persistence,actual_job_telegram_sent:0,actual_ENTRY:false,sourceHTTP:0,D1:0,Telegram:0,original_source_clocks_preserved:true,scope:'POST_PR237_PRE_PR238_AUTOMATIC_REPORT;NO_NEW_SENT;NOT_ENTRY_WINDOW_FIX_ACCEPTANCE',full_project_complete:false};
            const full=JSON.parse(fs.readFileSync('checkpoints/ORIGINAL_LIFECYCLE_TRIGGER_CLOCKS_20261008.json')),original=fs.readFileSync('checkpoints/ORIGINAL_LIFECYCLE_TRIGGER_CLOCKS_20261008.json');
            if(crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+original.length+'\0'),original])).digest('hex')!=='d2331a4a9214857896379d3b4a53957d27947771')throw Error('ORIGINAL_LIFECYCLE_BLOB_CHANGED');
            const compact={schema:full.schema,head:full.head,cloud_run:full.cloud_run,read_ts:full.read_ts,status:full.status,original_bytes_sha256:crypto.createHash('sha256').update(original).digest('hex'),original_blob_sha:'d2331a4a9214857896379d3b4a53957d27947771',D1:full.d1_usage,sourceHTTP:0,Telegram:0,task_writes:0,cases:full.cases.map(c=>({contract:c.contract,publication_id:c.publication_id,run_id:c.run_id,snapshot_id:c.snapshot_id,source_head:c.source_head,source_cloud_run:c.source_cloud_run,analytical_fingerprint:c.analytical_fingerprint,receipt:c.receipt,task:c.task,lifecycle:c.lifecycle,canonical_contract:c.canonical_contract,canonical_keys:c.canonical_keys,original_row_exact:c.original_row_exact,lifecycle_expires_before_due:c.lifecycle_expires_before_due}))};
            const payloads=[['checkpoints/POST_PR237_AUTOMATIC_NATIVE_READBACK_20261008.json',Buffer.from(JSON.stringify(p,null,2)+'\n')],['checkpoints/post237-native-20261008/report2-run-result.json.gz',zlib.gzipSync(body)],['checkpoints/ORIGINAL_LIFECYCLE_TRIGGER_CLOCKS_20261008_SUMMARY.json',Buffer.from(JSON.stringify(compact,null,2)+'\n')],['checkpoints/source-inputs/original-lifecycle-trigger-clocks-20261008.json.gz',zlib.gzipSync(original)]],entries=[];
            for(const [path,b] of payloads){const blob=(await github.rest.git.createBlob({owner,repo,content:b.toString('base64'),encoding:'base64'})).data;entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}
            const ref=context.ref.replace('refs/heads/',''),parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');
            const base=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data.tree.sha,tree=(await github.rest.git.createTree({owner,repo,base_tree:base,tree:entries})).data,c=(await github.rest.git.createCommit({owner,repo,message:'Retain post237 automatic report and compact original SENT lifecycle clock proof',tree:tree.sha,parents:[parent]})).data;
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:c.sha,force:false});console.log(JSON.stringify({proof_head:c.sha,original_run:p.run_id,candidates:p.candidates.map(c=>({contract:c.contract,state:c.state,raw_levels:c.liquidations?.all_zones?.length})),sourceHTTP:0,D1:0,Telegram:0}));
