name: Dynamic Deribit USDC primary source and N14 qualification
on:
  push:
    branches: [codex/dynamic-deribit-usdc-qualification-20261009]
    paths: ['tools/qualify-dynamic-deribit-USDC-20261009.mjs', '.github/workflows/dynamic-deribit-usdc-qualification-20261009.yml']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact owner before bounded read
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='54dba74a4da79df4c7b555cccbfd32ae80c0ac0d')throw Error('MAIN_MOVED');const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString()),phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const parent=(await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');
      - name: Assemble exact current source and consumer
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          cmp runtime/src/deribit-alt-options-evidence.mjs current-generation/files/src/deribit-alt-options-evidence.mjs
          cmp runtime/src/block-result-context.mjs current-generation/files/src/block-result-context.mjs
      - name: Qualify one shared primary USDC quote response with exact original catalog
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: |
          node --check tools/qualify-dynamic-deribit-USDC-20261009.mjs
          node tools/qualify-dynamic-deribit-USDC-20261009.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-deribit-usdc-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact original bytes and measured scope
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='54dba74a4da79df4c7b555cccbfd32ae80c0ac0d')throw Error('MAIN_MOVED');const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:h})).data.content,'base64').toString()),phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const parent=(await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');
            const fs=require('fs'),p=JSON.parse(fs.readFileSync('audit-output/deribit-dynamic-USDC.json'));if(p.status!=='ACTUAL_DYNAMIC_PRIMARY_USDC_QUOTES_AND_N14_CONSUMER_QUALIFIED'||p.sourceHTTP>1||p.MAIN!==0||p.Telegram!==0||p.task_writes!==0||p.d1_usage.unknown_ops!==0||p.d1_usage.rows_read>1000||p.d1_usage.rows_written>128)throw Error('READ_SCOPE');
            const dir='checkpoints/dynamic-deribit-usdc-'+context.runId,index='checkpoints/DYNAMIC_DERIBIT_USDC_SOURCE_CONSUMER_QUALIFICATION_20261009.json',entries=[];for(const name of fs.readdirSync('audit-output')){const path=dir+'/'+name,b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('audit-output/'+name).toString('base64'),encoding:'base64'})).data;entries.push({path,mode:'100644',type:'blob',sha:b.sha});}
            const b=(await github.rest.git.createBlob({owner,repo,content:JSON.stringify({...p,retained_directory:dir},null,2)+'\n',encoding:'utf-8'})).data;entries.push({path:index,mode:'100644',type:'blob',sha:b.sha});const base=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,t=(await github.rest.git.createTree({owner,repo,base_tree:base.tree.sha,tree:entries})).data,c=(await github.rest.git.createCommit({owner,repo,message:'Retain one primary shared USDC quote qualification and original N14 facts; no MAIN',tree:t.sha,parents:[parent]})).data;await github.rest.git.updateRef({owner,repo,ref:context.ref.replace('refs/',''),sha:c.sha,force:false});
