name: Retain original monthly archives and connected qualification evidence
on:
  push:
    branches: [codex/monthly-price-history-20261009]
    paths: ['.github/workflows/monthly-price-proof-retention-20261009.yml']
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo,ref=context.ref.replace('refs/',''),main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(main!=='515e58f360559854c9811c50ced706945feb759d')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='CODEX:FULL_TZ:20261009:1791542831880'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');
            if((await github.rest.git.getRef({owner,repo,ref})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
            const files=[
              [11618917059,'fba36560d7618be996d3484e2ead601b0710eb9d15c49c76d8b7a147fe7f1ccd','checkpoints/binance-monthly-original-37937872663.zip'],
              [11620425632,'4a8db94af2570f08256f87db848466086bd64108e8b7f464b8b0d259ae4a7e81','checkpoints/binance-monthly-connected-37938399671.zip'],
              [11618718666,'60a946746e48f417aed8dc77297940268b30c7cd5363e02c7f067f1e789476de','checkpoints/post259-natural-37937215275.zip']
            ],tree=[];
            for(const [id,hash,path] of files){const bytes=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:id,archive_format:'zip'})).data);if(crypto.createHash('sha256').update(bytes).digest('hex')!==hash)throw Error('EXACT_ORIGINAL_DIGEST:'+id);const blob=(await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'})).data;tree.push({path,mode:'100644',type:'blob',sha:blob.sha});}
            const prior=(await github.rest.git.getCommit({owner,repo,commit_sha:context.sha})).data,created=(await github.rest.git.createTree({owner,repo,base_tree:prior.tree.sha,tree})).data,next=(await github.rest.git.createCommit({owner,repo,tree:created.sha,parents:[context.sha],message:'proof: retain original 92-day venue archives and current cold consumers'})).data;
            if((await github.rest.git.getRef({owner,repo,ref})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED_BEFORE_WRITE');
            await github.rest.git.updateRef({owner,repo,ref,sha:next.sha,force:false});
            core.info(JSON.stringify({status:'ORIGINAL_MONTHLY_ARCHIVES_RETAINED',head:next.sha,files:tree.map(x=>x.path),sourceHTTP:0,D1:0,MAIN:0,Telegram:0,project_complete:false}));
