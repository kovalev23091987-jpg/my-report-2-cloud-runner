name: Owner Telegram strategy-fit shadow no-drop validation
on:
  push:
    branches: [codex/owner-telegram-strategy-fit-shadow-20261010]
    paths:
      - current-generation/files/src/owner-strategy-fit-shadow.mjs
      - current-generation/tests/owner-strategy-fit-shadow.test.mjs
      - checkpoints/OWNER_TELEGRAM_STRATEGY_FIT_AND_LIFECYCLE_TZ_20261010.json
      - .github/workflows/owner-telegram-strategy-fit-shadow-20261010.yml
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require own lease, no fence and exact current review head
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json');
            const fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(fence.active||phase.lease?.owner!=='CHATGPT:OWNER_STRATEGY_FIT_SHADOW:20261010'||phase.lease.expires_ts<=Date.now())
              throw Error('OWNER_LEASE_REQUIRED');
            if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)
              throw Error('EXACT_REVIEW_HEAD_MOVED');
      - name: Run strategy-fit shadow and original price recheck safety tests
        run: |
          set -e
          mkdir -p audit-output
          node --check current-generation/files/src/owner-strategy-fit-shadow.mjs
          node --test current-generation/tests/owner-strategy-fit-shadow.test.mjs current-generation/tests/triggered-entry-recheck.test.mjs cloudflare/public-collector/light-price-recheck.test.mjs
          git rev-parse HEAD > audit-output/tested-head.txt
          sha256sum current-generation/files/src/owner-strategy-fit-shadow.mjs current-generation/tests/owner-strategy-fit-shadow.test.mjs > audit-output/strategy-fit-code-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-fit-shadow-${{ github.run_id }}
          path: audit-output/
          retention-days: 90
