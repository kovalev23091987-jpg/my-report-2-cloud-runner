name: N12 KuCoin exact token spot futures qualification
on:
  push:
    branches: [n12-kucoin-token-qualified]
    paths:
      - tools/qualify-n12-kucoin-token-20261012.mjs
      - .github/workflows/n12-kucoin-token-qualification-20261012.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact fresh main, own bounded lease and inactive fence
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(main!=='eaba65ab6e3bbeadcc4061beecdf2396bc3feb48')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='CODEX:OWNER_N12_KUCOIN_OKX_NATURAL:1791768092965'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Check bounded probe syntax
        run: node --check tools/qualify-n12-kucoin-token-20261012.mjs
      - name: One admitted exact token sample with original clocks
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/qualify-n12-kucoin-token-20261012.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n12-kucoin-token-${{ github.run_id }}
          path: audit-output/n12-kucoin-token/
          retention-days: 30
