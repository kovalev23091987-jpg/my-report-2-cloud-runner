name: Original ZEC removal and current observation chain readback
on:
  push:
    branches: [codex/zec-entry-chain-20261009]
    paths: ['.github/workflows/zec-current-chain-20261009.yml','tools/read-zec-and-current-chain-20261009.mjs']
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require own bounded lease and exact source branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='93ef9d69ccb11a9f1b538159f4de1e1de624fcf3')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='CODEX:ZEC_ENTRY_CHAIN:20261009:1791534434412'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
      - name: Bounded original D1 read through existing daily admission
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/read-zec-and-current-chain-20261009.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zec-current-chain-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
