name: Actual original early queue fairness and connected current runtime
on:
  push:
    branches: [codex/cadence-history-20261009]
    paths: ['runner/r8-20-prospective-validation-sidecar.mjs','current-generation/tests/prospective-public-history.runtime.mjs','tools/verify-original-early-outcome-fairness.mjs','.github/workflows/early-outcome-fairness-connected-20261009.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact main and own bounded lease
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='211e3eb0df6adc9fa889efc33d787aadfac8a0a9')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='CODEX:FULL_TZ:20261009:1791542831880'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
      - name: Assemble exact current runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
      - name: Restore exact original mature price path and historical cursor
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');const b=Buffer.from((await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:11616340369,archive_format:'zip'})).data);if(crypto.createHash('sha256').update(b).digest('hex')!=='1b5e68368351c1b8a3fe8984ee6c5fad83cb779d2ba89f8cfcb98607d9b5daa8')throw Error('ORIGINAL_DIGEST_REQUIRED');fs.writeFileSync('retained-original-early.zip',b);fs.mkdirSync('retained-original-early');cp.execFileSync('unzip',['-q','retained-original-early.zip','-d','retained-original-early']);
      - name: Verify original path, queue fairness, mature history, entry separation and unchanged unit contracts
        run: |
          node --check runner/r8-20-prospective-validation-sidecar.mjs
          node tools/verify-original-early-outcome-fairness.mjs runtime retained-original-early/early-queue-path-diagnosis.json > audit-output/original-queue-console.json
          node current-generation/tests/prospective-public-history.runtime.mjs runtime > audit-output/prospective-history-runtime.tap
          node current-generation/tests/approved-entry-performance.runtime.mjs runtime > audit-output/approved-entry-performance.json
          node --test current-generation/tests/*.test.mjs > audit-output/current-generation-unit-tests.tap
          node current-generation/validate.mjs > audit-output/generation-validation.json
          git rev-parse HEAD > audit-output/head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: early-outcome-fairness-connected-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
