name: Report2 lossless retained history recovery
on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      execute:
        description: Modify only byte-verified old bodies after durable copy
        type: boolean
        default: false
      kind:
        description: Share the existing two-per-day reservation; canonical replacement stays gated
        type: choice
        options: [full_evidence, canonical]
        default: full_evidence
      expected_main:
        description: Exact current main for an explicitly borrowed owner
        default: ''
      expected_owner:
        description: Exact live parent owner; empty for own automatic acquisition
        default: ''
      prefetch_private:
        description: Opt-in exact private batch-read qualification; defaults off
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: report2-retained-history-relocation
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPORT2_CURRENT_GENERATION: MY_REPORT_2_CURRENT_20260929_CURRENT_CYCLE_V13_20M
      REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
      REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
      REPORT2_LOSSLESS_RETENTION_ENABLED: ${{ vars.REPORT2_LOSSLESS_RETENTION_ENABLED || 'false' }}
      REPORT2_CANONICAL_COMPACTION_ENABLED: ${{ vars.REPORT2_CANONICAL_COMPACTION_ENABLED || 'false' }}
      REPORT2_CANONICAL_ARCHIVE_D1_API_TOKEN: ${{ secrets.REPORT2_CANONICAL_ARCHIVE_D1_API_TOKEN || secrets.REPORT2_ISOLATED_D1_API_TOKEN }}
      RETAINED_HISTORY_KIND: ${{ inputs.kind || 'full_evidence' }}
      REPORT2_PRIVATE_PREFETCH_QUALIFICATION: ${{ inputs.prefetch_private == true }}
      EXPECTED_MAIN: ${{ inputs.expected_main || github.sha }}
      BORROW_EXISTING_OWNER: ${{ inputs.expected_owner || '' }}
      LOSSLESS_EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify lossless original bytes, source race, hot references and existing quotas
        run: node --test runner/lossless-full-evidence-recovery.test.mjs runner/protected-canonical-compaction.test.mjs runner/github-bounded-phase-lease.test.mjs
      - name: Preserve original cold full evidence and prove exact current readthrough
        run: node tools/recover-lossless-retained-history-20261014.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lossless-retained-history-${{ github.run_id }}
          path: audit-output/lossless-retained-history/
          if-no-files-found: error
          retention-days: 30
