name: Report2 lossless retained history recovery
on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      execute:
        description: Modify only byte-verified old bodies after durable copy
        type: boolean
        default: false
      kind:
        description: Share the existing two-per-day reservation; canonical replacement stays gated
        type: choice
        options: [full_evidence, canonical]
        default: full_evidence
      expected_main:
        description: Exact current main for an explicitly borrowed owner
        default: ''
      expected_owner:
        description: Exact live parent owner; empty for own automatic acquisition
        default: ''
      prefetch_private:
        description: Opt-in exact private batch-read qualification; defaults off
        type: boolean
        default: false
      canonical_cursor:
        description: Auto resumes the verified durable cursor; explicit numeric override is not promoted
        type: string
        default: 'auto'
      native_qualification:
        description: Explicit manual canonical qualification under the ordinary shared two-slot cap; never enables automatic cleanup
        type: boolean
        default: false
      archive_pool_qualification:
        description: Use installed A1-A4 only inside this borrowed-owner native qualification; permanent flags remain unchanged
        type: boolean
        default: false
      owner_emergency_day:
        description: Owner-approved one-off third shared slot on 2026-10-15 only; empty keeps the two-slot limit
        type: string
        default: ''
      owner_emergency_slot:
        description: Exact separately approved one-off slot on UTC2026-10-15; default preserves third-only behavior
        type: choice
        options: ['3', '4']
        default: '3'
permissions:
  contents: write
concurrency:
  group: report2-retained-history-relocation
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPORT2_CURRENT_GENERATION: MY_REPORT_2_CURRENT_20260929_CURRENT_CYCLE_V13_20M
      REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
      REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
      REPORT2_LOSSLESS_RETENTION_ENABLED: ${{ vars.REPORT2_LOSSLESS_RETENTION_ENABLED || 'false' }}
      REPORT2_CANONICAL_COMPACTION_ENABLED: ${{ vars.REPORT2_CANONICAL_COMPACTION_ENABLED || 'false' }}
      REPORT2_CANONICAL_ARCHIVE_D1_API_TOKEN: ${{ secrets.REPORT2_CANONICAL_ARCHIVE_D1_API_TOKEN || secrets.REPORT2_ISOLATED_D1_API_TOKEN }}
      REPORT2_CANONICAL_ARCHIVE_POOL_ENABLED: ${{ vars.REPORT2_CANONICAL_ARCHIVE_POOL_ENABLED || 'false' }}
      REPORT2_CANONICAL_ARCHIVE_POOL_QUALIFICATION: ${{ inputs.archive_pool_qualification == true }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RETAINED_HISTORY_KIND: ${{ inputs.kind || 'full_evidence' }}
      REPORT2_PRIVATE_PREFETCH_QUALIFICATION: ${{ inputs.prefetch_private == true }}
      REPORT2_OWNER_STORAGE_EMERGENCY_DAY: ${{ inputs.owner_emergency_day || '' }}
      REPORT2_OWNER_STORAGE_EMERGENCY_SLOT: ${{ inputs.owner_emergency_slot || '3' }}
      REPORT2_CANONICAL_SOURCE_CURSOR: ${{ inputs.canonical_cursor || 'auto' }}
      REPORT2_NATIVE_CANONICAL_QUALIFICATION: ${{ inputs.native_qualification == true }}
      EXPECTED_MAIN: ${{ inputs.expected_main || github.sha }}
      BORROW_EXISTING_OWNER: ${{ inputs.expected_owner || '' }}
      LOSSLESS_EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify lossless original bytes, source race, hot references and existing quotas
        run: node --test runner/canonical-retention-cursor.test.mjs runner/canonical-native-qualification.test.mjs runner/d1-budget-overrun-debt.test.mjs runner/lossless-full-evidence-recovery.test.mjs runner/protected-canonical-compaction.test.mjs runner/github-bounded-phase-lease.test.mjs
      - name: Preserve original cold full evidence and prove exact current readthrough
        run: node tools/recover-lossless-retained-history-20261014.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lossless-retained-history-${{ github.run_id }}
          path: audit-output/lossless-retained-history/
          if-no-files-found: error
          retention-days: 30
