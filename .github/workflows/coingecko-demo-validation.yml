name: CoinGecko bounded free Demo sector validation
on:
  workflow_dispatch:
    inputs:
      expected_main:
        required: true
        type: string
      lease_owner:
        required: true
        type: string
      symbol:
        required: true
        type: choice
        options: [UNI, QNT, NATIVE_BATCH, TRON_BATCH]
        default: UNI
      native_batch:
        required: false
        type: choice
        options: [INITIAL_NATIVE4, REMAINING_NATIVE7]
        default: INITIAL_NATIVE4
      candidate_sha:
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: my-report-2-production-cycle
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify disjoint native missing-fact admission without source access
        run: |
          node --test current-generation/tests/native-sector-validation-admission.test.mjs
          node tools/validate-native-sector-batch-20261014.mjs --plan
      - name: Verify one missing exact sector fact under existing daily admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT2_EXPECTED_MAIN: ${{ inputs.expected_main }}
          REPORT2_EXPECTED_LEASE_OWNER: ${{ inputs.lease_owner }}
          REPORT2_VALIDATION_SYMBOL: ${{ inputs.symbol }}
          REPORT2_EXPECTED_CANDIDATE: ${{ inputs.candidate_sha }}
          REPORT2_NATIVE_VALIDATION_BATCH: ${{ inputs.native_batch }}
          REPORT2_COINGECKO_DEMO_API_KEY: ${{ secrets.REPORT2_COINGECKO_DEMO_API_KEY }}
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: |
          if test "$REPORT2_VALIDATION_SYMBOL" = NATIVE_BATCH || test "$REPORT2_VALIDATION_SYMBOL" = TRON_BATCH; then
            node tools/validate-native-sector-batch-20261014.mjs
          else
            node tools/validate-coingecko-demo-sector-20261013.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coingecko-demo-sector-${{ github.run_id }}
          path: audit-output/coingecko-demo-sector/validation.json
          if-no-files-found: error
          retention-days: 30
