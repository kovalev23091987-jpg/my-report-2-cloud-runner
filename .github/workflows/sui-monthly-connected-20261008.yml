name: Connected primary published monthly schedule verification
on:
  push:
    branches: [codex/sui-monthly-projection-connected-20261008]
    paths: ['current-generation/**', 'tools/replay-sui-monthly-connected-20261008.mjs', '.github/workflows/sui-monthly-connected-20261008.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact main and owned bounded lease
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='dbb0d35f1e3b77847c90fbbe7e70292ad488578e')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
      - name: Validate current generation and assemble exact new runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          node current-generation/validate.mjs runtime > audit-output/validation.json
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          cmp runtime/src/published-monthly-supply-schedule.mjs current-generation/files/src/published-monthly-supply-schedule.mjs
          cmp runtime/src/official-token-schedule.mjs current-generation/files/src/official-token-schedule.mjs
          cmp runtime/src/candidate-evidence-v2-runtime.mjs current-generation/files/src/candidate-evidence-v2-runtime.mjs
          cmp runtime/src/block-result-context.mjs current-generation/files/src/block-result-context.mjs
      - name: Restore immutable existing approved delivery fixtures
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
            const manifest=JSON.parse(fs.readFileSync('current-generation/tests/fixtures/batched-retained-delivery-source-manifest.json'));
            for(const s of [...manifest.sources,{name:'qnt1826',artifact_id:11423583100,sha256:'f0f94d4beb9740adfdbf7dc83a276b305b7665e39dfb1aa0ae025005de3c7585'}]){
              const b=s.zip_path?fs.readFileSync(s.zip_path):Buffer.from((await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:s.artifact_id,archive_format:'zip'})).data);
              if(crypto.createHash('sha256').update(b).digest('hex')!==s.sha256)throw Error('SOURCE_ZIP_DIGEST_MISMATCH:'+s.name);
              fs.mkdirSync('batch-source/'+s.name,{recursive:true});fs.writeFileSync('batch-source/'+s.name+'.zip',b);
              cp.execFileSync('unzip',['-q','batch-source/'+s.name+'.zip','-d','batch-source/'+s.name]);
            }
      - name: Verify actual retained schema, exact identity, clock, caps, cache and assigned consumer
        env:
          REPORT2_NATIVE_MODULE_ROOT: runtime/src
        run: |
          node --test current-generation/tests/published-monthly-supply-schedule.test.mjs current-generation/tests/remaining-block-facts.test.mjs current-generation/tests/block-result-context.test.mjs current-generation/tests/candidate-evidence-v2-runtime.test.mjs current-generation/tests/hedera-primary-supply.test.mjs > audit-output/monthly-source-tests.tap
          node tools/replay-sui-monthly-connected-20261008.mjs > audit-output/original-source-replay.log
      - name: Verify unchanged approved messages and composed runtime integration
        env:
          REPORT2_TEST_RUNTIME: runtime
        run: |
          cp checkpoints/actual-zec-sent150-original-input-20261007.json.gz audit-output/exact-current-data.json.gz
          node --test current-generation/tests/approved-telegram-plain.runtime.mjs current-generation/tests/brief-telegram-facts.runtime.mjs current-generation/tests/batched-delivery.runtime.mjs > audit-output/approved-pipeline-tests.tap
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
      - name: Print bounded failure evidence
        if: failure()
        run: |
          node --input-type=module -e "import fs from 'node:fs';for(const f of fs.readdirSync('audit-output').filter(f=>f.endsWith('.tap'))){const t=fs.readFileSync('audit-output/'+f,'utf8');if(/not ok/.test(t))console.log(f,t.slice(-18000));}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-schedule-connected-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Retain composed proof without provider HTTP, D1, MAIN or Telegram
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='dbb0d35f1e3b77847c90fbbe7e70292ad488578e')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
            const fs=require('fs'),crypto=require('crypto'),out=f=>JSON.parse(fs.readFileSync('audit-output/'+f)),tests={};
            for(const f of ['monthly-source-tests.tap','approved-pipeline-tests.tap']){const t=fs.readFileSync('audit-output/'+f,'utf8'),pass=Number(t.match(/(?:#|ℹ) pass (\d+)/)?.[1]),fail=Number(t.match(/(?:#|ℹ) fail (\d+)/)?.[1]);if(!Number.isInteger(pass)||fail!==0)throw Error('TEST_FAILED:'+f);tests[f]={pass,fail,sha256:crypto.createHash('sha256').update(t).digest('hex')};}
            const validation=out('validation.json'),binding=out('binding.json'),integration=out('integration.json'),actual=out('actual-monthly-connected.json');
            if(tests['monthly-source-tests.tap'].pass<20||tests['approved-pipeline-tests.tap'].pass!==35||validation.status!=='CURRENT_GENERATION_VALIDATED'||binding.status!=='CURRENT_RUNTIME_BINDING_VERIFIED'||integration.status!=='PASS'||integration.failed!==0||actual.consumer.facts.length!==1||actual.assigned_route.role!=='OFFICIAL_PUBLISHED_MONTHLY_PROJECTION_CONTEXT'||actual.score_adjustment!==0||actual.sourceHTTP!==0||actual.D1!==0)throw Error('CONNECTED_SCOPE_NOT_CLOSED');
            const proof={schema:'PUBLISHED_MONTHLY_SCHEDULE_CONNECTED_20261008_V1',status:'ACTUAL_RETAINED_PRIMARY_MONTHLY_PROJECTION_TO_EXACT_NEUTRAL_N01_CONSUMER_AND_COMPOSED_PIPELINE_VERIFIED',tested_head:context.sha,cloud_run:context.runId,tests,validation,binding,integration,actual,sourceHTTP:0,D1:0,MAIN:0,Telegram:0,new_source_daily_cap:4,parent_OFFICIAL_EVENTS_daily_cap:288,global_HTTP_cap:164,all_other_caps_and_entry_weights_unchanged:true,projected_month_end_not_actual_unlock:true,source_clocks_refreshed:false,new_fresh_SENT:false,actual_ENTRY:false,full_project_complete:false};
            const dir='checkpoints/monthly-schedule-connected-'+context.runId,entries=[],files=['validation.json','binding.json','assembly.json','integration.json','monthly-source-tests.tap','approved-pipeline-tests.tap','actual-monthly-connected.json'];
            for(const f of files){const b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('audit-output/'+f).toString('base64'),encoding:'base64'})).data;entries.push({path:dir+'/'+f,mode:'100644',type:'blob',sha:b.sha});}
            const b=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(proof,null,2)+'\n').toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/PUBLISHED_MONTHLY_SCHEDULE_CONNECTED_20261008.json',mode:'100644',type:'blob',sha:b.sha});
            const parent=(await github.rest.git.getCommit({owner,repo,commit_sha:context.sha})).data,t=(await github.rest.git.createTree({owner,repo,base_tree:parent.tree.sha,tree:entries})).data,c=(await github.rest.git.createCommit({owner,repo,message:'Retain actual original-clock monthly schedule consumer and unchanged publication integration proof',tree:t.sha,parents:[context.sha]})).data;await github.rest.git.updateRef({owner,repo,ref:context.ref.replace('refs/',''),sha:c.sha,force:false});console.log(JSON.stringify({proof_head:c.sha,status:proof.status,tests}));
