name: Report2 SynFutures Actual Native Candidate Capability
on:
  push:
    branches: [codex/synfutures-native-capability-20261007]
    paths: ['tools/research-synfutures-native-capability-20261007.mjs','tools/synfutures-candidate-model-20261007*','.github/workflows/synfutures-native-capability-20261007.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fresh main owner guard
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,head=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(head!=='33af2beda9febe124557a47db7ddaa8011542048')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:head})).data.content,'base64'));
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261007:1791394702919:connected-source-health'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_HEAD_MOVED');
      - name: Assemble unchanged current runtime and pinned readonly ABI
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
          node --check tools/research-synfutures-native-capability-20261007.mjs
          node --test tools/synfutures-candidate-model-20261007.test.mjs > audit-output/synfutures-candidate-model.tap
      - name: Fresh owner guard before actual missing native fact
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,head=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(head!=='33af2beda9febe124557a47db7ddaa8011542048')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:head})).data.content,'base64'));
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261007:1791394702919:connected-source-health'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_HEAD_MOVED');
      - name: One bounded indexed page and conditional exact-block native read under existing parent caps
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/research-synfutures-native-capability-20261007.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synfutures-native-candidate-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Retain exact candidate response without production activation
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,head=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(head!=='33af2beda9febe124557a47db7ddaa8011542048')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:head})).data.content,'base64'));
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261007:1791394702919:connected-source-health'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_HEAD_MOVED');
            const fs=require('fs'),crypto=require('crypto'),proof=JSON.parse(fs.readFileSync('audit-output/synfutures-native-candidate-proof.json')),tap=fs.readFileSync('audit-output/synfutures-candidate-model.tap','utf8');
            if(proof.cloud_run!==context.runId||proof.head!==context.sha||proof.production_enabled!==false||proof.source_http>2||proof.reserved_http>2||proof.d1_usage.unknown_ops!==0||proof.finalization_error)throw Error('CANDIDATE_BOUND_OR_ACCOUNTING_NOT_CLOSED');
            const pass=Number(tap.match(/(?:#|ℹ) pass (\d+)/)?.[1]),fail=Number(tap.match(/(?:#|ℹ) fail (\d+)/)?.[1]);if(pass!==5||fail!==0)throw Error('CANDIDATE_MATH_TESTS_NOT_PASS');
            const files=['synfutures-native-candidate-raw.json.gz','synfutures-native-candidate-proof.json','synfutures-candidate-model.tap'],entries=[];
            for(const f of files){const b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('audit-output/'+f).toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/synfutures-native-candidate-'+context.runId+'/'+f,mode:'100644',type:'blob',sha:b.sha});}
            const parent=context.sha,commit=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:commit.tree.sha,tree:entries})).data,created=(await github.rest.git.createCommit({owner,repo,message:'Retain bounded actual SynFutures candidate state and original clocks without activation',tree:tree.sha,parents:[parent]})).data;
            await github.rest.git.updateRef({owner,repo,ref:context.ref.replace('refs/',''),sha:created.sha,force:false});console.log(JSON.stringify({status:proof.status,proof_commit:created.sha,source_http:proof.source_http,production_enabled:false}));
