name: Report2 Retained Public History Copy
on:
  push:
    branches: [codex/retained-history-storage-20261005]
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fresh owner and fence before read
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='3ed1764c25d7225f66456c6272d4d634106d37d7')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261005T215136067Z:source-storage'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Copy and independently read exact cold evidence; no database writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCHIVE_EXPECTED_MAIN: '3ed1764c25d7225f66456c6272d4d634106d37d7'
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: |
          mkdir -p audit-output
          node --test audit-fixes/retained-history-20261005/retained-history.test.mjs > audit-output/retained-history.tap
          node audit-fixes/retained-history-20261005/copy-retained-history.mjs > audit-output/console.json
          git rev-parse HEAD > audit-output/head.txt
          git rev-parse HEAD^{tree} > audit-output/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-history-storage-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
