name: Exact original native directional domains through unchanged producer rule
on:
  push:
    branches: [codex/trigger-recovery-receipts-20261009]
    paths: ['tools/verify-original-direction-domain-policy.mjs','.github/workflows/original-direction-domain-policy-20261009.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact current main and own bounded lease
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='9ca1e10e206d54449cd84af963978263ee6feb8f')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='CODEX:FULL_TZ:20261009:1791542831880'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');if((await github.rest.git.getRef({owner,repo,ref:context.ref.replace('refs/','')})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
      - name: Restore exact original partial native read with unchanged clocks
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),b=Buffer.from((await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:11624150550,archive_format:'zip'})).data);if(crypto.createHash('sha256').update(b).digest('hex')!=='0b9335969f6c50599759f1fb2a6c9b913e50db5ad6cbc717615e02107491d3bc')throw Error('ORIGINAL_DIGEST');fs.writeFileSync('original.zip',b);fs.mkdirSync('original');cp.execFileSync('unzip',['-q','original.zip','-d','original']);
      - name: Inspect pure existing assembled direction producer
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          node tools/verify-original-direction-domain-policy.mjs runtime original/original-direction-inputs.json audit-output/original-direction-domain-policy.json > audit-output/console.json
          git rev-parse HEAD > audit-output/head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-direction-domain-policy-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
