name: Retain continuous worker bootstrap and post240 actual report
on:
  push:
    branches: [codex/continuous-production-readback-20261008]
    paths: ['.github/workflows/continuous-production-readback-20261008.yml']
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read immutable current automatic report and delivery artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),zlib=require('zlib'),owner=context.repo.owner,repo=context.repo.repo;
            const check=async()=>{const h=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(h!=='f9d6257febd31b1cbabf63668016006d439f273f')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');};await check();
            const inputs=[{"id":37839437696,"artifacts":[{"id":11576349236,"name":"report2-run-result","digest":"sha256:5b50b7582dea286b3a7e371555bf68909989eea16c37af826e9b4e2235b190c6","head":"70ce1d3ca579208f7f2d8863a1de7d06c2d68bcb"},{"id":11576134998,"name":"report2-telegram-info-proof","digest":"sha256:a344af3680787565e2295d5ad2a96becc8b2e2f49c95b6a7339e719c2b227482","head":"70ce1d3ca579208f7f2d8863a1de7d06c2d68bcb"}]}],out='checkpoints/continuous-production-readback-20261008',entries=[],summaries=[];
            fs.mkdirSync(out,{recursive:true});
            const ba={id:11578246261,run:37841797051,head:'f9d6257febd31b1cbabf63668016006d439f273f',digest:'sha256:8006f073899d8a7b4ab5fd004a869eb1972268db06645f8e29ef3c0fa175d861'};
            const bm=(await github.rest.actions.getArtifact({owner,repo,artifact_id:ba.id})).data;if(bm.workflow_run.id!==ba.run||bm.workflow_run.head_sha!==ba.head||bm.digest!==ba.digest)throw Error('BOOTSTRAP_IDENTITY');
            const bz=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:ba.id,archive_format:'zip'})).data);if('sha256:'+crypto.createHash('sha256').update(bz).digest('hex')!==ba.digest)throw Error('BOOTSTRAP_DIGEST');
            fs.mkdirSync('bootstrap',{recursive:true});fs.writeFileSync('bootstrap.zip',bz);cp.execFileSync('unzip',['-q','bootstrap.zip','-d','bootstrap']);const rawBootstrap=fs.readFileSync('bootstrap/report2-collector-backup-proof.json'),bootstrap=JSON.parse(rawBootstrap),bootProof={schema:'ACTUAL_CONTINUOUS_CLOUD_BOOTSTRAP_READBACK_V1',artifact:ba,receipt:bootstrap,reader_run:context.runId,reader_sourceHTTP:0,reader_D1:0,reader_Telegram:0,full_project_complete:false};
            const bb=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(bootProof,null,2)+'\n').toString('base64'),encoding:'base64'})).data;entries.push({path:out+'/bootstrap-proof.json',mode:'100644',type:'blob',sha:bb.sha});console.log('BOOTSTRAP_RETAINED',JSON.stringify(bootstrap));
            for(const s of inputs){const files={};
              await Promise.all(s.artifacts.map(async a=>{const meta=(await github.rest.actions.getArtifact({owner,repo,artifact_id:a.id})).data;if(meta.workflow_run.id!==s.id||meta.workflow_run.head_sha!==a.head||meta.digest!==a.digest)throw Error('ARTIFACT_IDENTITY_MISMATCH');const b=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:a.id,archive_format:'zip'})).data);if('sha256:'+crypto.createHash('sha256').update(b).digest('hex')!==a.digest)throw Error('ZIP_DIGEST_MISMATCH');const folder='retained/'+s.id+'/'+a.name;fs.mkdirSync(folder,{recursive:true});fs.writeFileSync(folder+'.zip',b);cp.execFileSync('unzip',['-q',folder+'.zip','-d',folder]);const name=a.name==='report2-run-result'?'report2-run-result.json':'telegram-info-proof.json',raw=fs.readFileSync(folder+'/'+name);files[a.name]={a,raw,json:JSON.parse(raw)};}));
              const f=files['report2-run-result'],r=f.json,t=files['report2-telegram-info-proof']?.json;if(r.head!==f.a.head||r.source!=='schedule'||t?.head!==f.a.head||t?.source_run_id!==r.run_id)throw Error('SAME_RUN_REPORT_DELIVERY_MISMATCH');
              const candidates=r.candidates.map(c=>({contract:c.contract,snapshot:c.snapshot_id,publication:c.publication_id,fingerprint:c.analytical_fingerprint||c.canonical?.analytical_fingerprint,state:c.canonical_state,canonical_keys:Object.keys(c.canonical||{}),candidate_keys:Object.keys(c),observed_ts:c.canonical?.observed_ts,canonical_trigger:c.canonical?.trigger,canonical_target:c.canonical?.target,canonical_targets:c.canonical?.targets,canonical_gates:c.canonical?.gates,canonical_entry:c.canonical?.entry,canonical_reasons:c.canonical?.reasons,canonical_direction:c.canonical?.direction,canonical_interest:c.canonical?.interest,liquidations:c.canonical?.liquidations,telegram_text:c.telegram_text||c.canonical?.telegram_text||c.canonical?.telegram,manual_text:c.manual_text,coverage:c.block_coverage?.summary||c.block_coverage?.counts,block_use:c.block_decision_use?.summary,blocks:Object.fromEntries(['N01','N02','N03','N04','N05','N06','N07','N08','N09','N10','N11','N12','N14','N15','N16','LIQ'].map(id=>[id,{coverage:c.block_coverage?.blocks?.[id],use:c.block_decision_use?.blocks?.[id],rendered:c.block_rendered_results?.context_receipts?.filter(x=>x.block_id===id)}]))}));
              const p={schema:'ACTUAL_POST_PR240_AUTOMATIC_ORIGINAL_CLOCK_READBACK_V1',cloud_run:s.id,head:r.head,run_id:r.run_id,generated_at:r.generated_at,status:r.status,reason:r.reason,canonical_persistence:r.canonical_persistence_audit,candidates,acquisition:r.liquidation_source_acquisition_audit,selection:r.candidate_selection_audit,flow_diagnostics:r.n05_source_closure_diagnostics,source_roles:r.source_role_publication_audit,telegram:t,source_artifacts:s.artifacts,reader_run:context.runId,reader_sourceHTTP:0,reader_D1:0,reader_Telegram:0,source_clocks_refreshed:false,full_project_complete:false};summaries.push(p);
              for(const x of Object.values(files)){const raw=zlib.gzipSync(x.raw),blob=(await github.rest.git.createBlob({owner,repo,content:raw.toString('base64'),encoding:'base64'})).data;entries.push({path:out+'/'+s.id+'/'+x.a.name+'.json.gz',mode:'100644',type:'blob',sha:blob.sha});}
              const b=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(p,null,2)+'\n').toString('base64'),encoding:'base64'})).data;entries.push({path:out+'/'+s.id+'/summary.json',mode:'100644',type:'blob',sha:b.sha});
              console.log('AUTOMATIC_REPORT_RETAINED',JSON.stringify({run:s.id,source_run:r.run_id,candidates:candidates.map(c=>({contract:c.contract,state:c.state,direction:c.canonical_direction,liquidation_count:c.liquidations?.all_zones?.length,canonical_keys:c.canonical_keys})),telegram:t?.output}));
            }
            const manifest={schema:'CONTINUOUS_PRODUCTION_RETAINED_BATCH_20261008_V1',reader_run:context.runId,inputs,proofs:summaries.map(x=>({cloud_run:x.cloud_run,head:x.head,run_id:x.run_id,generated_at:x.generated_at,path:out+'/'+x.cloud_run+'/summary.json'})),sourceHTTP:0,D1:0,Telegram:0,original_clocks_preserved:true,full_project_complete:false};
            const b=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(manifest,null,2)+'\n').toString('base64'),encoding:'base64'})).data;entries.push({path:out+'/manifest.json',mode:'100644',type:'blob',sha:b.sha});
            await check();const ref=context.ref.replace('refs/heads/',''),parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');const c=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:c.tree.sha,tree:entries})).data,proof=(await github.rest.git.createCommit({owner,repo,message:'Retain actual automatic report and exact delivery original clocks',tree:tree.sha,parents:[parent]})).data;await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:proof.sha,force:false});console.log('RETAINED_PROOF_HEAD',proof.sha);
