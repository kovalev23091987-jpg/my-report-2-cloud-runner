name: Report 2 V3 R8.20 Exact Promotion Rollback Rehearsal

on:
  push:
    branches:
      - "report2-v3-r8-20-rehearsal-*"

permissions:
  contents: read

concurrency:
  group: report2-v3-r8-20-rehearsal
  cancel-in-progress: false

jobs:
  rehearse-r8-20:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE_MAIN_SHA: "d77525b36ccc94808070a006f05f85e4f8ba86f3"
      BASE_WORKER_SHA: "7a3c73770e516db9e7ef17ca3e582947769c0fa3f8cb2814e915ee0303695a83"
      BASE_PAYLOAD_SHA: "30f9d3b589b0caa8d409707e7e38f0a04c5080130fdd27ea7fa25826e234cf88"
      BASE_RUNNER_SHA: "83cc498468528222b2199f6dccfb5f40d5f717476e724ba4c19515c10355db5a"
      BASE_WORKFLOW_SHA: "424b3878d68b48984332b527f6ed70e30bd7f491f9ac25197017d076075d6692"
      CANDIDATE_RUNNER_SHA: "bc02a0b317cab3f5c1cf27217a9294c5679d3d9c9437167f15eb82557c2257c5"
      CANDIDATE_SIDECAR_SHA: "032dd21974336534b86e5862703b1c6cd5a4c026f5b6780baea192c7caaba581"
      CANDIDATE_WORKFLOW_SHA: "abb0842c0a28f73484fa31a2108747ad0e62eba07332b6d218609df4cad0e8c7"
      MIGRATION_SHA: "d871082daa19e17894475e63e3e6c769cf3332b7fb0950c1b7edd6aa4d029bbd"
      SOURCE_SHA: "c1fa44c5b18a63f0e4144f8c3620fdf11910d8d79778618fb00accf787822e73"
      REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
      REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
      REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
    steps:
      - name: Checkout isolated rehearsal branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Node24 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          NODEV="$(node --version)"
          case "$NODEV" in v24.*) ;; *) echo "NODE24_REQUIRED got=$NODEV"; exit 1;; esac
          echo "R8_20_REHEARSAL_NODE_VERSION=$NODEV"
      - name: Verify exact base and candidate bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN_SHA"
          test "$GITHUB_REF_NAME" != "main"
          test "$(sha256sum payload/report2-runtime.enc | awk '{print $1}')" = "$BASE_PAYLOAD_SHA"
          test "$(sha256sum runner/runner-main.mjs | awk '{print $1}')" = "$BASE_RUNNER_SHA"
          test "$(sha256sum .github/workflows/report2.yml | awk '{print $1}')" = "$BASE_WORKFLOW_SHA"
          test "$(sha256sum .r8-20/candidate/runner-main.mjs | awk '{print $1}')" = "$CANDIDATE_RUNNER_SHA"
          test "$(sha256sum .r8-20/candidate/r8-20-prospective-validation-sidecar.mjs | awk '{print $1}')" = "$CANDIDATE_SIDECAR_SHA"
          test "$(sha256sum .r8-20/candidate/report2.yml | awk '{print $1}')" = "$CANDIDATE_WORKFLOW_SHA"
          test "$(sha256sum .r8-20/migration/20260917_tz101_entry_area_calibration_shadow.sql | awk '{print $1}')" = "$MIGRATION_SHA"
          test "$(sha256sum .r8-20/authoritative-source.zip | awk '{print $1}')" = "$SOURCE_SHA"
          echo "R8_20_REHEARSAL_BINDING=PASS"
      - name: Verify additive D1 schema is closed
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'JS' | tee .r8-20/D1_REHEARSAL_READBACK.log
          import { RemoteD1Database } from './runner/report2-d1-adapter.mjs';
          const db=new RemoteD1Database(process.env.REPORT2_D1_BRIDGE_URL,process.env.REPORT2_D1_BRIDGE_TOKEN,{timeoutMs:45000});
          const result=await db.prepare("SELECT name FROM sqlite_master WHERE name IN ('tz101_entry_area_calibration_signal','tz101_entry_area_calibration_outcome','tz101_entry_area_calibration_state','idx_tz101_entry_area_signal_contract_ts','idx_tz101_entry_area_signal_campaign','idx_tz101_entry_area_outcome_ts')").all();
          const rows=Array.isArray(result?.results)?result.results:[];
          const have=new Set(rows.map(r=>String(r?.name||'')).filter(Boolean));
          if(have.size!==6) throw new Error('R8_20_D1_SCHEMA_NOT_CLOSED:'+JSON.stringify([...have].sort()));
          if(Number(db.usageSnapshot().unknown_ops||0)!==0) throw new Error('D1_REHEARSAL_UNKNOWN_OPS');
          console.log('R8_20_D1_SCHEMA_READBACK=PASS');
          console.log('R8_20_D1_REHEARSAL_ADAPTER=PASS');
          console.log('REMOTE_D1_CHANGED=NO_IN_REHEARSAL');
          JS
      - name: Production-form decrypt with candidate runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$REPORT2_PAYLOAD_KEY"
          rm -rf .r8-20/runtime && mkdir -p .r8-20/runtime
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" .r8-20/runtime.tar.gz
          tar -xzf .r8-20/runtime.tar.gz -C .r8-20/runtime
          rm .r8-20/runtime.tar.gz
          test "$(sha256sum .r8-20/runtime/src/worker.js | awk '{print $1}')" = "$BASE_WORKER_SHA"
          cp .r8-20/candidate/runner-main.mjs .r8-20/runtime/runner-main.mjs
          cp .r8-20/candidate/r8-20-prospective-validation-sidecar.mjs .r8-20/runtime/r8-20-prospective-validation-sidecar.mjs
          cp runner/report2-d1-adapter.mjs .r8-20/runtime/report2-d1-adapter.mjs
          cp runner/d1-preaction-budget-guard.mjs .r8-20/runtime/d1-preaction-budget-guard.mjs
          cp runner/telegram-zero-reason.mjs .r8-20/runtime/telegram-zero-reason.mjs
          cp runner/telegram-output.mjs .r8-20/runtime/telegram-output.mjs
          node --check .r8-20/runtime/runner-main.mjs
          node --check .r8-20/runtime/r8-20-prospective-validation-sidecar.mjs
          echo "R8_20_PRODUCTION_FORM_DECRYPT=PASS"
      - name: Exact promotion diff and byte-exact rollback rehearsal
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .r8-20/candidate/runner-main.mjs runner/runner-main.mjs
          cp .r8-20/candidate/r8-20-prospective-validation-sidecar.mjs runner/r8-20-prospective-validation-sidecar.mjs
          cp .r8-20/candidate/report2.yml .github/workflows/report2.yml
          python3 - <<'PY'
          import subprocess
          rows=[x for x in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines() if x]
          got=sorted(x[3:] for x in rows)
          want=sorted(['.github/workflows/report2.yml','runner/runner-main.mjs','runner/r8-20-prospective-validation-sidecar.mjs'])
          if got!=want: raise SystemExit('R8_20_PROMOTION_DIFF_MISMATCH:'+repr(got))
          print('R8_20_PROMOTION_DIFF_EXACT=PASS')
          PY
          test "$(sha256sum runner/runner-main.mjs | awk '{print $1}')" = "$CANDIDATE_RUNNER_SHA"
          test "$(sha256sum runner/r8-20-prospective-validation-sidecar.mjs | awk '{print $1}')" = "$CANDIDATE_SIDECAR_SHA"
          test "$(sha256sum .github/workflows/report2.yml | awk '{print $1}')" = "$CANDIDATE_WORKFLOW_SHA"
          git diff --check
          git restore runner/runner-main.mjs .github/workflows/report2.yml
          rm runner/r8-20-prospective-validation-sidecar.mjs
          test "$(sha256sum runner/runner-main.mjs | awk '{print $1}')" = "$BASE_RUNNER_SHA"
          test "$(sha256sum .github/workflows/report2.yml | awk '{print $1}')" = "$BASE_WORKFLOW_SHA"
          test ! -e runner/r8-20-prospective-validation-sidecar.mjs
          test -z "$(git status --porcelain | grep -v '^?? .r8-20/' || true)"
          echo "R8_20_BYTE_EXACT_ROLLBACK_REHEARSAL=PASS"
      - name: Verify production main unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          echo "R8_20_PROMOTION_REHEARSAL=PASS"
          echo "PRODUCTION_MAIN_CHANGED=NO"
      - name: Upload rehearsal proof
        uses: actions/upload-artifact@v4
        with:
          name: report2-v3-r8-20-promotion-rehearsal-proof
          if-no-files-found: error
          retention-days: 14
          path: |
            .r8-20/D1_REHEARSAL_READBACK.log
            .r8-20/candidate/runner-main.mjs
            .r8-20/candidate/r8-20-prospective-validation-sidecar.mjs
            .r8-20/candidate/report2.yml
