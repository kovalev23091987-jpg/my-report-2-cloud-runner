name: N06 guarded Santiment SanAPI exact native pilot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/n06-santiment-pilot-20261011.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard fresh main owner and fence before test or source call
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(main!==context.sha)throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='CODEX:LOCAL_N06_MAX_COVERAGE:1791725240977'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Offline plan and syntax validation
        run: |
          mkdir -p audit-output/n06-santiment-pilot
          node --check tools/qualify-n06-santiment-pilot-20261011.mjs
          node tools/qualify-n06-santiment-pilot-20261011.mjs --plan > audit-output/n06-santiment-pilot/plan.json
      - name: Obtain two bounded original exact native social series
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT2_EXPECTED_MAIN: ${{ github.sha }}
          REPORT2_EXPECTED_LEASE_OWNER: CODEX:LOCAL_N06_MAX_COVERAGE:1791725240977
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_SANTIMENT_API_KEY: ${{ secrets.REPORT2_SANTIMENT_API_KEY }}
        run: node tools/qualify-n06-santiment-pilot-20261011.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n06-santiment-pilot-${{ github.run_id }}
          path: audit-output/n06-santiment-pilot/
          retention-days: 30
