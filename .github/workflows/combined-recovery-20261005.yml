name: Report 2 Combined Core and Liquidation Recovery Validation
on:
  push:
    branches: [codex/combined-recovery-20261005]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble exact runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output audit-input
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Validate connected package without live sources
        run: |
          node current-generation/validate.mjs > audit-output/validation.json
          node --test current-generation/tests/general-native-supply-history.test.mjs > audit-output/general-native-supply-history.tap
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
          node current-generation/tests/actual-quality-replay.mjs runtime > audit-output/actual-quality-replay.json
          node --test runner/continuation-stage-gate.test.mjs > audit-output/continuation-stage-gate.tap
      - name: Validate saved actual source data at its original clock
        if: github.ref == 'refs/heads/codex/combined-recovery-20261005'
        run: |
          npm ci --prefix post-v7-consolidated/liquidation/liquidation-extension --ignore-scripts --no-audit --no-fund
          node audit-fixes/verified-liquidation-estimates-20261005/replay-gtrade.mjs > audit-output/historical-gtrade-summary.json
          cp audit-fixes/verified-liquidation-estimates-20261005/historical-gtrade-replay.json audit-output/
      - name: Check fresh main and owner before bounded new source proof
        if: github.ref == 'refs/heads/codex/combined-recovery-20261005'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const main = (await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(main !== '91393c732ffc578127ef0aa69c10a06450fe61bb') throw new Error('EXPECTED_MAIN_CHANGED_NO_SOURCE_CALLS');
            const read = async path => JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:main})).data.content,'base64').toString());
            const phase = await read('checkpoints/CLOUD_PHASE_STATE_20261004.json');
            const fence = await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner !== 'HTX:20261005T203355595Z:combined-runtime' || phase.lease.expires_ts <= Date.now() || fence.active) throw new Error('OWNER_OR_FENCE_NOT_ADMITTED_NO_SOURCE_CALLS');
            fs.writeFileSync('audit-output/fresh-owner-read.json',JSON.stringify({main,owner:phase.lease.owner,expires_ts:phase.lease.expires_ts,fence_active:fence.active}));
      - name: Check one shared actual gTrade snapshot across the saved crypto universe
        if: github.ref == 'refs/heads/codex/combined-recovery-20261005'
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_CONTINUATION_OWNER: 'HTX:20261005T203355595Z:combined-runtime'
          REPORT2_EXPECTED_MAIN: '91393c732ffc578127ef0aa69c10a06450fe61bb'
        run: node audit-fixes/verified-liquidation-estimates-20261005/verify-gtrade-live.mjs runtime > audit-output/gtrade-general-console.json
      - name: Read the already completed failed final joint artifact
        if: github.ref != 'refs/heads/codex/combined-recovery-20261005'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const r = await github.rest.actions.downloadArtifact({owner: context.repo.owner, repo: context.repo.repo, artifact_id: 11353447687, archive_format: 'zip'});
            const zip = Buffer.from(r.data);
            const sha = crypto.createHash('sha256').update(zip).digest('hex');
            if (sha !== 'c53481a8f7c5e221837f047cdfd692e38587a30294f5eec8e83599cddd75249e') throw new Error('SAVED_FINAL_ARTIFACT_HASH_MISMATCH');
            fs.writeFileSync('audit-input/saved-final.zip', zip);
            fs.writeFileSync('audit-output/saved-final-artifact.json', JSON.stringify({run:37329607419,artifact:11353447687,sha256:sha,sourceHTTP:0,historical_only:true}));
      - name: Verify saved immutable facts at their original clock
        if: github.ref != 'refs/heads/codex/combined-recovery-20261005'
        run: |
          unzip -q audit-input/saved-final.zip -d audit-input/saved-final
          node current-generation/tests/saved-final-replay.mjs audit-input/saved-final > audit-output/saved-final-replay.json
      - name: Exact package hashes
        if: always()
        run: |
          sha256sum runtime/src/worker.js runtime/runner-main.mjs runtime/src/candidate-evidence-v2-runtime.mjs runtime/src/supplemental-score-evidence.mjs runtime/src/canonical-runtime-adapter.mjs runtime/src/block-decision-use-audit.mjs > audit-output/runtime-sha256.txt
          git rev-parse HEAD > audit-output/github-head.txt
          git rev-parse HEAD^{tree} > audit-output/github-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-core-liquidation-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
