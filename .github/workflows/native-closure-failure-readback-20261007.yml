name: Read retained connected test failure
on:
  push:
    branches: [codex/native-closure-failure-readback-20261007]
    paths: ['.github/workflows/native-closure-failure-readback-20261007.yml']
permissions:
  contents: write
  actions: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;if(main!=='7e6bcb83a701e279e2c1d628c1b5d07ff7fd9adc')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64'));const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:20261007:1791365140268:liquidation-max-data'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            const b=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:11493806819,archive_format:'zip'})).data);if(crypto.createHash('sha256').update(b).digest('hex')!=='ea8dd9bcda6b4f70967c25e7a2662ed2987a780513cb60a1ce77d78831357445')throw Error('ARTIFACT_DIGEST_MISMATCH');fs.writeFileSync('retained.zip',b);cp.execFileSync('unzip',['-q','retained.zip','-d','retained']);
            const files=fs.readdirSync('retained'),out={schema:'CONNECTED_TEST_FAILURE_RETAINED_READBACK_V1',source_cloud_run:37644804686,sourceHTTP:0,D1:0,MAIN:0,Telegram:0,files:{}};for(const f of files.filter(f=>f.endsWith('.tap')||f.includes('validation'))){const t=fs.readFileSync('retained/'+f,'utf8');if(f.endsWith('.tap')){const lines=t.split('\n'),indices=lines.map((l,i)=>/not ok|✖|AssertionError|ERR_ASSERTION|test at|fail [1-9]/.test(l)?i:null).filter(x=>x!==null),keep=new Set(indices.flatMap(i=>Array.from({length:22},(_,j)=>i-2+j).filter(n=>n>=0&&n<lines.length)));out.files[f]={pass:t.match(/(?:#|ℹ) pass (\d+)/)?.[1]??null,fail:t.match(/(?:#|ℹ) fail (\d+)/)?.[1]??null,failure_excerpt:[...keep].sort((a,b)=>a-b).map(i=>lines[i]).join('\n').slice(0,15000)};}else if(f.includes('errors')){const lines=t.split('\n'),indices=lines.map((l,i)=>!/Error: FAILED node --test/.test(l)&&/not ok|✖|AssertionError|ERR_ASSERTION|test at|error:|expected:|actual:|operator:/.test(l)?i:null).filter(x=>x!==null),keep=new Set(indices.flatMap(i=>Array.from({length:20},(_,j)=>i-2+j).filter(n=>n>=0&&n<lines.length)));out.files[f]=[...keep].sort((a,b)=>a-b).map(i=>lines[i]).join('\n').slice(0,18000);}else out.files[f]=t.slice(-6000);}console.log(JSON.stringify(out));
            const ref=context.ref.replace('refs/heads/',''),parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_HEAD_MOVED');const c=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:c.tree.sha,tree:[{path:'checkpoints/CONNECTED_NATIVE_TEST_FAILURE_READBACK_37644804686.json',mode:'100644',type:'blob',content:JSON.stringify(out,null,2)+'\n'}]})).data,created=(await github.rest.git.createCommit({owner,repo,message:'Retain exact connected test failure without rerunning tests or sources',tree:tree.sha,parents:[parent]})).data;await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:created.sha,force:false});
