name: Existing source Hyperliquid recorder candidate validation
on:
  push:
    branches: ['existing-source-hyperliquid-recorder-candidate-v2-20260925']
permissions:
  contents: read
concurrency:
  group: existing-source-hyperliquid-recorder-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REPORT2_TELEGRAM_SHADOW_DECISION_AUTO: "0"
      REPORT2_V3_TELEGRAM_NETWORK_ENABLED: "0"
      REPORT2_TELEGRAM_OUTPUT_ENABLED: "0"
      REPORT2_TRADING_EXECUTION_ENABLED: "0"
      REPORT2_VALIDATED_SIGNAL_ENABLED: "0"
      REPORT2_LIVE_PROBABILITY_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact parent and protected main
        shell: bash
        run: |
          set -Eeuo pipefail
          PARENT='41376c8e4738d70330801f94d663aa170cd360a6'
          MAIN='08d98579c5ecbeb4de426ffeb1160f25ece52708'
          test "$(git rev-parse HEAD^)" = "$PARENT"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN"
          mapfile -t changed < <(git diff --name-only "$PARENT" HEAD | sort)
          test "${#changed[@]}" -gt 0
          for p in "${changed[@]}"; do case "$p" in existing-source-hyperliquid-recorder-delta/*|.github/workflows/existing-source-hyperliquid-recorder-candidate-validation.yml) ;; *) echo "PROTECTED_PATH_CHANGED:$p" >&2; exit 41;; esac; done
          echo EXACT_PARENT_AND_MAIN_PASS
      - name: Reconstruct verified Fact Contract runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir runtime
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node runner/apply-telegram-runtime-overlay.mjs runtime runner/telegram-runtime-overlay.json
          node cross-venue-delta-overlay/apply-runtime-overlay.mjs runtime
          node cross-venue-delta-overlay/apply-runtime-overlay.mjs runtime
          node architecture-cleanup-delta/canonical-final-overlay/apply-canonical-final-overlay.mjs runtime
          node existing-source-consumer-delta/overlay/apply-existing-source-consumer-overlay.mjs runtime
          node existing-source-coverage-delta/overlay/apply-existing-source-coverage-overlay.mjs runtime
          node existing-source-history-sequence-delta/overlay/apply-existing-source-history-sequence-overlay.mjs runtime
          node existing-source-closure-audit-delta/overlay/apply-existing-source-closure-audit-overlay.mjs runtime
          node existing-source-fact-contract-delta/overlay/apply-existing-source-fact-contract-overlay.mjs runtime
          echo CURRENT_VERIFIED_FACT_CONTRACT_RUNTIME_PASS
      - name: Apply Hyperliquid recorder overlay twice and safety
        shell: bash
        run: |
          set -Eeuo pipefail
          node existing-source-hyperliquid-recorder-delta/overlay/apply-existing-source-hyperliquid-recorder-overlay.mjs runtime
          node existing-source-hyperliquid-recorder-delta/overlay/apply-existing-source-hyperliquid-recorder-overlay.mjs runtime
          node --check runtime/src/hyperliquid-recorder-extension.mjs
          node --check runtime/src/existing-source-consumer.mjs
          node --check runtime/src/source-registry.mjs
          node --check runtime/src/worker.js
          node - <<'NODE'
          const p=require('./runtime/existing-source-hyperliquid-recorder-overlay-proof.json');
          if(p.production_changed||p.d1_migration||p.d1_write_delta!==0||p.telegram_send||p.telegram_recipients_changed||p.cloudflare_deploy||p.force_push||p.hard_gates_changed||p.strategy_weights_changed||p.thresholds_changed||p.automatic_execution||p.validated_signal||p.live_probability||p.new_sources_added||p.second_recorder_added||p.worker_copy_added||p.smart_money_external_requests_before!==1||p.smart_money_external_requests_after!==1||p.hot_cycle_external_request_delta!==0||p.automatic_voting)process.exit(42);
          console.log('HYPERLIQUID_RECORDER_OVERLAY_SAFETY_PASS');
          NODE
      - name: Hyperliquid recorder focused tests
        shell: bash
        env:
          REPORT2_HL_RUNTIME_DIR: runtime
        run: |
          set -Eeuo pipefail
          node --test --test-reporter=tap existing-source-hyperliquid-recorder-delta/overlay/tests/*.test.mjs > hyperliquid-recorder-focused.tap
          grep -F '# fail 0' hyperliquid-recorder-focused.tap >/dev/null
          echo HYPERLIQUID_RECORDER_FOCUSED_PASS
      - name: Prepare test harness
        shell: bash
        run: |
          set -Eeuo pipefail
          cp cross-venue-delta-overlay/tests/*.mjs runtime/tests/
          cp unified-entry-signal-delta/overlay/runtime-test-overrides/*.mjs runtime/tests/
          cp runner/apply-telegram-runtime-overlay.mjs runner/runner-main.mjs runner/r8-20-prospective-validation-sidecar.mjs runner/telegram-info-runtime.mjs runner/telegram-output.mjs runner/telegram-zero-reason.mjs runner/plain-text-telegram.mjs runner/telegram-readonly-diagnostic.mjs runner/report2-d1-adapter.mjs runner/d1-preaction-budget-guard.mjs runtime/
          cp -R telegram-repair-tests runtime/telegram-repair-tests
          echo FINAL_RUNTIME_HARNESS_PASS
      - name: Retained focused suites
        shell: bash
        env:
          REPORT2_EXISTING_SOURCE_RUNTIME_DIR: runtime
          REPORT2_ARCH_RUNTIME_DIR: runtime
        run: |
          set -Eeuo pipefail
          node --test --test-reporter=tap existing-source-fact-contract-delta/overlay/tests/*.test.mjs > fact-retained.tap
          node --test --test-reporter=tap existing-source-closure-audit-delta/overlay/tests/*.test.mjs > closure-retained.tap
          node --test --test-reporter=tap existing-source-history-sequence-delta/overlay/tests/*.test.mjs > history-retained.tap
          node --test --test-reporter=tap existing-source-coverage-delta/overlay/tests/*.test.mjs > coverage-retained.tap
          node --test --test-reporter=tap existing-source-consumer-delta/overlay/tests/*.test.mjs > consumer-retained.tap
          node --test --test-reporter=tap architecture-cleanup-delta/overlay/tests/*.test.mjs > architecture-retained.tap
          node --test --test-reporter=tap free-sources-delta/overlay/tests/*.test.mjs > free-sources-retained.tap
          rm -rf r10_7_auth && mkdir -p r10_7_auth && ln -s ../runtime/src r10_7_auth/src
          node --test --test-reporter=tap unified-entry-signal-delta/overlay/tests/*.test.mjs > unified-retained.tap
          for f in fact-retained.tap closure-retained.tap history-retained.tap coverage-retained.tap consumer-retained.tap architecture-retained.tap free-sources-retained.tap unified-retained.tap; do grep -F '# fail 0' "$f" >/dev/null; done
          echo RETAINED_FOCUSED_PASS
      - name: Inherited runtime regression
        working-directory: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test --test-reporter=tap tests/cross-venue-delta.test.mjs tests/public-evidence-adapters.test.mjs tests/full-evidence-contract.test.mjs tests/full-evidence-shadow-model.test.mjs tests/report2-source-isolation.test.mjs > cross-venue-delta-tests.tap
          mapfile -t regression_files < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'deep-check-journal.CHECKPOINT-full-evidence-shadow-production.test.mjs' ! -name 'deep-check-journal.CHECKPOINT-shadow-decision-layer-production.test.mjs' ! -name 'deep-check-journal.CHECKPOINT-shadow-outcome-calibration-production.test.mjs' ! -name 'htx-liquidation-budget.test.mjs' ! -name 'v3-telegram-lifecycle-sidecar.test.mjs' ! -name 'v3-telegram-lifecycle-sidecar-sqlite.test.mjs' -print | sort)
          node --test --test-reporter=tap "${regression_files[@]}" > runtime-regression-tests.tap
          node --test --test-reporter=tap tests/fast-move-watch-failure-injection.test.mjs tests/multi-wave-campaign-failure-injection.test.mjs tests/final-decision-integration-failure-injection.test.mjs > failure-injection-tests.tap
          echo INHERITED_ACTIVE_REGRESSION_PASS
      - name: Telegram and TZ10.1 retention
        working-directory: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test --test-reporter=tap telegram-repair-tests/*.test.mjs > telegram-candidate-tests.tap
          node telegram-repair-tests/final-chain-regression.mjs > telegram-final-chain.txt
          node --test --test-reporter=tap tests/tz101-publication-input-runtime.test.mjs tests/tz101-liquidation-context.test.mjs tests/tz101-publication-runtime.test.mjs tests/tz101-publication-wiring-static.test.mjs tests/tz101-scenario-plan.test.mjs tests/tz101-cost-assessment.test.mjs > tz101-candidate-tests.tap
          echo TELEGRAM_TZ101_RETENTION_PASS
      - name: Live Hyperliquid recorder and consumer proof
        shell: bash
        env:
          REPORT2_HL_RUNTIME_DIR: runtime
          REPORT2_HL_PROOF_OUTPUT: hyperliquid-recorder-live-proof.json
        run: |
          set -Eeuo pipefail
          node existing-source-hyperliquid-recorder-delta/validation/hyperliquid-recorder-live-proof.mjs
          node - <<'NODE'
          const p=require('./hyperliquid-recorder-live-proof.json');
          if(p.status!=='CLOSED_OBSERVATION_ONLY'||p.calls_used>p.max_calls||p.production_writes||p.d1_writes||p.telegram_send||p.trading||p.automatic_voting||p.hard_gates_changed||p.weights_changed||p.thresholds_changed||p.new_sources_added||p.second_recorder_added||p.hot_cycle_external_request_delta!==0)process.exit(60);
          for(const m of p.methods){const c=p.checks[m];if(!c.context_closed||!c.registry_current||!c.manual_ok||!c.telegram_ok||!c.fingerprint_equal||!c.manual_has_hyperliquid||!c.telegram_has_hyperliquid||!c.no_directional_vote||!c.known_addresses_sample_only||!c.not_global_liquidation_map)process.exit(61);}
          if(!['UNCHANGED','INCREASED','REDUCED','FLIPPED','OPENED','CLOSED'].includes(p.position_change_second?.status))process.exit(62);
          console.log('HYPERLIQUID_LIVE_CONSUMER_PASS');
          NODE
      - name: Exact R075 hot-path closure audit
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_CLOSURE_RUNTIME_DIR: runtime
          REPORT2_CLOSURE_OUTPUT: r075-closure-audit.json
        shell: bash
        run: |
          set -Eeuo pipefail
          node existing-source-closure-audit-delta/validation/existing-source-closure-audit.mjs
          node - <<'NODE'
          const p=require('./r075-closure-audit.json');
          if(p.status!=='CLOSED_READ_ONLY_AUDIT'||p.r075?.status!=='CLOSED_HOT_PATH_EXTENSION'||p.r075?.position_change_classifier_reachable!==true)process.exit(70);
          for(const m of ['metaAndAssetCtxs','fundingHistory','l2Book','clearinghouseState'])if(!p.r075.reachable_methods.includes(m))process.exit(71);
          if(p.d1_usage?.rows_written!==0||p.d1_usage?.unknown_ops!==0)process.exit(72);
          console.log('R075_HOT_PATH_CLOSED_PASS');
          NODE
      - name: Read-only replay retention
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_REPLAY_OUTPUT: r075-unified-replay.json
          REPORT2_FREE_FUNNEL_OUTPUT: r075-funnel-replay.json
        shell: bash
        run: |
          set -Eeuo pipefail
          node runner/telegram-readonly-diagnostic.mjs
          node unified-entry-signal-delta/validation/unified-readonly-replay.mjs
          node free-sources-delta/validation/free-sources-funnel-replay.mjs
          REPORT2_ARCH_STATS_OUTPUT=r075-shadow-statistics.json node architecture-cleanup-delta/validation/architecture-shadow-statistics.mjs
          node - <<'NODE'
          const u=require('./r075-unified-replay.json'),f=require('./r075-funnel-replay.json'),s=require('./r075-shadow-statistics.json');
          if(u.d1_usage?.rows_written!==0||u.d1_usage?.unknown_ops!==0||u.no_lookahead?.status==='FAIL')process.exit(80);
          if(f.production_writes!==false||f.d1_usage?.rows_written!==0||f.d1_usage?.unknown_ops!==0)process.exit(81);
          if(s.d1_usage?.rows_written!==0||s.d1_usage?.unknown_ops!==0)process.exit(82);
          console.log('READ_ONLY_REPLAY_RETENTION_PASS');
          NODE
      - name: Verify protected main unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN='08d98579c5ecbeb4de426ffeb1160f25ece52708'
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN"
          echo PRODUCTION_MAIN_UNCHANGED_PASS
      - name: Save proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-source-hyperliquid-recorder-candidate-proof
          path: |
            runtime/existing-source-hyperliquid-recorder-overlay-proof.json
            hyperliquid-recorder-focused.tap
            fact-retained.tap
            closure-retained.tap
            history-retained.tap
            coverage-retained.tap
            consumer-retained.tap
            architecture-retained.tap
            free-sources-retained.tap
            unified-retained.tap
            runtime/cross-venue-delta-tests.tap
            runtime/runtime-regression-tests.tap
            runtime/failure-injection-tests.tap
            runtime/telegram-candidate-tests.tap
            runtime/telegram-final-chain.txt
            runtime/tz101-candidate-tests.tap
            hyperliquid-recorder-live-proof.json
            r075-closure-audit.json
            telegram-readonly-diagnosis.json
            r075-unified-replay.json
            r075-funnel-replay.json
            r075-shadow-statistics.json
            existing-source-hyperliquid-recorder-delta/spec/*.md
          retention-days: 14
