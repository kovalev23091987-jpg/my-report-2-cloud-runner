name: Runner Keepalive

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Record repository activity
        shell: bash
        run: |
          set -Eeuo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > .runner-heartbeat
          git config user.name "report2-keepalive[bot]"
          git config user.email "report2-keepalive@users.noreply.github.com"
          git add .runner-heartbeat
          git commit -m "chore: keep scheduled runner active" || exit 0
          git push
