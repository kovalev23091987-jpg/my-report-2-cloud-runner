name: Report 2 Liquidation Coverage Live Increment
on:
  push:
    branches: [autonomous/liquidation-coverage-live-20261004]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble accepted runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
      - name: Validate coverage policy package
        run: node --test current-generation/tests/liquidation-futures-coverage.test.mjs current-generation/tests/liquidation-futures-coverage-policy.test.mjs runner/continuation-stage-gate.test.mjs > audit-output/coverage-policy.tap
      - name: Run bounded actual coverage increment
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_SOURCE_PROXY_URL: ${{ secrets.REPORT2_SOURCE_PROXY_URL }}
          REPORT2_SOURCE_PROXY_TOKEN: ${{ secrets.REPORT2_SOURCE_PROXY_TOKEN }}
          LIQFLOW_API_KEY: ${{ secrets.LIQFLOW_API_KEY }}
          OXARCHIVE_API_KEY: ${{ secrets.OXARCHIVE_API_KEY }}
          REPORT2_CONTINUATION_OWNER: 'HTX:20261004T2141:6253a1db'
        run: node audit-fixes/liquidation-coverage-live-20261004/verify-live.mjs runtime > audit-output/liquidation-coverage-console.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquidation-coverage-live-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
