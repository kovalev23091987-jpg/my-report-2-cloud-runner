name: Report2 Retained dYdX Conditional Model Verification
on:
  push:
    branches: [codex/dydx-pinned-model-verification-20261007]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact main and owner before retained-input tests
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='9220553913c6ce2119fb620d15640a4978fa79d5')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261007:1791365140268:liquidation-max-data'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Verify retained native source and current consumer without provider or database calls
        run: |
          node --test current-generation/tests/dydx-pinned-conditional-levels.test.mjs
          node tools/verify-dydx-pinned-conditional-levels-20261007.mjs
      - name: Independently decode original protobuf with Go stdlib and compare actual risk boundaries
        env:
          GO111MODULE: 'off'
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          go version
          go run tools/verify-dydx-native-risk-reference-20261007.go checkpoints/source-inputs/dydx-pinned-native-37612540426.json.gz audit-output/dydx-conditional-model-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dydx-pinned-model-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
