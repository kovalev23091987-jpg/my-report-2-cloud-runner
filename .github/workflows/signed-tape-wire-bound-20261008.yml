name: Report2 Exact Signed Tape Full Bridge Wire Bound
on:
  push:
    branches: [codex/signed-tape-wire-bound-20261008]
    paths: ['current-generation/**', '.github/workflows/signed-tape-wire-bound-20261008.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact owner before work
        uses: actions/github-script@v7
        with:
          script: |
            const h=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;if(h!=='8d3d1ff173e4099a56475e49f7edf14f2a5ac030')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const branch=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(branch!==context.sha)throw Error('REVIEW_MOVED');
      - name: Assemble exact current runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
      - name: Restore immutable existing approved delivery fixtures
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
            const manifest=JSON.parse(fs.readFileSync('current-generation/tests/fixtures/batched-retained-delivery-source-manifest.json'));
            for(const s of [...manifest.sources,{name:'qnt1826',artifact_id:11423583100,sha256:'f0f94d4beb9740adfdbf7dc83a276b305b7665e39dfb1aa0ae025005de3c7585'}]){
              const b=s.zip_path?fs.readFileSync(s.zip_path):Buffer.from((await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:s.artifact_id,archive_format:'zip'})).data);
              if(crypto.createHash('sha256').update(b).digest('hex')!==s.sha256)throw Error('SOURCE_ZIP_DIGEST_MISMATCH:'+s.name);
              fs.mkdirSync('batch-source/'+s.name,{recursive:true});fs.writeFileSync('batch-source/'+s.name+'.zip',b);
              cp.execFileSync('unzip',['-q','batch-source/'+s.name+'.zip','-d','batch-source/'+s.name]);
            }
      - name: Retained controls and dependencies
        run: |
          cp checkpoints/actual-zec-sent150-original-input-20261007.json.gz audit-output/exact-current-data.json.gz
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Reuse sixteen passed exact wire and storage controls
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo;
            const a=(await github.rest.actions.getArtifact({owner,repo,artifact_id:11577684055})).data;if(a.workflow_run.id!==37842979512||a.workflow_run.head_sha!=='98de5f1973a4325c1e03eb308fa1f39ad51fdc8a'||a.digest!=='sha256:e438d735c4165aabc7aedca24aca2dfde635e9f183c398335847b0cfda8cedae')throw Error('PARTIAL_PROOF_IDENTITY');
            const b=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:a.id,archive_format:'zip'})).data);if('sha256:'+crypto.createHash('sha256').update(b).digest('hex')!==a.digest)throw Error('PARTIAL_PROOF_DIGEST');fs.mkdirSync('passed-wire',{recursive:true});fs.writeFileSync('passed-wire.zip',b);cp.execFileSync('unzip',['-q','passed-wire.zip','-d','passed-wire']);
            const tap=fs.readFileSync('passed-wire/flow-wire-tests.tap','utf8');if(Number(tap.match(/(?:#|ℹ) pass (\d+)/)?.[1])!==16||Number(tap.match(/(?:#|ℹ) fail (\d+)/)?.[1])!==1||!tap.includes('current-run-flow-storage-failure.runtime.mjs')||!tap.includes('ERR_MODULE_NOT_FOUND')||!tap.includes('htx-signed-tape.baseline.mjs'))throw Error('BASELINE_SETUP_FAILURE_NOT_PROVEN');
            cp.execFileSync('git',['fetch','--no-tags','--depth=1','origin','98de5f1973a4325c1e03eb308fa1f39ad51fdc8a']);for(const p of ['current-generation/files/src/htx-signed-tape.mjs','current-generation/files/src/source-closure-diagnostics.mjs','current-generation/files/src/evidence-source-store.mjs','current-generation/tests/signed-tape-wire-bound.runtime.mjs','current-generation/tests/fixtures/actual-d1-bridge-20261008.mjs'])if(!cp.execFileSync('git',['show','98de5f1973a4325c1e03eb308fa1f39ad51fdc8a:'+p]).equals(fs.readFileSync(p)))throw Error('PASSED_SOURCE_CHANGED:'+p);
            fs.copyFileSync('passed-wire/wire-bound-proof.json','audit-output/wire-bound-proof.json');fs.writeFileSync('audit-output/first-partial-controls.txt',tap);fs.writeFileSync('audit-output/reused-controls.json',JSON.stringify({pass:16,fail:0,scope:'PASSED_WIRE5_STORAGE6_READ_DIAGNOSTIC5_ONLY;FAILED_BASELINE_SETUP_NOT_ACCEPTED',artifact_id:a.id,artifact_digest:a.digest,cloud_run:37842979512,source_head:'98de5f1973a4325c1e03eb308fa1f39ad51fdc8a',original_file_sha256:crypto.createHash('sha256').update(tap).digest('hex')},null,2));
      - name: Exact unchanged source flow with full bridge wire boundary
        env:
          REPORT2_TEST_RUNTIME: runtime
          REPORT2_WIRE_BOUND_PROOF: audit-output/wire-bound-proof.json
        run: |
          git fetch --no-tags --depth=1 origin b222489066b2c4ad8de44364bd3d7e114f21daa4
          git show b222489066b2c4ad8de44364bd3d7e114f21daa4:current-generation/files/src/htx-signed-tape.mjs > runtime/src/htx-signed-tape.baseline.mjs
          node --test current-generation/tests/current-run-flow-storage-failure.runtime.mjs > audit-output/flow-wire-tests.tap
          node --test current-generation/tests/htx-signed-tape.test.mjs > audit-output/raw-integrity-tests.tap
          cmp current-generation/files/src/htx-signed-tape.mjs runtime/src/htx-signed-tape.mjs
          cmp current-generation/files/src/evidence-source-store.mjs runtime/src/evidence-source-store.mjs
          cmp current-generation/files/src/source-closure-diagnostics.mjs runtime/src/source-closure-diagnostics.mjs
      - name: Approved assembled pipeline and generation
        run: |
          node current-generation/validate.mjs > audit-output/validation.json 2> audit-output/validation-errors.txt
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/approved-telegram-plain.runtime.mjs current-generation/tests/brief-telegram-facts.runtime.mjs current-generation/tests/batched-delivery.runtime.mjs > audit-output/observation-pipeline-tests.tap
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
          git rev-parse HEAD > audit-output/head.txt
          sha256sum runtime/src/triggered-entry-recheck.mjs runtime/runner-main.mjs runtime/src/worker.js cloudflare/public-collector/trigger-analysis-kick.mjs .github/workflows/report2.yml .github/workflows/report2-public-collector-backup.yml > audit-output/runtime-hashes.txt
      - name: Print bounded failure evidence
        if: failure()
        run: |
          node --input-type=module -e "import fs from 'node:fs';for(const f of fs.readdirSync('audit-output').filter(f=>f.endsWith('.tap')||f.endsWith('errors.txt'))){const ls=fs.readFileSync('audit-output/'+f,'utf8').split(String.fromCharCode(10)),ix=ls.map((s,i)=>/not ok|✖|AssertionError|ERR_ASSERTION|test at|error:|expected:|actual:|operator:/.test(s)?i:null).filter(i=>i!==null),keep=new Set(ix.flatMap(i=>Array.from({length:18},(_,j)=>i-2+j).filter(n=>n>=0&&n<ls.length)));if(keep.size)process.stdout.write(f+':'+String.fromCharCode(10)+[...keep].sort((a,b)=>a-b).map(i=>ls[i]).join(String.fromCharCode(10)).slice(0,16000)+String.fromCharCode(10));}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-tape-wire-bound-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
      - name: Retain exact assembled bridge wire proof
        uses: actions/github-script@v7
        with:
          script: |
            const h=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;if(h!=='8d3d1ff173e4099a56475e49f7edf14f2a5ac030')throw Error('MAIN_MOVED');const read=async p=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:p,ref:h})).data.content,'base64').toString());const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');if(phase.lease?.owner!=='HTX:1791485859126:full-owner-cloud-continuation'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');const branch=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:context.ref.replace('refs/','')})).data.object.sha;if(branch!==context.sha)throw Error('REVIEW_MOVED');
            const fs=require('fs'),crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo,tests={};
            const files=fs.readdirSync('audit-output').filter(f=>f.endsWith('.tap')||['integration.json','validation.json','binding.json','head.txt','runtime-hashes.txt','wire-bound-proof.json','current-run-flow-write-failure-proof.json','reused-controls.json','first-partial-controls.txt'].includes(f));
            for(const f of files.filter(f=>f.endsWith('.tap'))){const t=fs.readFileSync('audit-output/'+f,'utf8'),pass=Number(t.match(/(?:#|ℹ) pass (\d+)/)?.[1]),fail=Number(t.match(/(?:#|ℹ) fail (\d+)/)?.[1]);if(!Number.isInteger(pass)||fail!==0)throw Error('TEST_FAILED:'+f);tests[f]={pass,fail,sha256:crypto.createHash('sha256').update(t).digest('hex')};}
            const readOutput=f=>JSON.parse(fs.readFileSync('audit-output/'+f)),integration=readOutput('integration.json'),validation=readOutput('validation.json'),replay=readOutput('wire-bound-proof.json');
            if(tests['flow-wire-tests.tap']?.pass!==6||readOutput('reused-controls.json').pass!==16||tests['raw-integrity-tests.tap']?.pass!==10||tests['observation-pipeline-tests.tap']?.pass!==35||integration.status!=='PASS'||integration.failed!==0||validation.status!=='CURRENT_GENERATION_VALIDATED'||replay.old_request_bytes<=replay.wire_cap||replay.new_request_bytes>replay.wire_cap||replay.ring_hash!==replay.decoded_ring_hash)throw Error('CONNECTED_PROOF_NOT_CLOSED');
            const proof={schema:'SIGNED_TAPE_EXACT_BRIDGE_WIRE_BOUND_20261008_V1',status:'ACTUAL_DEPLOYED_BRIDGE_LIMIT_REPLAY_AND_ASSEMBLED_FLOW_VERIFIED',tested_head:context.sha,cloud_run:context.runId,reused_controls:readOutput('reused-controls.json'),tests,integration,validation,replay,bridge_script:'my-report-2-d1-bridge',bridge_tag:'86669aa34b584dc99d9d34c12334b0c4',bridge_last_modified:'2026-09-16T10:24:47.797701Z',deployed_bridge_code_sha256:crypto.createHash('sha256').update(fs.readFileSync('current-generation/tests/fixtures/actual-d1-bridge-20261008.mjs')).digest('hex'),D1_bridge_not_modified:true,sourceHTTP:0,D1:0,MAIN:0,Telegram:0,provider_caps_changed:false,original_clocks_unchanged:true,entry_gates_changed:false,actual_historical_NEAR_error_cause_closed:false,new_fresh_SENT:false,actual_ENTRY:false,full_project_complete:false};
            const entries=[];for(const f of files){const b=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('audit-output/'+f).toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/signed-tape-wire-bound-tests-'+context.runId+'/'+f,mode:'100644',type:'blob',sha:b.sha});}
            const b=(await github.rest.git.createBlob({owner,repo,content:Buffer.from(JSON.stringify(proof,null,2)+'\n').toString('base64'),encoding:'base64'})).data;entries.push({path:'checkpoints/SIGNED_TAPE_EXACT_BRIDGE_WIRE_BOUND_20261008.json',mode:'100644',type:'blob',sha:b.sha});
            const ref=context.ref.replace('refs/heads/',''),parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('REVIEW_MOVED');const c=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data,tree=(await github.rest.git.createTree({owner,repo,base_tree:c.tree.sha,tree:entries})).data,n=(await github.rest.git.createCommit({owner,repo,message:'Retain assembled full bridge wire bound and lossless original flow proof',tree:tree.sha,parents:[parent]})).data;await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:n.sha,force:false});console.log('VERIFIED_PROOF_HEAD',n.sha);
