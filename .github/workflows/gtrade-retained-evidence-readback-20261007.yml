name: Retained gTrade and actual report evidence readback
on:
  push:
    branches: [codex/gtrade-retained-evidence-readback-20261007]
    paths: ['.github/workflows/gtrade-retained-evidence-readback-20261007.yml']
permissions:
  contents: write
  actions: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),zlib=require('zlib');
            const owner=context.repo.owner,repo=context.repo.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(main!=='d9f07f697bbfb5e86036727b3fd219da1b936142')throw Error('MAIN_MOVED');
            const phase=JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:'checkpoints/CLOUD_PHASE_STATE_20261004.json',ref:main})).data.content,'base64'));
            const fence=JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path:'audit-fixes/source-optimization-20260930/execution-lock.json',ref:main})).data.content,'base64'));
            if(phase.lease?.owner!=='HTX:20261007:1791365140268:liquidation-max-data'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
            const specs=[
            {key:'point',id:11491052731,digest:'0e9f19a237f341b3762910a840dc3c3530a2c37a0b2609d59390b7d48b7b165c'},
            {key:'report',id:11490465980,digest:'9506a58e7a1566193f4ad798c1cf8cff4adbeb77e7c7d138c8609949f8e5ba05'},
            {key:'delivery',id:11490406028,digest:'080b566694f5bf3e937c9556e4e9a8d357e3d5e282f4f882624714e317798aa4'}];
            for(const s of specs){const bytes=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:s.id,archive_format:'zip'})).data);if(crypto.createHash('sha256').update(bytes).digest('hex')!==s.digest)throw Error('ARTIFACT_DIGEST_MISMATCH:'+s.key);fs.mkdirSync(s.key);fs.writeFileSync(s.key+'.zip',bytes);cp.execFileSync('unzip',['-q',s.key+'.zip','-d',s.key]);}
            const find=(dir,name)=>{const files=cp.execFileSync('find',[dir,'-type','f']).toString().trim().split('\n');const f=files.find(x=>x.endsWith('/'+name));if(!f)throw Error('MISSING_FILE:'+name);return f;};
            const point=JSON.parse(fs.readFileSync(find('point','gtrade-exact-selected-current-proof.json')));
            if(point.github_head!=='f7c6a80f6830bc6809372ae18dd2d16e09b218d7'||point.status!=='ACTUAL_EXACT_SELECTED_NATIVE_LEVELS_AND_DURABLE_HINTS_VERIFIED'||point.source_http!==3||point.rpc_response_errors.length||point.MAIN!==0||point.Telegram!==0)throw Error('POINT_PROOF_NOT_CLOSED');
            if(fs.readFileSync(find('point','head.txt'),'utf8').trim()!==point.github_head)throw Error('TEST_HEAD_MISMATCH');
            const tests={};for(const f of cp.execFileSync('find',['point','-type','f']).toString().trim().split('\n').filter(f=>f.endsWith('.tap'))){const t=fs.readFileSync(f,'utf8');const pass=Number(t.match(/^# pass (\d+)$/m)?.[1]),fail=Number(t.match(/^# fail (\d+)$/m)?.[1]);if(Number.isInteger(fail)&&fail!==0)throw Error('TEST_NOT_PASS:'+f);tests[f.split('/').pop()]={pass:Number.isInteger(pass)?pass:null,fail:Number.isInteger(fail)?fail:null,format:Number.isInteger(pass)?'TAP':'OTHER_SUCCESSFUL_COMMAND_OUTPUT',sample:Number.isInteger(pass)?null:t.slice(0,1800),sha256:crypto.createHash('sha256').update(t).digest('hex')};}
            const raw=fs.readFileSync(find('point','gtrade-exact-selected-current-raw.json.gz'));if(crypto.createHash('sha256').update(raw).digest('hex')!==point.raw_gzip_sha256)throw Error('POINT_RAW_DIGEST');
            const manifest={schema:'RETAINED_POINT_AND_NATURAL_REPORT_READBACK_20261007_V1',sourceHTTP:0,D1:0,MAIN:0,Telegram:0,source_clocks_refreshed:false,artifact_specs:specs,point_head:point.github_head,point_status:point.status,tests,point_raw_sha256:point.raw_gzip_sha256,report_files:cp.execFileSync('find',['report','delivery','-type','f']).toString().trim().split('\n')};
            const files=[
            ['checkpoints/GTRADE_ACTUAL_EXACT_SELECTED_NATIVE_20261007.json',Buffer.from(JSON.stringify(point,null,2)+'\n')],
            ['checkpoints/source-inputs/gtrade-exact-selected-37638236338.json.gz',raw],
            ['checkpoints/POST_PR223_REPORT_37636666412.json',fs.readFileSync(find('report','report2-run-result.json'))],
            ['checkpoints/POST_PR223_TELEGRAM_37636666412.json',fs.readFileSync(find('delivery','telegram-info-proof.json'))],
            ['checkpoints/GTRADE_POINT_AND_REPORT_RETAINED_READBACK_20261007.json',Buffer.from(JSON.stringify(manifest,null,2)+'\n')]];
            for(const f of cp.execFileSync('find',['point','-type','f']).toString().trim().split('\n').filter(f=>f.endsWith('.tap')||f.endsWith('integration.json')||f.endsWith('dydx-go-reference-proof.json')||f.endsWith('dydx-go-original-reference-proof.json'))){files.push(['checkpoints/gtrade-exact-selected-tests-37638236338/'+f.split('/').pop(),fs.readFileSync(f)]);}
const entries=[];for(const [path,b]of files){const blob=(await github.rest.git.createBlob({owner,repo,content:b.toString('base64'),encoding:'base64'})).data;entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}
            const ref=context.ref.replace('refs/heads/','');if(ref!=='codex/gtrade-retained-evidence-readback-20261007')throw Error('REF_NOT_EVIDENCE_BRANCH');
            const parent=(await github.rest.git.getRef({owner,repo,ref:'heads/'+ref})).data.object.sha;if(parent!==context.sha)throw Error('EVIDENCE_BRANCH_MOVED');
            const parentCommit=(await github.rest.git.getCommit({owner,repo,commit_sha:parent})).data;
            const tree=(await github.rest.git.createTree({owner,repo,base_tree:parentCommit.tree.sha,tree:entries})).data;
            const commit=(await github.rest.git.createCommit({owner,repo,message:'Retain digest-verified exact native evidence and actual natural report without source rereads',tree:tree.sha,parents:[parent]})).data;
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:commit.sha,force:false});
            console.log(JSON.stringify({status:'RETAINED_DIGEST_READBACK_SAVED_ON_REVIEW_BRANCH',commit:commit.sha,files:entries,tests,sourceHTTP:0,D1:0,MAIN:0,Telegram:0}));
