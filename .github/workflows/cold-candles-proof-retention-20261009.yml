name: Retain cold OHLC, whole-register use and actual daily refusal evidence
on:
  push:
    branches: [codex/cold-ohlc-intervals-20261009]
    paths: ['.github/workflows/cold-candles-proof-retention-20261009.yml']
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto=require('crypto'),owner=context.repo.owner,repo=context.repo.repo,ref=context.ref.replace('refs/',''),main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(main!=='5c8ee5258a2959174ad4881eca488c78c5473608')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='CODEX:FULL_TZ:20261009:1791542831880'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_BLOCKED');
            if((await github.rest.git.getRef({owner,repo,ref})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED');
            const files=[[11625409516,"65c3a9313823735bc6fdfd6deeed13d478e62c1d52b4d79b0614370dfb91c3dd","checkpoints/cold-derived-candles-connected-37951988397.zip"],[11626710542,"7539f4506584469e789e0650bbe7ba478cde1d7c0444a576647433346701cf7f","checkpoints/retained-whole-register-use-37952239872.zip"],[11626327155,"34446c9e4df8a39bacc66950147ff3ec2c4595d650599516ef400ee806e95361","checkpoints/post264-budget-refusal-37951516499.zip"]],tree=[];
            for(const [id,hash,path] of files){const bytes=Buffer.from((await github.rest.actions.downloadArtifact({owner,repo,artifact_id:id,archive_format:'zip'})).data);if(crypto.createHash('sha256').update(bytes).digest('hex')!==hash)throw Error('EXACT_ORIGINAL_DIGEST:'+id);const blob=(await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'})).data;tree.push({path,mode:'100644',type:'blob',sha:blob.sha});}
            const prior=(await github.rest.git.getCommit({owner,repo,commit_sha:context.sha})).data,created=(await github.rest.git.createTree({owner,repo,base_tree:prior.tree.sha,tree})).data,next=(await github.rest.git.createCommit({owner,repo,tree:created.sha,parents:[context.sha],message:'proof: retain original failed query, preserved unknown costs, direction inputs and typed refusal validation'})).data;
            if((await github.rest.git.getRef({owner,repo,ref})).data.object.sha!==context.sha)throw Error('REVIEW_MOVED_BEFORE_WRITE');
            await github.rest.git.updateRef({owner,repo,ref,sha:next.sha,force:false});
            core.info(JSON.stringify({status:'TYPED_BUDGET_AND_ORIGINAL_EVIDENCE_RETAINED',head:next.sha,files:tree.map(x=>x.path),sourceHTTP:0,D1:0,MAIN:0,Telegram:0,project_complete:false}));
