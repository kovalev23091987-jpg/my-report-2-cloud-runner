          files={'encrypted_runtime':'report2-runtime.enc','runner':'emitted/runner-main.mjs','workflow':'emitted/report2.yml',
                 'adaptive_budget':'candidate/src/v3-adaptive-budget.mjs','early_sidecar':'candidate/src/v3-early-sidecar.mjs',
                 'early_persistence_runtime':'candidate/src/v3-early-persistence-runtime.mjs','worker':'candidate/src/worker.js',
                 'readiness_zip':'MY_REPORT_2_V3_PREDEPLOY_READINESS_CANDIDATE_R8_8_20260918.zip'}
          out={'schema':'report2-r8-8-exact-artifact-v1','github_run_id':os.environ.get('GITHUB_RUN_ID'),'head_sha':os.environ.get('GITHUB_SHA'),'files':{}}
          for k,rel in files.items():
              p=root/rel
              if not p.is_file(): raise SystemExit('R8_8_ARTIFACT_MISSING:'+rel)
              out['files'][k]={'path':rel,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          expected={'worker':'72f0cab80ac9c38c4b3a84116b40c16fb54d5944ce20e1da2b6c399a386bc36c','adaptive_budget':'c622b91a48cb2477c5515f80475038318158e8eda275a6b1b3fcc06c8b6d8c30','early_sidecar':'dc91d7df674d26972d99c11366add9cb03ed1f43abfbc747197b30f2e4de35ad','early_persistence_runtime':'f82bd950ec1c7393bcccf36439a740ba3e9f4f9b26d1cbbf5fd3bd98b265a8ee'}
          for k,v in expected.items():
              if out['files'][k]['sha256']!=v: raise SystemExit('R8_8_SHA_DRIFT:'+k)
          pathlib.Path('.v3-r8-integration/R8_8_EXACT_ARTIFACT_MANIFEST.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('R8_8_EXACT_ARTIFACT_CAPTURE=PASS')
