name: Report 2 V3 R8 Controlled Integration

on:
  push:
    branches:
      - "report2-v3-r8-integrate-*"

permissions:
  contents: read

concurrency:
  group: report2-v3-r8-controlled-integration
  cancel-in-progress: false

jobs:
  r8-controlled-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_MAIN_SHA: "26bf598affe96e224a65df522c80d85779ed3c13"
      R8_WORKER_SHA: "72f0cab80ac9c38c4b3a84116b40c16fb54d5944ce20e1da2b6c399a386bc36c"
      REPORT2_EXPECTED_WORKER_SHA: "72f0cab80ac9c38c4b3a84116b40c16fb54d5944ce20e1da2b6c399a386bc36c"
      R8_ZIP_SHA: "f9d3d1de126e21ee7fdef679ea240a64a917355d21421f09916c96b2ee3b7062"
      REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
      REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
      REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
      REPORT2_SOURCE_PROXY_URL: ${{ secrets.REPORT2_SOURCE_PROXY_URL }}
      REPORT2_SOURCE_PROXY_TOKEN: ${{ secrets.REPORT2_SOURCE_PROXY_TOKEN }}
      REPORT2_TELEGRAM_RELAY_URL: "https://my-report-2-hub.kovalev23091987.workers.dev/telegram-test"
      REPORT2_TELEGRAM_RELAY_KEY: ${{ secrets.REPORT2_TELEGRAM_RELAY_KEY }}
      REPORT2_TELEGRAM_REPORT_TEST: "false"
      REPORT2_TELEGRAM_SHADOW_DECISION_AUTO: "0"
      REPORT2_TELEGRAM_WATCH70_ENABLED: "0"
      REPORT2_TELEGRAM_WATCH70_THRESHOLD: "70"
      REPORT2_TELEGRAM_OUTPUT_ENABLED: "0"
      REPORT2_V3_TELEGRAM_JOURNAL_ENABLED: "1"
      REPORT2_V3_TELEGRAM_NETWORK_ENABLED: "0"
      BYKARANTELI_API_KEY: CLOUDFLARE_PROXY_CONFIGURED
      REPORT2_RUN_SOURCE: "controlled-v3-r8"
      REPORT2_D1_RUNS_PER_DAY: "288"
      REPORT2_D1_MAX_DAILY_READS: "3500000"
      REPORT2_D1_MAX_DAILY_WRITES: "70000"
    steps:
      - name: Checkout isolated integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify isolation and exact R9 main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN_SHA"
          test "$GITHUB_REF_NAME" != "main"
          sha256sum --check .v3-r8-integration/GATE_CHECKSUMS.sha256
          test "$(sha256sum .v3-r8-integration/MY_REPORT_2_V3_PREDEPLOY_READINESS_CANDIDATE_R8_20260918.zip | awk '{print $1}')" = "$R8_ZIP_SHA"
          echo "R8_INTEGRATION_ISOLATION=PASS"
          echo "PRODUCTION_MAIN_CHANGED=NO"
      - name: Full R8 Node24 readiness before any D1 write
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .v3-r8-integration/bin .v3-r8-integration/unpacked
          if ! command -v shasum >/dev/null 2>&1; then
            printf '%s\n' '#!/bin/bash' 'set -Eeuo pipefail' 'if [ "${1:-}" = "-a" ] && [ "${2:-}" = "256" ]; then shift 2; fi' 'exec sha256sum "$@"' > .v3-r8-integration/bin/shasum
            chmod +x .v3-r8-integration/bin/shasum
            export PATH="$GITHUB_WORKSPACE/.v3-r8-integration/bin:$PATH"
          fi
          rm -rf .v3-r8-integration/unpacked/*
          unzip -q .v3-r8-integration/MY_REPORT_2_V3_PREDEPLOY_READINESS_CANDIDATE_R8_20260918.zip -d .v3-r8-integration/unpacked
          ROOT="$GITHUB_WORKSPACE/.v3-r8-integration/unpacked/MY_REPORT_2_V3_PREDEPLOY_READINESS_CANDIDATE_R8_20260918"
          chmod +x "$ROOT/RUN_INTERNAL_NODE24_READINESS.command"
          REPORT2_REPO="$GITHUB_WORKSPACE" "$ROOT/RUN_INTERNAL_NODE24_READINESS.command" | tee .v3-r8-integration/NODE24_READINESS.log
          grep -q '^FINAL_RESULT=READY_FOR_CONTROLLED_INTEGRATION_NOT_DEPLOYED$' .v3-r8-integration/NODE24_READINESS.log
          RESULT_FILE="$(grep '^RESULT_FILE=' .v3-r8-integration/NODE24_READINESS.log | tail -1 | cut -d= -f2-)"
          test -f "$RESULT_FILE"
          cp "$RESULT_FILE" .v3-r8-integration/NODE24_READINESS_RESULT.txt
          echo "R8_ROOT=$ROOT" >> "$GITHUB_ENV"
          printf '{\n  "status":"READY_FOR_CONTROLLED_R8_NOT_DEPLOYED",\n  "base_main":"%s",\n  "candidate_worker_sha256":"%s",\n  "node":"%s",\n  "telegram_lifecycle_persistence_only":true,\n  "telegram_lifecycle_dispatch_enabled":true,\n  "telegram_v3_network_enabled":false,\n  "production_changed":false,\n  "remote_d1_changed":false\n}\n' "$BASE_MAIN_SHA" "$R8_WORKER_SHA" "$(node -p 'process.versions.node')" > .v3-r8-integration/R8_NODE24_PASS_PROOF.json
      - name: D1 read-only preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          node .v3-r8-integration/d1-bridge-check.mjs | tee .v3-r8-integration/D1_PRECHECK_ONLY.json
          grep -q '"remote_d1_changed": false' .v3-r8-integration/D1_PRECHECK_ONLY.json
      - name: Self-test and apply additive V3 shadow schema
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .v3-r8-integration/apply_v3_migrations_r8.py --self-test | tee .v3-r8-integration/MIGRATION_SELF_TEST.log
          grep -q '^V3_MIGRATION_SELF_TEST=PASS' .v3-r8-integration/MIGRATION_SELF_TEST.log
          python3 .v3-r8-integration/apply_v3_migrations_r8.py --check | tee .v3-r8-integration/D1_PRE_MIGRATION.log
          grep -q '^V3_D1_MIGRATION_CHECK=PASS$' .v3-r8-integration/D1_PRE_MIGRATION.log
          python3 .v3-r8-integration/apply_v3_migrations_r8.py --apply | tee .v3-r8-integration/D1_MIGRATION.log
          grep -q '^V3_D1_MIGRATION_RESULT=PASS$' .v3-r8-integration/D1_MIGRATION.log
          echo "V3_D1_SCHEMA=APPLIED_READBACK_PASS"
          echo "PRODUCTION_MAIN_CHANGED=NO"
      - name: Emit exact R8 runner and encrypted candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$REPORT2_PAYLOAD_KEY"
          test "${#REPORT2_PAYLOAD_KEY}" -eq 64
          python3 "$R8_ROOT/overlay/tools/patch_cloud_runner_v3.py" "$GITHUB_WORKSPACE" --worker-sha "$R8_WORKER_SHA" --emit-dir .v3-r8-integration/emitted | tee .v3-r8-integration/PATCH_EMIT.log
          grep -q 'runV3RealizedLiquidationSidecar' .v3-r8-integration/emitted/runner-main.mjs
          ! grep -q 'critical_feed_state:"OK"' .v3-r8-integration/emitted/runner-main.mjs
          grep -q 'controlled_no_telegram:' .v3-r8-integration/emitted/report2.yml
          grep -q 'inputs.controlled_no_telegram == true' .v3-r8-integration/emitted/report2.yml
          grep -q 'REPORT2_V3_TELEGRAM_JOURNAL_ENABLED: "1"' .v3-r8-integration/emitted/report2.yml
          grep -q 'REPORT2_V3_TELEGRAM_NETWORK_ENABLED: "0"' .v3-r8-integration/emitted/report2.yml
          grep -q 'runV3TelegramDeliverySidecar' .v3-r8-integration/emitted/runner-main.mjs
          grep -q 'enabled: v3TelegramNetworkEnabled ? "0"' .v3-r8-integration/emitted/runner-main.mjs
          rm -rf .v3-r8-integration/candidate
          mkdir -p .v3-r8-integration/candidate
          unzip -q "$R8_ROOT/authoritative/MY_REPORT_2_AUTHORITATIVE_SOURCE_R9_TZ10_1_20260917.zip" -d .v3-r8-integration/candidate
          cp -R "$R8_ROOT/overlay/." .v3-r8-integration/candidate/
          test "$(sha256sum .v3-r8-integration/candidate/src/worker.js | awk '{print $1}')" = "$R8_WORKER_SHA"
          tar -czf .v3-r8-integration/report2-runtime.tar.gz -C .v3-r8-integration/candidate .
          node runner/payload-crypto.mjs encrypt .v3-r8-integration/report2-runtime.tar.gz "$REPORT2_PAYLOAD_KEY" .v3-r8-integration/report2-runtime.enc
          rm -f .v3-r8-integration/report2-runtime.tar.gz
          sha256sum .v3-r8-integration/report2-runtime.enc .v3-r8-integration/emitted/runner-main.mjs .v3-r8-integration/emitted/report2.yml | tee .v3-r8-integration/ARTIFACT_SHA256.txt
      - name: Decrypt exact R8 candidate runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .v3-r8-integration/runtime
          mkdir -p .v3-r8-integration/runtime
          node runner/payload-crypto.mjs decrypt .v3-r8-integration/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" .v3-r8-integration/runtime/payload.tar.gz
          tar -xzf .v3-r8-integration/runtime/payload.tar.gz -C .v3-r8-integration/runtime
          rm -f .v3-r8-integration/runtime/payload.tar.gz
          cp .v3-r8-integration/emitted/runner-main.mjs .v3-r8-integration/runtime/runner-main.mjs
          cp runner/report2-d1-adapter.mjs .v3-r8-integration/runtime/report2-d1-adapter.mjs
          cp runner/d1-preaction-budget-guard.mjs .v3-r8-integration/runtime/d1-preaction-budget-guard.mjs
          cp runner/telegram-zero-reason.mjs .v3-r8-integration/runtime/telegram-zero-reason.mjs
          cp runner/telegram-output.mjs .v3-r8-integration/runtime/telegram-output.mjs
          test "$(sha256sum .v3-r8-integration/runtime/src/worker.js | awk '{print $1}')" = "$R8_WORKER_SHA"
          echo "CONTROLLED_R8_RUNTIME_SHA=PASS"
      - name: Run one controlled R8 real-data cycle with Telegram disabled
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$REPORT2_EXPECTED_WORKER_SHA" = "$R8_WORKER_SHA"
          echo "CONTROLLED_R8_EXPECTED_WORKER_SHA=PASS"
          cd .v3-r8-integration/runtime
          node runner-main.mjs | tee ../CONTROLLED_R8_RUN.log
      - name: Audit controlled R8 cycle and V3 lifecycle safety
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .v3-r8-integration/audit_controlled_run_r8.py .v3-r8-integration/CONTROLLED_R8_RUN.log | tee .v3-r8-integration/CONTROLLED_R8_RUN_PROOF.json
          grep -q '^CONTROLLED_R8_RUN_PROOF=PASS$' .v3-r8-integration/CONTROLLED_R8_RUN_PROOF.json
          python3 .v3-r8-integration/post_run_d1_audit_r8.py .v3-r8-integration/CONTROLLED_R8_RUN.log | tee .v3-r8-integration/POST_RUN_D1_AUDIT.json
          grep -q '^R8_POST_RUN_D1_AUDIT=PASS$' .v3-r8-integration/POST_RUN_D1_AUDIT.json
          echo "TELEGRAM_SENT=NO"
      - name: Final main immutability check
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          echo "PRODUCTION_MAIN_CHANGED=NO"
          PAYLOAD_SHA="$(sha256sum .v3-r8-integration/report2-runtime.enc | awk '{print $1}')"
          RUNNER_SHA="$(sha256sum .v3-r8-integration/emitted/runner-main.mjs | awk '{print $1}')"
          WORKFLOW_SHA="$(sha256sum .v3-r8-integration/emitted/report2.yml | awk '{print $1}')"
          printf '{\n  "status":"CONTROLLED_R8_INTEGRATION_PASS_NOT_DEPLOYED",\n  "base_main":"%s",\n  "candidate_worker_sha256":"%s",\n  "promotion_payload_sha256":"%s",\n  "promotion_runner_sha256":"%s",\n  "promotion_workflow_sha256":"%s",\n  "production_main_changed":false,\n  "telegram_sent":false\n}\n' "$BASE_MAIN_SHA" "$R8_WORKER_SHA" "$PAYLOAD_SHA" "$RUNNER_SHA" "$WORKFLOW_SHA" > .v3-r8-integration/CONTROLLED_R8_PASS_PROOF.json
      - name: Upload controlled R8 proof
        uses: actions/upload-artifact@v4
        with:
          name: report2-v3-r8-controlled-integration-proof
          if-no-files-found: error
          retention-days: 7
          path: |
            .v3-r8-integration/R8_NODE24_PASS_PROOF.json
            .v3-r8-integration/NODE24_READINESS.log
            .v3-r8-integration/NODE24_READINESS_RESULT.txt
            .v3-r8-integration/D1_PRECHECK_ONLY.json
            .v3-r8-integration/MIGRATION_SELF_TEST.log
            .v3-r8-integration/D1_PRE_MIGRATION.log
            .v3-r8-integration/D1_MIGRATION.log
            .v3-r8-integration/ARTIFACT_SHA256.txt
            .v3-r8-integration/PATCH_EMIT.log
            .v3-r8-integration/report2-runtime.enc
            .v3-r8-integration/emitted/runner-main.mjs
            .v3-r8-integration/emitted/report2.yml
            .v3-r8-integration/CONTROLLED_R8_RUN.log
            .v3-r8-integration/CONTROLLED_R8_RUN_PROOF.json
            .v3-r8-integration/POST_RUN_D1_AUDIT.json
            .v3-r8-integration/CONTROLLED_R8_PASS_PROOF.json
