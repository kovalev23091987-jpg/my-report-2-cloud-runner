name: Report2 Original Scenario Diagnostic
on:
  push:
    branches: [codex/original-plan-diagnostic-20261006]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fresh owner before tests and replay
        uses: actions/github-script@v7
        with:
          script: |
            const head=(await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:'heads/main'})).data.object.sha;
            if(head!=='d1cb5079c9483ae4f118eba052ffd148a197961b')throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:head})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json'),fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            if(phase.lease?.owner!=='HTX:20261006T054447932Z:general-plan-diagnostic'||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Assemble exact runtime
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Read exact pre-change adapter for unchanged-behavior comparison
        uses: actions/github-script@v7
        with:
          script: |
            const file=(await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:'current-generation/files/src/canonical-runtime-adapter.mjs',ref:'b8712e9ec9021dda3eaa6b10b9c34c5be9feeb19'})).data;
            require('fs').writeFileSync('runtime/src/plan-before-diagnostic.mjs',Buffer.from(file.content,'base64'));
      - name: Verify current binding, generation and lifecycle policy
        run: |
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          node current-generation/validate.mjs > audit-output/validation.json 2> audit-output/validation-errors.txt
          REPORT2_TEST_RUNTIME=runtime node --test current-generation/tests/observation-plan-diagnostic.runtime.mjs > audit-output/observation-plan-diagnostic.tap
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
      - name: Exact package hashes
        if: always()
        run: |
          git rev-parse HEAD > audit-output/head.txt
          git rev-parse HEAD^{tree} > audit-output/tree.txt
          sha256sum runtime/src/worker.js runtime/src/prospective-opportunity-view.mjs runtime/src/opportunity-intelligence-engine.mjs runtime/src/canonical-runtime-adapter.mjs runtime/src/manual-report-formatter.mjs > audit-output/runtime-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-plan-diagnostic-${{ github.run_id }}
          path: audit-output/
          retention-days: 30

