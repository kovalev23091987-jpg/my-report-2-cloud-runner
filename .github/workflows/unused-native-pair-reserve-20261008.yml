name: Report2 Finish Native Position Clock With Unusable Pair Reserve
on:
  push:
    branches: [codex/native-unused-pair-reserve-20261008]
    paths: ['current-generation/**', '.github/workflows/unused-native-pair-reserve-20261008.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
