name: Report 2 Useful Block Results
on:
  push:
    branches: [autonomous/block-results-20261004, autonomous/block-results-followup-20261004, autonomous/block-small-benefit-20261004, autonomous/unified-block-output-20261004, autonomous/canonical-execution-output-20261004, autonomous/native-supply-batch-20261004, autonomous/shared-sector-batch-20261004, autonomous/remaining-block-facts-20261004, autonomous/crypto-scope-repair-20261004, autonomous/technical-native-facts-20261004, autonomous/cloud-phase-gate-20261004, autonomous/options-risk-batch-20261004]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble exact candidate
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          mkdir -p runtime audit-output
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/assembly.json
          npm ci --prefix runtime/src/liquidation-extension --ignore-scripts --no-audit --no-fund
      - name: Verify inherited checks and actual result consumption
        run: |
          node --test runner/continuation-stage-gate.test.mjs > audit-output/continuation-stage-gate.tap
          node runner/continuation-stage-gate.mjs status > audit-output/continuation-stage-state.json
          node runner/current-runtime-binding.mjs --runtime runtime > audit-output/binding.json
          node current-generation/validate.mjs > audit-output/validation.json
          node --import ./current-generation/tests/early-evidence-repair/no-network.mjs --test current-generation/tests/early-evidence-repair/repair.test.mjs telegram-repair-tests/v3-early-sidecar.test.mjs > audit-output/early-repair.tap
          for suite in approved-entry-path approved-entry-performance decision-timeline early-observation-state prospective-public-history public-collector-history-consumer stage392-persistence-contract; do
            node --import ./current-generation/tests/early-evidence-repair/no-network.mjs "current-generation/tests/$suite.runtime.mjs" runtime >> audit-output/runtime-controls.jsonl
          done
          node audit-fixes/v13/final-integration-37.mjs runtime > audit-output/integration.json
          node audit-fixes/block-results-20261004/replay.mjs runtime > audit-output/rendered-context-replay.json
          node audit-fixes/block-use-audit-20261004/replay.mjs runtime > audit-output/decision-use-replay.json
          REPORT2_UNIFIED_MODULE_ROOT=runtime/src node --test current-generation/tests/unified-block-output.test.mjs > audit-output/unified-block-output.tap
          REPORT2_NATIVE_MODULE_ROOT=runtime/src node --test current-generation/tests/native-supply-batch.test.mjs > audit-output/native-supply-batch.tap
          REPORT2_SECTOR_MODULE_ROOT=runtime/src node --test current-generation/tests/shared-sector-batch.test.mjs > audit-output/shared-sector-batch.tap
          REPORT2_OPTIONS_MODULE_ROOT=runtime/src node --test current-generation/tests/deribit-option-risk-batch.test.mjs > audit-output/options-risk-batch.tap
          node audit-fixes/source-optimization-20260930/runtime-manifest.mjs runtime audit-output/runtime-manifest.json
      - name: Recover already collected live data without new source calls
        if: github.ref == 'refs/heads/autonomous/block-small-benefit-20261004'
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node audit-fixes/block-results-20261004/recover-live-result.mjs runtime
      - name: Verify repaired option route within existing source quota
        if: github.ref == 'refs/heads/autonomous/block-small-benefit-20261004'
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node audit-fixes/block-results-20261004/verify-options-route.mjs runtime
      - name: Verify exact native route within existing source quota
        if: github.ref == 'refs/heads/autonomous/native-supply-batch-20261004'
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node audit-fixes/block-results-20261004/verify-native-supply-route.mjs runtime
      - name: Verify shared references and read current runtime state within source quota
        if: github.ref == 'refs/heads/autonomous/shared-sector-batch-20261004'
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_SUPPLEMENTAL_IDENTITY_REGISTRY_JSON: ${{ secrets.REPORT2_SUPPLEMENTAL_IDENTITY_REGISTRY_JSON }}
          REPORT2_REFERENCE_AUDIT_REPLAY: '1'
        run: node audit-fixes/block-results-20261004/verify-shared-sector-route.mjs runtime
      - name: Verify all current crypto routes and remaining factual contexts
        if: github.ref == 'refs/heads/autonomous/remaining-block-facts-20261004'
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_SUPPLEMENTAL_IDENTITY_REGISTRY_JSON: ${{ secrets.REPORT2_SUPPLEMENTAL_IDENTITY_REGISTRY_JSON }}
        run: node audit-fixes/remaining-block-facts-20261004/verify-live.mjs runtime
      - name: Verify all three HTX crypto catalogs and exact shared facts
        if: github.ref == 'refs/heads/autonomous/crypto-scope-repair-20261004'
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node audit-fixes/crypto-scope-repair-20261004/verify-live.mjs runtime
      - name: Verify all margin modes, shared real price facts and exact native supplies
        if: github.ref == 'refs/heads/autonomous/technical-native-facts-20261004'
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node audit-fixes/technical-native-facts-20261004/verify-live.mjs runtime
      - name: Verify actual scoped option risk for the complete common futures asset universe
        if: github.ref == 'refs/heads/autonomous/options-risk-batch-20261004'
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
          REPORT2_CONTINUATION_OWNER: 'HTX:20261004T1811:bc2e6615'
        run: node audit-fixes/options-risk-batch-20261004/verify-live.mjs runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: useful-block-results-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
