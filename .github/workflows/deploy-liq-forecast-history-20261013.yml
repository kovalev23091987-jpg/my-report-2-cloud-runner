name: Deploy isolated LIQ forecast history Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact main owner lease and fence
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(main!==context.sha)throw Error('MAIN_MOVED');
            const read=async path=>JSON.parse(Buffer.from((await github.rest.repos.getContent({owner,repo,path,ref:main})).data.content,'base64').toString());
            const phase=await read('checkpoints/CLOUD_PHASE_STATE_20261004.json');
            const fence=await read('audit-fixes/source-optimization-20260930/execution-lock.json');
            const privateOwner=/^CODEX:PRIVATE_RESTORE_AND_ACTIVE_SOURCE_AUDIT:\d+$/.test(phase.lease?.owner||'')&&phase.current_task==='LIQ_MAXIMUM_USEFUL_COVERAGE_IN_PROGRESS'&&phase.latest_own_bounded_continuation_lease?.owner===phase.lease.owner;
            if(!(/^CODEX:LIQ_[A-Z0-9_]+:\d+$/.test(phase.lease?.owner||'')||privateOwner)||phase.lease.expires_ts<=Date.now()||fence.active)throw Error('OWNER_OR_FENCE_BLOCKED');
      - name: Verify isolated archive and source-clock guards
        run: node --test cloudflare/free-history/*.test.mjs current-generation/tests/liquidation-forecast-memory.test.mjs
      # The schema is provisioned separately through the Cloudflare D1 query API.
      # The repository deploy token can publish Workers but lacks D1 import scope.
      - name: Deploy independent free history Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config cloudflare/free-history/wrangler-liq.json
