name: Exact current recovery obstacle diagnosis
on:
  workflow_dispatch:
    inputs:
      expected_main:
        required: true
        type: string
      expected_owner:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: report2-exact-39122290584-recovery-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read exact persisted finalists and one admitted current HTX catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT2_EXPECTED_MAIN: ${{ inputs.expected_main }}
          REPORT2_EXPECTED_OWNER: ${{ inputs.expected_owner }}
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/diagnose-exact-recovery-20261018.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-recovery-diagnosis-${{ github.run_id }}
          path: audit-output/exact-recovery-diagnosis/
          retention-days: 90
