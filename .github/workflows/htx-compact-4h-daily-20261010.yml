name: Bounded HTX compact 90d 4h history (shared source cap)
on:
  push:
    branches: [codex/htx-compact-90d-coarse-history-20261010]
    paths:
      - runner/htx-compact-4h-history.mjs
      - runner/htx-compact-4h-history.test.mjs
      - tools/acquire-htx-compact-4h-history.mjs
      - .github/workflows/htx-compact-4h-daily-20261010.yml
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact offline 90d coarse history, daily ZIP and no-ENTRY safety tests
        run: |
          set -e
          node --check runner/htx-compact-4h-history.mjs
          node --check tools/acquire-htx-compact-4h-history.mjs
          node --test runner/htx-compact-4h-history.test.mjs runner/htx-cold-history-backfill-plan.test.mjs
          python3 tools/validate-htx-native-zip.py --self-test
  acquire:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: report2-htx-compact-4h-shared-source-ledger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: CAS acquire own bounded lease across all four mirrors
        id: lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/compact-history-github-control.mjs acquire
      - name: Check out exact leased main commit
        if: steps.lease.outputs.acquired == 'true'
        run: |
          set -e
          git fetch origin "${{ steps.lease.outputs.head }}"
          git checkout -B main "${{ steps.lease.outputs.head }}"
          git rev-parse HEAD > /tmp/htx-compact-tested-head
      - name: Fetch up to six HTX native 4h histories with original shared D1 source cap
        if: steps.lease.outputs.acquired == 'true'
        env:
          REPORT2_D1_BRIDGE_URL: ${{ secrets.REPORT2_D1_BRIDGE_URL }}
          REPORT2_D1_BRIDGE_TOKEN: ${{ secrets.REPORT2_D1_BRIDGE_TOKEN }}
        run: node tools/acquire-htx-compact-4h-history.mjs
      - name: Retain source responses and admission receipts even on failure
        if: always() && steps.lease.outputs.acquired == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: htx-compact-4h-${{ github.run_id }}
          path: |
            audit-output/htx-compact-4h/
            checkpoints/htx-compact-4h/
          retention-days: 90
      - name: Confirm exact own four-mirror lease, fence and pinned source head
        if: success() && steps.lease.outputs.acquired == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/compact-history-github-control.mjs guard
      - name: Persist exact raw/normalized compressed price-only bytes and per-asset manifests
        if: success() && steps.lease.outputs.acquired == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -d checkpoints/htx-compact-4h ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f checkpoints/htx-compact-4h/
            if ! git diff --cached --quiet; then
              git commit -m 'Retain admitted HTX compact 4h source receipts and historical prices'
              node tools/compact-history-github-control.mjs persist
            fi
          fi
      - name: Release only own exact four-mirror lease and retain measured batch status
        if: always() && steps.lease.outputs.acquired == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/compact-history-github-control.mjs release
