name: Inspect exact own archive binding mismatch
on:
  push:
    branches: [fix/free-archive-binding-resume-20261015]
    paths: [checkpoints/FREE_ARCHIVE_BINDING_DIAGNOSIS_REQUEST_20261015.json]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/inspect-free-archive-bindings-20261015.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-archive-bindings-${{ github.run_id }}
          path: audit-output/free-archive-bindings/proof.json
          retention-days: 30
