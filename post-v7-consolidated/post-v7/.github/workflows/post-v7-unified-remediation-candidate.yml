name: Post-V7 unified remediation candidate
on:
  push:
    branches: ['post-v7-unified-remediation-candidate-20260926']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: post-v7-unified-remediation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPORT2_POST_V7_UNIFIED_ENABLED: "0"
      REPORT2_ANALYTICS_ACTOR: "GITHUB_ACTIONS"
      REPORT2_V3_TELEGRAM_NETWORK_ENABLED: "0"
      REPORT2_TELEGRAM_OUTPUT_ENABLED: "0"
      REPORT2_TELEGRAM_SHADOW_DECISION_AUTO: "0"
      REPORT2_TRADING_EXECUTION_ENABLED: "0"
      REPORT2_VALIDATED_SIGNAL_ENABLED: "0"
      REPORT2_LIVE_PROBABILITY_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Exact protected base and allowed paths
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='f7c5c77acfc2640c2c9b396d61560d33bf4fa263'
          test "$(git rev-parse HEAD^)" = "$BASE"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE"
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          for p in "${changed[@]}"; do
            case "$p" in
              post-v7-unified-remediation/*|runner/runner-main.mjs|early-surfacing-v7/validation/production-self-audit.mjs|.github/workflows/report2.yml|.github/workflows/post-v7-unified-remediation-candidate.yml) ;;
              *) echo "PROTECTED_PATH_CHANGED:$p" >&2; exit 41 ;;
            esac
          done
      - name: Static schedule and safety contract
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'cron: "2,14,26,38,50 * * * *"' .github/workflows/report2.yml
          grep -F 'REPORT2_D1_RUNS_PER_DAY: "120"' .github/workflows/report2.yml
          grep -F 'REPORT2_POST_V7_UNIFIED_ENABLED: "0"' .github/workflows/report2.yml
          grep -F 'REPORT2_ANALYTICS_ACTOR: "GITHUB_ACTIONS"' .github/workflows/report2.yml
          grep -F 'post-v7-unified-remediation/overlay/apply-post-v7-unified-overlay.mjs runtime' .github/workflows/report2.yml
          grep -F "runBoundTelegramDeliverySidecar" runner/runner-main.mjs
          grep -F "claimMaintenanceCadence" runner/runner-main.mjs
          grep -F "postV7CriticalLaneReserve" runner/runner-main.mjs
          grep -F "source_run_id:String(cron.run_id||\"\")" runner/runner-main.mjs
          grep -F "WITH latest AS" early-surfacing-v7/validation/production-self-audit.mjs
          ! grep -F 'score_collapse_is_observed_not_hidden=Number(proof.facts.score_shape?.n||0)>=0' early-surfacing-v7/validation/production-self-audit.mjs
          node --check runner/runner-main.mjs
      - name: Reconstruct exact V7 runtime and apply remediation
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf runtime && mkdir runtime
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          cp runner/runner-main.mjs runtime/runner-main.mjs
          cp runner/r8-20-prospective-validation-sidecar.mjs runtime/r8-20-prospective-validation-sidecar.mjs
          cp runner/report2-d1-adapter.mjs runtime/report2-d1-adapter.mjs
          cp runner/d1-preaction-budget-guard.mjs runtime/d1-preaction-budget-guard.mjs
          cp runner/telegram-zero-reason.mjs runtime/telegram-zero-reason.mjs
          cp runner/plain-text-telegram.mjs runtime/plain-text-telegram.mjs
          cp runner/telegram-output.mjs runtime/telegram-output.mjs
          cp runner/telegram-info-runtime.mjs runtime/telegram-info-runtime.mjs
          node runner/apply-telegram-runtime-overlay.mjs runtime runner/telegram-runtime-overlay.json
          node cross-venue-delta-overlay/apply-runtime-overlay.mjs runtime
          node architecture-cleanup-delta/canonical-final-overlay/apply-canonical-final-overlay.mjs runtime
          node existing-source-consumer-delta/overlay/apply-existing-source-consumer-overlay.mjs runtime
          node existing-source-coverage-delta/overlay/apply-existing-source-coverage-overlay.mjs runtime
          node existing-source-history-sequence-delta/overlay/apply-existing-source-history-sequence-overlay.mjs runtime
          node existing-source-closure-audit-delta/overlay/apply-existing-source-closure-audit-overlay.mjs runtime
          node existing-source-fact-contract-delta/overlay/apply-existing-source-fact-contract-overlay.mjs runtime
          node existing-source-hyperliquid-recorder-delta/overlay/apply-existing-source-hyperliquid-recorder-overlay.mjs runtime
          node existing-source-preselection-router-delta/overlay/apply-existing-source-preselection-router-overlay.mjs runtime
          node output-surface-contract-delta/overlay/apply-output-surface-contract-overlay.mjs runtime
          node snapshot-diff-delta/overlay/apply-snapshot-diff-overlay.mjs runtime
          node consolidated-remaining-delta/overlay/apply-consolidated-remaining-overlay.mjs runtime
          node telegram-tz-reconciliation-fix/overlay/apply-telegram-tz-reconciliation-overlay.mjs runtime
          node early-surfacing-v7/apply-early-surfacing-v7-overlay.mjs runtime
          test "$(sha256sum runtime/src/worker.js | awk '{print $1}')" = 'a2b3c2d364202b3cbbd3a40407733cb5d385f01b70e43786066fbeb84bb25225'
          test "$(sha256sum runtime/src/canonical-runtime-adapter.mjs | awk '{print $1}')" = '0f74fa78339a676f65fff06cf968a638b8b33af25ff4dfbde3c7caea1d48245f'
          node post-v7-unified-remediation/overlay/apply-post-v7-unified-overlay.mjs runtime | tee post-v7-overlay.log
          test "$(sha256sum runtime/src/worker.js | awk '{print $1}')" = 'd4310484b937d26f1836e51228c53584a72a537bc42538dae869e7ec6a80b922'
          test "$(sha256sum runtime/src/canonical-runtime-adapter.mjs | awk '{print $1}')" = 'fe7cde5da24ff5b5114d666b7b1f2b1fb1c2494aff1fc5701b5e208b0d42b9c4'
          test "$(sha256sum runtime/src/full-evidence-contract.mjs | awk '{print $1}')" = '82cb109313f7c87bcc4c7d1dbd461de8b3c5fe94b8cb687b417bd0c600a96a4a'
          node --check runtime/src/worker.js
          node --check runtime/src/canonical-runtime-adapter.mjs
          node --check runtime/src/canonical-publication.mjs
          node --check runtime/src/bound-telegram-delivery-sidecar.mjs
          node --check runtime/src/recheck-scheduler.mjs
          grep -F 'ON CONFLICT(full_evidence_id) DO NOTHING' runtime/src/worker.js
          ! grep -F 'INSERT OR IGNORE INTO full_evidence_shadow_log' runtime/src/worker.js
          grep -F 'SCHEMA_NOT_CLOSED' runtime/src/worker.js
          grep -F 'LIVE_RECHECK' runtime/src/worker.js
      - name: Post-V7 focused and negative suite
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test --test-reporter=tap post-v7-unified-remediation/tests/*.test.mjs > post-v7-focused.tap
          grep -F '# fail 0' post-v7-focused.tap >/dev/null
          grep -F '# tests 77' post-v7-focused.tap >/dev/null
      - name: Retained V7 and Telegram regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test --test-reporter=tap early-surfacing-v7/tests/*.test.mjs > retained-v7.tap
          grep -F '# fail 0' retained-v7.tap >/dev/null
          rm -rf runtime/telegram-repair-tests
          cp -R telegram-repair-tests runtime/telegram-repair-tests
          cp runner/apply-telegram-runtime-overlay.mjs runtime/apply-telegram-runtime-overlay.mjs
          cp runner/telegram-readonly-diagnostic.mjs runtime/telegram-readonly-diagnostic.mjs
          cd runtime
          node --test --test-reporter=tap telegram-repair-tests/*.test.mjs > telegram-retained.tap
          grep -F '# fail 0' telegram-retained.tap >/dev/null
      - name: Inherited production regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cp cross-venue-delta-overlay/tests/*.mjs runtime/tests/
          cp unified-entry-signal-delta/overlay/runtime-test-overrides/*.mjs runtime/tests/
          cp runner/apply-telegram-runtime-overlay.mjs runner/r8-20-prospective-validation-sidecar.mjs runner/telegram-info-runtime.mjs runner/telegram-output.mjs runner/telegram-zero-reason.mjs runner/plain-text-telegram.mjs runner/telegram-readonly-diagnostic.mjs runner/report2-d1-adapter.mjs runner/d1-preaction-budget-guard.mjs runtime/
          cd runtime
          mapfile -t regression_files < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'deep-check-journal.CHECKPOINT-full-evidence-shadow-production.test.mjs' ! -name 'deep-check-journal.CHECKPOINT-shadow-decision-layer-production.test.mjs' ! -name 'deep-check-journal.CHECKPOINT-shadow-outcome-calibration-production.test.mjs' ! -name 'htx-liquidation-budget.test.mjs' ! -name 'v3-telegram-lifecycle-sidecar.test.mjs' ! -name 'v3-telegram-lifecycle-sidecar-sqlite.test.mjs' ! -name 'v3-early-sidecar-budget.test.mjs' ! -name 'v3-r88-adaptive-budget.test.mjs' -print | sort)
          node --test --test-reporter=tap "${regression_files[@]}" > inherited-regression.tap
          grep -F '# fail 0' inherited-regression.tap >/dev/null
      - name: Candidate safety proof
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${REPORT2_POST_V7_UNIFIED_ENABLED}" = "0"
          test "${REPORT2_V3_TELEGRAM_NETWORK_ENABLED}" = "0"
          grep -F '"automatic_execution": false' runtime/post-v7-unified-overlay-proof.json
          grep -F '"d1_migration": false' runtime/post-v7-unified-overlay-proof.json
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = 'f7c5c77acfc2640c2c9b396d61560d33bf4fa263'
      - name: Save proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-v7-unified-remediation-proof
          path: |
            post-v7-focused.tap
            retained-v7.tap
            runtime/telegram-retained.tap
            runtime/inherited-regression.tap
            runtime/post-v7-unified-overlay-proof.json
            post-v7-overlay.log
          retention-days: 30
