name: Post-V7 consolidated full candidate
on:
  push:
    branches: ['post-v7-consolidated-candidate-20260927-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: post-v7-full-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPORT2_POST_V7_UNIFIED_ENABLED: "0"
      REPORT2_LIQUIDATION_EXTENSION_MODE: "OFF"
      REPORT2_V3_TELEGRAM_NETWORK_ENABLED: "0"
      REPORT2_TELEGRAM_OUTPUT_ENABLED: "0"
      REPORT2_TELEGRAM_SHADOW_DECISION_AUTO: "0"
      REPORT2_TRADING_EXECUTION_ENABLED: "0"
      REPORT2_VALIDATED_SIGNAL_ENABLED: "0"
      REPORT2_LIVE_PROBABILITY_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact current base and complete package integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          node post-v7-consolidated/full-validation/candidate-contract.mjs .
      - name: Decrypt authoritative source only
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$REPORT2_PAYLOAD_KEY"
          test ! -e runtime
          mkdir runtime
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
      - name: Reconstruct full runtime in protected order
        shell: bash
        run: |
          set -Eeuo pipefail
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > post-v7-consolidated/proof/ci-reconstruction.json
          test "$(sha256sum runtime/src/worker.js | cut -d ' ' -f 1)" = '940bb12428f320bf248fadd2acd45399af705e144440750973551e5a935f7cc2'
          cmp runner/runner-main.mjs runtime/runner-main.mjs
      - name: Complete offline production and integration regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node post-v7-consolidated/full-validation/run-all.mjs . runtime
      - name: Recheck unchanged main after validation
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = 'f7c5c77acfc2640c2c9b396d61560d33bf4fa263'
      - name: Save complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-v7-full-candidate-proof
          path: |
            post-v7-consolidated/proof/
            post-v7-consolidated/liquidation/liquidation-extension/validation-runs/
            runtime/post-v7-unified-overlay-proof.json
            runtime/postv7-liquidation-extension-proof.json
            runtime/full-runtime-reconciliation-proof.json
          if-no-files-found: error
          retention-days: 30
