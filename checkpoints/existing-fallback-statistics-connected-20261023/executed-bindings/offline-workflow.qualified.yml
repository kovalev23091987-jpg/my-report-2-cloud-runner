name: LIQ assembled spot and 105 admission offline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-fallback-statistics-new-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact current ROOT phase, lease, all4 and fence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node checkpoints/existing-fallback-statistics-connected-20261023/qualification-guard.mjs
      - name: One FIRST new connected existing-blocks case
        run: node --test --test-reporter=spec checkpoints/existing-fallback-statistics-connected-20261023/connected-common.mjs > audit-output/existing-fallback-statistics-connected/node-spec.log 2>&1
      - name: Save completed component before following assertions or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-fallback-statistics-first-${{ github.run_id }}
          path: audit-output/existing-fallback-statistics-connected/
          if-no-files-found: error
          retention-days: 30
