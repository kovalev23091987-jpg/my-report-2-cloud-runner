permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.ref != 'refs/heads/work/post597-native-bundle-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check current owner lease and fence
        uses: actions/github-script@v7
        with:
          script: |
