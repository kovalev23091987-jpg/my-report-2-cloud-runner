  native_anomaly_domain_connected:
    if: ${{ github.ref == 'refs/heads/work/post597-native-bundle-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact own scope before FIRST native anomaly kernel qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/guard-native-domain-connected-20261021.mjs before
      - name: ONLY failed late assembled hash guard repair; completed16groups NOT executed again
        env:
          REPORT2_PAYLOAD_KEY: ${{ secrets.REPORT2_PAYLOAD_KEY }}
        run: |
          set -euo pipefail
          mkdir -p runtime audit-output/native-domain-connected
          node runner/payload-crypto.mjs decrypt payload/report2-runtime.enc "$REPORT2_PAYLOAD_KEY" runtime/payload.tar.gz
          tar -xzf runtime/payload.tar.gz -C runtime
          rm runtime/payload.tar.gz
          node post-v7-consolidated/full-validation/apply-all-runtime.mjs runtime . > audit-output/native-domain-connected/assembly.json
      - name: Exact own scope and assembled modules after FIRST case
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/guard-native-domain-connected-20261021.mjs after
      - name: Remove private contract input and assembled runtime before artifact upload
        if: ${{ always() }}
        run: |
          rm -rf runtime contract-input
          mkdir -p audit-output/native-domain-connected
          python3 -c 'import pathlib,json; pathlib.Path("audit-output/native-domain-connected/private-input-cleanup.json").write_text(json.dumps({"runtime_removed":not pathlib.Path("runtime").exists(),"private_input_removed":not pathlib.Path("contract-input").exists(),"private_input_exported":False})+"\n")'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: native-domain-connected-${{ github.run_id }}
          path: audit-output/native-domain-connected/
          if-no-files-found: error
          retention-days: 30

